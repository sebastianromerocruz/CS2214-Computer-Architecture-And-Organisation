<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | Multicycle and Pipelining | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* One deck for the whole Multicycle and Pipelining lecture, on the 07 deck's step engine.
     Arrow keys step, shift + arrow jumps a section. It follows the lecture README beat by beat:
     the same order, the same examples, and the README's own wording in the narration.
     Open with #3.5. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 10px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 10px;
    font-size: 18px;
    line-height: 1.3;
    min-height: 52px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">10</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">
    <span class="num" id="num"></span>
    <h1 id="title">Multicycle and Pipelining</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="372"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">Multicycle and Pipelining</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenePost(def); scenes.push(def); }


  // ---- split any narration that is too long for one slide into several consecutive steps (same visual, next chunk of text)
  const MAX_WORDS = 50;
  function plainWords(h) { return h.replace(/<[^>]*>/g, " ").replace(/&[a-z#0-9]+;/gi, "x").split(/\s+/).filter(Boolean).length; }
  function balanced(h) {
    return ["strong", "em", "code"].every((t) => (h.match(new RegExp("<" + t + ">", "g")) || []).length === (h.match(new RegExp("</" + t + ">", "g")) || []).length);
  }
  function splitNarr(h) {
    if (plainWords(h) <= MAX_WORDS) return [h];
    const sents = [];
    const re = /([.?!])((?:<\/[a-z]+>)*)(\s+)/g;
    let last = 0, m;
    while ((m = re.exec(h))) {
      if (/e\.g\.|i\.e\./.test(h.slice(Math.max(0, m.index - 3), m.index + 2))) continue;
      const end = m.index + m[1].length + m[2].length;
      sents.push(h.slice(last, end));
      last = m.index + m[0].length;
    }
    sents.push(h.slice(last));
    const total = plainWords(h), k = Math.ceil(total / MAX_WORDS), target = total / k;
    const out = [];
    let cur = "";
    sents.filter((x) => x.trim()).forEach((x) => {
      if (cur && balanced(cur) && plainWords(cur) >= target * 0.85) { out.push(cur); cur = x; }
      else cur = cur ? cur + " " + x : x;
    });
    if (cur) out.push(cur);
    if (out.length > 1 && plainWords(out[out.length - 1]) < 14) { const lastc = out.pop(); out[out.length - 1] += " " + lastc; }
    for (let i = 0; i < out.length - 1; i++) if (!balanced(out[i])) { out[i + 1] = out[i] + " " + out[i + 1]; out.splice(i, 1); i--; }
    return out;
  }
  function expandSteps(steps) {
    const res = [];
    steps.forEach((st) => {
      if (!st.narrate) { res.push(st); return; }
      splitNarr(st.narrate).forEach((chunk) => res.push(Object.assign({}, st, { narrate: chunk })));
    });
    return res;
  }
  // every section 1 to 9 gets a closing card with what the student should be able to do, then long narrations are split
  function scenePost(def) {
    const k = SKILLS[def.num];
    if (k) def.steps = def.steps.concat([{ sub: "card", card: cd("What you should be able to do", k.lines), chip: (def.chips || []).length, foot: "", narrate: "<strong>What you should be able to do after this section:</strong> " + k.text }]);
    def.steps = expandSteps(def.steps);
  }
  // ---------- helpers for this deck ----------
  const ASSET = "fig/";
  function figScene(cfg) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { imgs: {} };
        cfg.steps.forEach((s) => {
          if (!s.img || r.imgs[s.img]) return;
          const im = E("image", { x: 0, y: 0, width: 1150, height: 400, preserveAspectRatio: "xMidYMid meet" }, g);
          im.setAttributeNS("http://www.w3.org/1999/xlink", "href", ASSET + s.img);
          im.setAttribute("href", ASSET + s.img);
          im.style.opacity = 0;
          r.imgs[s.img] = im;
        });
        return r;
      },
      render(s, r) { for (const k in r.imgs) vis(r.imgs[k], k === s.img); },
    };
  }
  // table scene: cols = [{h, x, anchor, mono, w}], rows = arrays of strings; step: rows = how many rows are showing, hl = highlighted row indices
  function tableScene(cfg) {
    const RH = cfg.rh || 34, Y0 = cfg.y0 || 26, FS = cfg.fs || 15;
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { rows: [], bgs: [] };
        const W = cfg.cols[cfg.cols.length - 1].x + cfg.cols[cfg.cols.length - 1].w + 20 - cfg.cols[0].x;
        cfg.cols.forEach((c) => txt(g, c.x, Y0 - 8, c.h, { size: 12, weight: 700, fill: C.purple, ls: 1.5, anchor: c.anchor || "start" }));
        ln(g, cfg.cols[0].x - 10, Y0, cfg.cols[0].x - 10 + W, Y0, { stroke: C.purple, sw: 2 });
        cfg.rows.forEach((row, i) => {
          const gg = grp(g, 0); r.rows.push(gg);
          const y = Y0 + i * RH;
          r.bgs.push(rect(gg, cfg.cols[0].x - 10, y + 3, W, RH - 4, { rx: 6, fill: "none" }));
          row.forEach((cell, ci) => {
            const c = cfg.cols[ci];
            txt(gg, c.x, y + RH / 2 + 5, cell, { pre: true, size: c.size || FS, mono: !!c.mono, weight: c.bold ? 700 : 400, fill: c.bold ? C.purple : C.ink, anchor: c.anchor || "start" });
          });
        });
        return r;
      },
      render(s, r) {
        const n = s.rows === undefined ? cfg.rows.length : s.rows, hl = s.hl || [];
        r.rows.forEach((gg, i) => vis(gg, i < n));
        r.bgs.forEach((b, i) => b.setAttribute("fill", hl.indexOf(i) >= 0 ? C.t2 : "none"));
      },
    };
  }


  function mixScene(cfg, subs) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { subs: {}, gs: {} };
        for (const k in subs) { const gg = grp(g, 0); r.gs[k] = gg; r.subs[k] = subs[k].build(gg); }
        return r;
      },
      render(s, r) {
        for (const k in subs) { vis(r.gs[k], s.sub === k); if (s.sub === k) subs[k].render(s, r.subs[k]); }
      },
    };
  }
  const tb = (c) => tableScene(Object.assign({ steps: [{}] }, c));
  const fg = (imgs) => figScene({ steps: imgs.map((i) => ({ img: i })) });
  // a "card": a big statement for beats of the lecture that have no diagram of their own
  const cardSub = {
    build(g) {
      const r = {};
      rect(g, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
      r.head = txt(g, 575, 135, "", { size: 42, weight: 700, fill: "#171715", anchor: "middle" });
      rect(g, 505, 160, 140, 6, { rx: 3, fill: C.accent });
      r.lines = [0, 1, 2, 3].map((i) => txt(g, 575, 218 + i * 34, "", { size: 21, fill: C.grey, anchor: "middle", pre: true }));
      return r;
    },
    render(s, r) {
      const c = s.card || {};
      r.head.textContent = c.head || "";
      r.head.setAttribute("font-size", c.mono ? 40 : ((c.head || "").length > 30 ? 30 : 40));
      r.head.style.fontFamily = c.mono ? MONO : "";
      r.lines.forEach((t, i) => { t.textContent = (c.lines || [])[i] || ""; });
    },
  };
  const cd = (head, lines, mono) => ({ head, lines: lines || [], mono: !!mono });

  // ---- the lw trace, animated: the five microarchitectural registers fill up one clock cycle at a time
  const RTREG = [["IR", "instruction", 1, "lw $1,0($2)"], ["A", "R[reg1]", 2, "100"], ["B", "R[reg2]", 2, "3"], ["aluOut", "ALU result", 3, "100"], ["MDR", "memory data", 4, "7"]];
  const RTCAP = ["", "IF: read memory at the pc (10)", "ID: reg1 ($2) into A, reg2 ($1) into B", "EX: the ALU adds A and the offset 0", "MEM: read memory at aluOut (100)", "WB: MDR goes into $1 (reg2), and the pc becomes 11"];
  const rtrace = {
    build(g) {
      const r = { boxes: [], vals: [], tags: [] };
      txt(g, 40, 60, "CLOCK CYCLE", { size: 14, weight: 700, fill: C.grey, ls: 2 });
      r.cyc = txt(g, 40, 108, "", { size: 50, weight: 700, fill: C.red });
      r.stage = txt(g, 120, 108, "", { size: 28, weight: 700, mono: true, fill: C.purple });
      rect(g, 330, 14, 440, 76, { rx: 14, fill: C.white, stroke: C.purple, sw: 4 });
      txt(g, 550, 30, "THE INSTRUCTION", { size: 11, weight: 700, fill: C.lgrey, anchor: "middle", ls: 2 });
      txt(g, 550, 62, "lw $1, 0($2)", { size: 30, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
      txt(g, 550, 82, "reg1 = $2 (the address)     reg2 = $1 (the destination)", { size: 13, italic: true, fill: C.grey, anchor: "middle", pre: true });
      txt(g, 1110, 62, "$2 = 100     M[100] = 7", { size: 15, mono: true, fill: C.grey, anchor: "end", pre: true });
      r.f2 = txt(g, 1110, 86, "old $1 = 3     pc = 10", { size: 15, mono: true, fill: C.grey, anchor: "end", pre: true });
      RTREG.forEach(([nm, sub, wc, val], i) => {
        const cx = 215 + i * 185;
        r.boxes.push(rect(g, cx - 75, 150, 150, 100, { rx: 14, fill: C.white, stroke: C.lgrey, sw: 3, dash: "8 6" }));
        txt(g, cx, 132, nm, { size: 22, weight: 700, fill: C.purple, anchor: "middle", mono: true });
        txt(g, cx, 272, sub, { size: 13, italic: true, fill: C.grey, anchor: "middle" });
        r.vals.push(txt(g, cx, 208, val, { size: val.length > 6 ? 17 : 26, weight: 700, mono: true, fill: C.ink, anchor: "middle" }));
        r.tags.push(txt(g, cx, 300, "", { size: 15, weight: 700, fill: C.red, anchor: "middle" }));
      });
      r.cap = txt(g, 575, 350, "", { size: 20, weight: 700, fill: C.ink, anchor: "middle" });
      // the memory's output wires, cycle by cycle: shown while we talk about what IR's input sees
      r.mem = grp(g, 0); r.mem.style.transition = "opacity .4s";
      [1, 2, 3, 4, 5].forEach((n, i) => {
        const on = n === 1 || n === 4, x = 400 + i * 80;
        circ(r.mem, x, 338, 14, { fill: on ? (n === 4 ? C.red : C.purple) : C.white, stroke: on ? (n === 4 ? C.red : C.purple) : C.lgrey, sw: 3 });
        txt(r.mem, x, 344, String(n), { size: 15, weight: 700, mono: true, fill: on ? C.white : C.lgrey, anchor: "middle" });
      });
      path(r.mem, "M640 322 Q520 270 408 322", { stroke: C.red, sw: 4 });
      arrowhead(r.mem, 404, 324, "l", C.red);
      return r;
    },
    render(s, r) {
      const c = s.cycle || 0;
      r.mem.style.opacity = s.memrow ? 1 : 0;
      r.cap.setAttribute("y", s.memrow ? 390 : 350);
      r.cyc.textContent = c ? String(c) : "-";
      r.stage.textContent = ["", "IF", "ID", "EX", "MEM", "WB"][c] || "";
      r.cap.textContent = RTCAP[c] || "all five registers are empty";
      r.f2.textContent = c >= 5 ? "$1 = 7     pc = 11" : "old $1 = 3     pc = 10";
      r.f2.setAttribute("fill", c >= 5 ? C.red : C.grey);
      RTREG.forEach(([nm, sub, wc, val], i) => {
        const have = c >= wc, fresh = c === wc && !s.mark && !s.danger, b = r.boxes[i];
        const danger = s.danger && nm === "IR", mark = s.mark === nm;
        r.vals[i].style.opacity = have || danger ? 1 : 0;
        r.vals[i].textContent = danger ? "7" : val;
        r.vals[i].setAttribute("fill", danger ? C.red : C.ink);
        if (have || danger) b.removeAttribute("stroke-dasharray"); else b.setAttribute("stroke-dasharray", "8 6");
        b.setAttribute("fill", danger || fresh ? C.t2 : (have ? C.t1 : C.white));
        b.setAttribute("stroke", danger || fresh || mark ? C.red : (have ? C.purple : C.lgrey));
        b.setAttribute("stroke-width", danger || fresh || mark ? 5 : 3);
        r.tags[i].textContent = danger ? "overwritten!" : (mark && nm === "B" ? "never used" : (mark && nm === "IR" ? "must keep the lw" : (fresh ? "just written" : "")));
      });
    },
  };

  const SKILLS = {};

  // ================= Title slide =================
  (function () {
    const ROUTE = ["Why One Long Cycle Isn't Enough", "Five Stages, on Real Instructions", "Five Registers Between Stages",
                   "The State Register and Diagram", "A Sample Question, Solved",
                   "What Multicycle Bought and Cost", "Pipelining: Overlap", "Where It Breaks: The RAW Hazard", "Two Fixes: Stall, or Forward"];
    scene({
      front: true, num: "", title: "Multicycle and Pipelining", subtitle: "", chips: [],
      steps: [
        { view: "title", foot: "",
          narrate: "To build the fastest processors in the world, hardware engineers first had to figure out how to make them <strong>slower</strong>. The whole history of this field feels like one long race toward higher clock speeds, and here we are, on purpose, slowing the thing down. That paradox is what this week is about." },
        { view: "fixes", foot: "",
          narrate: "Before the midterm, we ended on a complaint. A single-cycle E20 does every instruction in exactly one clock cycle, and that cycle has to be long enough for the <em>slowest</em> instruction. So a <code>j</code>, which is done in a sliver of the cycle, just sits there twiddling its thumbs. This week we fix that." },
        { view: "route", foot: "nine sections",
          narrate: "The second idea is the one the rest of the course is built on, and it is only possible <em>because</em> of the first." },
      ],
      build(g) {
        const r = {};
        r.title = grp(g, 1);
        rect(r.title, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
        txt(r.title, 575, 104, "CS-UY 2214  |  WEEK VIII", { size: 15, weight: 700, fill: C.red, anchor: "middle", ls: 2 });
        txt(r.title, 575, 184, "Multicycle and Pipelining", { size: 50, weight: 700, fill: "#171715", anchor: "middle" });
        rect(r.title, 505, 210, 140, 6, { rx: 3, fill: C.accent });
        txt(r.title, 575, 258, "Cut the instruction into stages, then overlap them", { size: 22, italic: true, fill: C.grey, anchor: "middle" });
        txt(r.title, 575, 312, "Computer Architecture and Organization", { size: 14, fill: C.lgrey, anchor: "middle", ls: 1 });

  // ================= 1 Why One Long Cycle Isn't Enough =================
  scene(mixScene({
    num: "1", title: "Why One Long Cycle Isn't Enough", subtitle: "A convoy goes at the speed of its slowest vehicle.",
    chips: ["The convoy", "The numbers", "The proposal", "The speed trap", "What it buys"],
    steps: [
      { sub: "card", card: cd("Single-cycle is a convoy", ["a convoy travels at the speed of its slowest vehicle", "no exceptions"]), chip: 1, foot: "", narrate: "Think of a convoy of cars. A convoy travels at the speed of its slowest vehicle, no exception. Single-cycle is a convoy." },
      { sub: "card", card: cd("The clock cycle", ["the time between two ticks of the processor's clock", "everything an instruction needs must finish inside one tick", "so: size the cycle for the worst path through the circuit"]), chip: 1, foot: "", narrate: "A <strong>clock cycle</strong> is the time between two ticks of the processor's clock, and in single-cycle everything an instruction needs has to finish inside <em>one</em> tick. Signals take real time to flow, and different instructions need different amounts of it. But the clock is a fixed interval, so: <strong>size the cycle for the worst path through the circuit.</strong> The slowest instruction sets the speed for everybody. In the E20, that instruction is <code>lw</code>." },
      { sub: "delays", rows: 4, hl: [], chip: 2, foot: "these delays are invented", narrate: "Note: <strong>these delays are invented.</strong> They are not in the E20 manual. They're stand-ins with the right <em>shape</em>: memory is slow, the other parts are quick." },
      { sub: "lw", rows: 6, hl: [5], chip: 2, foot: "", narrate: "Now walk <code>lw</code> through the machine. Fetch the instruction from memory: <strong>2</strong>. Decode it and read the base register: <strong>1</strong>. Push the base address through the ALU: <strong>1</strong>. Access data memory: <strong>2</strong> again. Write the loaded value into a register: <strong>1</strong>. That's 2 + 1 + 1 + 2 + 1 = <strong>7 time units</strong>, so the single-cycle clock cycle can't be a hair shorter than 7, period." },
      { sub: "add", rows: 6, hl: [4, 5], chip: 2, foot: "", narrate: "Now compare an <code>add</code>. It fetches (2), reads <em>both</em> input registers at the same time (1), adds in the ALU (1) and writes the sum back (1): <strong>5 units</strong> of actual work. It never touches data memory. But the clock is welded at 7, so the <code>add</code> finishes at unit 5 and the whole processor, fully powered up and doing absolutely nothing, waits two units for the clock to tick. Every instruction that does less work than <code>lw</code> pays that tax, and <code>j</code> pays the most." },
      { sub: "fig", img: "mc-time.svg", chip: 3, foot: "", narrate: "So here's the proposal. Stop sizing the clock for the whole instruction. <strong>Slice the instruction into small steps, and size the clock for the slowest <em>step</em>.</strong> Looking at our delays, the slowest single step is a memory access: 2 units. So the clock cycle drops from 7 units to a very aggressive <strong>2</strong>, and every step of an instruction gets exactly one of those short cycles." },
      { sub: "fig", img: "mc-time.svg", chip: 4, foot: "", narrate: "Which sounds fantastic, until you do the math. Take the <code>add</code> again. We cut it into five steps, and each step gets a 2-unit cycle: 5 &times; 2 = <strong>10 units</strong>. In single-cycle the same <code>add</code> took 7. And <code>lw</code>? Also five steps of two units: 10, up from 7. <strong>Multicycle makes every single instruction slower.</strong>" },
      { sub: "card", card: cd("What does it buy us?", ["why would anyone, on purpose, adopt a design", "that makes every instruction slower?"]), chip: 5, foot: "", narrate: "That should bother you. Why would anyone, on purpose, adopt a design that makes every instruction slower? What on earth does it buy us? Two things, and the second one is the whole point of the lecture." },
      { sub: "card", card: cd("Reuse across time", ["fetch in cycle 1, data access in cycle 4", "they never overlap, so one memory is enough", "we're trading time for space"]), chip: 5, foot: "", narrate: "<strong>Reuse across time.</strong> In single-cycle the instruction fetch and a <code>lw</code>'s data access both need the memory <em>at the same time</em>. That takes a memory with two sets of ports, or two memories. Chop the instruction into steps and the two accesses land in different cycles. They never overlap, so <strong>one memory is enough</strong>. Same economy for the ALU and the adders: now the ALU compares in one cycle and the PC adder finds the target in a later one. We're trading <em>time</em> for <em>space</em>." },
      { sub: "card", card: cd("Separation", ["five independent, standardised steps", "the next instruction needn't wait for all five", "that's pipelining (Section 7)"]), chip: 5, foot: "", narrate: "<strong>Separation.</strong> Once an instruction's work is cut into five independent standardised steps, nothing says the next instruction has to wait for all five of them to finish before it starts. That's <strong>pipelining</strong>, and it's where the speed-up finally shows up (Section 8)." },
      { sub: "card", card: cd("Multicycle is not a speed-up", ["a restructuring that slows each instruction down", "so the hardware can be reused", "and so we can overlap instructions later"]), chip: 5, foot: "", narrate: "So let's say it plainly: <strong>multicycle is not a speed-up.</strong> It's a restructuring that slows each instruction down so the hardware can be reused, and so we can overlap instructions later." },
    ],
  }, { card: cardSub, delays: tb(DELAYS), lw: tb(LWWALK), add: tb(ADDWALK), fig: fg(["mc-time.svg"]) }));

      { sub: "add", rows: 1, hl: [0], chip: 1, foot: "", narrate: "<strong>Find it.</strong> Before any math, look at the <code>pc</code>, go to memory address 10, and pull out the 16-bit instruction. We call this <strong>instruction fetch</strong>, or <code>IF</code>." },
      { sub: "add", rows: 2, hl: [1], chip: 1, foot: "", narrate: "<strong>Understand it.</strong> Read the bits: it's an <code>add</code>. Chop the instruction into its fields and read the two registers it names: <code>$1</code> gives 5, <code>$2</code> gives 9. This is <strong>instruction decode</strong>, <code>ID</code>." },
      { sub: "add", rows: 3, hl: [2], chip: 1, foot: "", narrate: "<strong>Math it.</strong> Send 5 and 9 through the ALU. Out comes 14. This is <strong>execute</strong>, <code>EX</code>." },
      { sub: "add", rows: 4, hl: [3], chip: 1, foot: "", narrate: "<strong>Touch data.</strong> Does an <code>add</code> need data memory? Nope, everything it needs was already in the registers. So this step does nothing. But we keep it in the timeline anyway, and it's called <strong>memory access</strong>, <code>MEM</code>. (It's going to matter later.)" },
      { sub: "add", rows: 5, hl: [4], chip: 1, foot: "", narrate: "<strong>Save it.</strong> Write 14 into <code>$3</code>, and set the <code>pc</code> to 11 so the next instruction is the one at address 11. This is <strong>write-back</strong>, <code>WB</code>." },
      { sub: "names", rows: 5, hl: [], chip: 2, foot: "every instruction passes through all five, in this order", narrate: "<code>IF</code>, <code>ID</code>, <code>EX</code>, <code>MEM</code>, <code>WB</code>. Five phases make up the life of an instruction, and every instruction goes through the same five, in the same order. Let's prove it with a different one." },
      { sub: "card", card: cd("lw $1, 0($2)", ["$2 = 100      M[100] = 7      pc = 10"], true), chip: 3, foot: "", narrate: "Let's prove it with a different one: <code>lw $1, 0($2)</code>, with <code>$2</code> holding 100, memory at address 100 holding 7, and the <code>pc</code> at 10." },
      { sub: "lw", rows: 1, hl: [0], chip: 3, foot: "", narrate: "<code>IF</code>: read memory at address 10, and get the <code>lw</code>." },
      { sub: "lw", rows: 2, hl: [1], chip: 3, foot: "", narrate: "<code>ID</code>: read the register that holds the base address, <code>$2</code>, and get 100." },
      { sub: "lw", rows: 3, hl: [2], chip: 3, foot: "", narrate: "<code>EX</code>: the ALU adds the 100 and the instruction's offset, 0, and gets 100." },

      { sub: "lw", rows: 5, hl: [4], chip: 3, foot: "", narrate: "<code>WB</code>: write 7 into <code>$1</code>, and set the <code>pc</code> to 11." },
      { sub: "lw", rows: 5, hl: [2], chip: 3, foot: "the ALU computed an address", narrate: "Same five stages, but look at what the ALU did in step 3. It didn't do &quot;arithmetic&quot; in the way it did for <code>add</code>. It computed an <em>address</em>. The ALU is just a part that adds two numbers, and here the two numbers happen to be a base and an offset. The stage is named after what it does for <em>this</em> instruction." },
      { sub: "slots", rows: 5, hl: [2], chip: 4, foot: "", narrate: "<strong>A note on register fields.</strong> Every instruction has three register slots after the opcode, called <code>reg1</code>, <code>reg2</code>, <code>reg3</code> by position. The hardware knows slots, not &quot;destinations&quot;. In <code>lw</code>, the address register <code>$2</code> sits in slot 1 and the destination <code>$1</code> in slot 2: assembly order can mislead." },

  // ================= 3 Five Registers: What Each Cycle Leaves Behind =================
  scene(mixScene({
    num: "3", title: "Five Registers: What Each Cycle Leaves Behind", subtitle: "A wire only carries a value while something keeps driving it.",
    chips: ["The clock ticks", "Holding pens", "A lw, by cycle", "Write-enables"],
    steps: [
      { sub: "fig", img: "mc-stages-1-if.svg", chip: 1, foot: "", narrate: "Cycle 1, <code>IF</code>. The memory puts the instruction, say <code>add $3, $1, $2</code>, on its output wires. Nothing has copied it anywhere. It is simply there, on the wires." },
      { sub: "fig", img: "mc-stages-1-tick.svg", chip: 1, foot: "", narrate: "Does the instruction flow straight on into <code>ID</code> during the first clock cycle? <strong>No.</strong> In single-cycle, one long chain of wires carried it all the way through. Now <code>IF</code> fills cycle 1 on its own, and <code>ID</code> is a separate cycle, on the far side of a clock tick." },
      { sub: "fig", img: "mc-stages-1-id.svg", chip: 1, foot: "", narrate: "Cycle 2, <code>ID</code>. Across the tick, the memory is free to be asked for something else, so its output wires now carry whatever it answers. The instruction is gone, and <code>ID</code> has nothing to chop up." },
      { sub: "fig", img: "mc-stages-1-lost.svg", chip: 1, foot: "", narrate: "A wire only holds a value while something is driving it. The same goes for the two register values read in <code>ID</code>: if nothing keeps them, <code>EX</code> has nothing to add. Single-cycle never showed us this, because everything finished before the clock ticked." },
      { sub: "fig", img: "mc-stages-3a.svg", chip: 2, foot: "", narrate: "So after each stage we put a <strong>holding pen</strong>: a register that catches the stage's result and keeps it steady until the next stage has used it. Start with <code>IF</code>. The memory puts the instruction on its wires, and a register called <code>IR</code> (instruction register) catches it." },
      { sub: "fig", img: "mc-stages-3b.svg", chip: 2, foot: "", narrate: "After <code>ID</code> we need two pens. The register file is asked for two registers, and two registers called <code>A</code> and <code>B</code> catch the two values it returns, the registers named by <code>reg1</code> and <code>reg2</code>." },
      { sub: "fig", img: "mc-stages-3c.svg", chip: 2, foot: "", narrate: "<code>EX</code> hands two numbers to the ALU, and a register called <code>aluOut</code> catches its result: a sum, a comparison, or a memory address." },
      { sub: "fig", img: "mc-stages-3d.svg", chip: 2, foot: "", narrate: "<code>MEM</code> goes back to the same memory that <code>IF</code> used, and a register called <code>MDR</code> (memory data register) catches the value that a load reads." },
      { sub: "fig", img: "mc-stages-3p.svg", chip: 2, foot: "", narrate: "<code>WB</code> writes back into the same register file that <code>ID</code> read from. That is the whole machine: five stages, four kinds of holding pen, and three pieces of hardware reused across time." },
      { sub: "fig", img: "mc-stages-3p.svg", chip: 2, foot: "", narrate: "(You can never name these registers in assembly, which is why they're called <em>microarchitectural</em>: they exist in the machine, not in the instruction set.)" },
      { sub: "rtrace", cycle: 0, chip: 3, foot: "", narrate: "Let's watch them fill up, one cycle at a time, with the same <code>lw $1, 0($2)</code>. <code>$2</code> holds 100, memory at 100 holds 7, the old value of <code>$1</code> is 3 (junk we're about to overwrite), and the <code>pc</code> is 10." },
      { sub: "rtrace", cycle: 1, chip: 3, foot: "", narrate: "<strong>Cycle 1, <code>IF</code>:</strong> read memory at the <code>pc</code> (10). <code>IR</code> catches the <code>lw</code>." },
      { sub: "rtrace", cycle: 2, chip: 3, foot: "", narrate: "<strong>Cycle 2, <code>ID</code>:</strong> <code>reg1</code> (<code>$2</code>) goes into <code>A</code>, so <code>A</code> is 100. <code>reg2</code> (<code>$1</code>) goes into <code>B</code>, so <code>B</code> is 3." },
      { sub: "rtrace", cycle: 3, chip: 3, foot: "", narrate: "<strong>Cycle 3, <code>EX</code>:</strong> the ALU adds <code>A</code> and the offset 0. <code>aluOut</code> catches 100." },
      { sub: "rtrace", cycle: 4, chip: 3, foot: "", narrate: "<strong>Cycle 4, <code>MEM</code>:</strong> read memory at <code>aluOut</code> (100). <code>MDR</code> catches 7." },
      { sub: "rtrace", cycle: 5, chip: 3, foot: "", narrate: "<strong>Cycle 5, <code>WB</code>:</strong> <code>MDR</code> goes into <code>$1</code> (<code>reg2</code>), and the <code>pc</code> becomes 11. Notice that <code>B</code> still says 3: it is only a copy made in cycle 2. <code>$1</code>, up in the corner, is the register that changed. A blank register means it hasn't been filled in yet by this instruction." },
      { sub: "rtrace", cycle: 5, mark: "B", chip: 3, foot: "", narrate: "Two things in that run deserve a second look. First, <code>B</code> grabbed the <strong>old</strong> value of <code>$1</code> (3) in cycle 2, and nobody ever used it. The <code>lw</code> is about to overwrite <code>$1</code>, so why read it? Because it's much cheaper to blindly read both registers on <em>every</em> instruction than to make the hardware stop, work out that this is a load, and cancel half the read." },
      { sub: "rtrace", cycle: 5, mark: "IR", chip: 3, foot: "", narrate: "Second, look at <code>IR</code>. For all five cycles the whole machine depends on <code>IR</code> still holding that <code>lw</code>." },
      { sub: "rtrace", cycle: 4, mark: "IR", memrow: true, chip: 3, foot: "", narrate: "But registers naturally grab whatever is on their input wires every time the clock ticks, and the <code>IR</code>'s input comes from memory's output. In cycle 4 memory is busy outputting the <em>data</em>, the number 7." },
      { sub: "rtrace", cycle: 4, danger: true, memrow: true, chip: 3, foot: "", narrate: "If <code>IR</code> kept latching, it would catch that 7, overwrite the <code>lw</code>, and the control module would think it's a brand-new opcode in the middle of an instruction. Total chaos." },
      { sub: "fig", img: "mc-stages-3.svg", chip: 4, foot: "", narrate: "The fix is a <strong>write-enable</strong>: a one-bit control signal on every register. A 1 means &quot;take the new value this tick&quot;. A 0 means &quot;ignore your input and keep what you've got&quot;. The instruction register's is called <code>WEir</code>: the control module turns it on in cycle 1 to catch the instruction, then drives it to 0 for cycles 2 to 5 to protect it. The others are <code>WEa</code>, <code>WEb</code> and <code>WEalu</code>, and control turns on only the one that belongs to the current stage." },
    ],

  // ================= 4 The State Register and the State Diagram =================
  scene(mixScene({
    num: "4", title: "The State Register and the State Diagram", subtitle: "15 states, numbered 0 to 14. Each is one clock cycle.",
    chips: ["Which cycle?", "IF and ID", "EX and MEM", "WB", "Paths"],
    steps: [
      { sub: "fig", img: "mc-hurdle-1.svg", chip: 1, foot: "", narrate: "That write-enable story hides a bigger problem, and it's the biggest conceptual hurdle of the week. In cycle 1, the memory's address has to come from the <code>pc</code> (we're fetching). In cycle 4, it has to come from <code>aluOut</code> (we're loading data)." },
      { sub: "fig", img: "mc-hurdle-2.svg", chip: 1, foot: "", narrate: "The control module is looking at the <strong>exact same instruction</strong> in the exact same <code>IR</code> both times. A control module that's a pure truth table can't possibly give two different answers for the same input." },
      { sub: "fig", img: "mc-hurdle-3.svg", chip: 1, foot: "", narrate: "So what extra piece of information does it need? The thing that <em>differs</em> between the two cycles is <strong>which cycle we're in</strong>. Control needs to know where in the instruction's life we are." },
      { sub: "fig", img: "mc-stages-4.svg", chip: 1, foot: "", narrate: "That's a <strong>state</strong>, and we keep it in one more register: the <strong>state register</strong>. (Think of it as the page number of a recipe.) The control module now reads <em>two</em> inputs, the opcode and the current state, and produces <em>two</em> kinds of output: the control signals for this cycle, and the <strong>new state</strong>, stored on the next tick. It's still a lookup table, with one more column on the input side. But a lookup table that feeds its own output back into a register is a <strong>finite state machine</strong>." },
      { sub: "fig", img: "mc-states-q1.svg", chip: 2, foot: "", narrate: "So how many states do we need? The most natural answer is the one we already have: <strong>one state for each stage</strong>. Fetch is a state, decode is a state, then execute, memory and write-back: five states, one clock cycle each." },
      { sub: "fig", img: "mc-states-q2.svg", chip: 2, foot: "", narrate: "That's an easy rule to remember, so let's start there and see whether it holds up. (Spoiler: almost, and the places where it breaks are the interesting part.)" },
      { sub: "fig", img: "mc-states-q3.svg", chip: 2, foot: "", narrate: "To keep track of it, engineers draw a <strong>state diagram</strong>, which is just a flowchart of the machine's life. Each box is one state, which is one clock cycle." },
      { sub: "fig", img: "mc-states-q4.svg", chip: 2, foot: "", narrate: "Each arrow says which state comes next, and the label on an arrow says which instructions take it. We'll build it one stage at a time, and every time something looks odd, we'll ask why." },
      { sub: "fig", img: "mc-states-h10.svg", chip: 2, foot: "", narrate: "<strong><code>IF</code>: state 0.</strong> Every instruction starts here: route the <code>pc</code> to the memory's address and turn on <code>WEir</code>. The notation <code>IR &lt;- M[pc]</code> means &quot;copy the memory at address <code>pc</code> into <code>IR</code>&quot;." },
      { sub: "fig", img: "mc-states-ida.svg", chip: 2, foot: "", narrate: "<strong><code>ID</code>: state 1</strong> is the normal one. The values of <code>reg1</code> and <code>reg2</code> go into <code>A</code> and <code>B</code>." },
      { sub: "fig", img: "mc-states-idb.svg", chip: 2, foot: "", narrate: "But for the jumps, <code>j</code> and <code>jal</code>, we're not naming any registers at all. We just have our immediate: a raw 13-bit target, right inside the instruction." },
      { sub: "fig", img: "mc-states-idb.svg", chip: 2, foot: "", narrate: "In <code>EX</code> we want that target to come out of the ALU, and <code>A</code> and <code>B</code> are supposed to be the ALU's inputs. So what do we actually put into them?" },
      { sub: "fig", img: "mc-states-h12.svg", chip: 2, foot: "", narrate: "Two things that add up to the target: 0, and the target itself. <strong>State 2</strong>, exclusive to jumps, forces <code>A</code> to the constant register 0 and loads <code>B</code> with the immediate, zero-extended up to 16 bits." },
      { sub: "fig", img: "mc-states-h12.svg", chip: 2, foot: "", narrate: "Then <code>EX</code> computes <code>0 + target</code> and the target passes through untouched: no separate bypass wire." },
      { sub: "fig", img: "mc-states-h14.svg", chip: 2, foot: "", narrate: "So <strong>state 1</strong> is for instructions that name registers, <strong>state 2</strong> is for <code>j</code> and <code>jal</code>. Five stages, but we're already at three states, so &quot;one state per stage&quot; was only the starting point." },
      { sub: "fig", img: "mc-states-exa.svg", chip: 3, foot: "", narrate: "<strong><code>EX</code>: state 3</strong> is for instructions with a small constant (a 7-bit <em>immediate</em>) baked in: <code>lw</code>, <code>sw</code>, <code>addi</code>, <code>slti</code>. It computes <code>A op signExtend7(imm7)</code>, where <em>sign-extending</em> means padding the constant out to 16 bits so that -3 stays -3." },
      { sub: "fig", img: "mc-states-h16.svg", chip: 3, foot: "", narrate: "<strong>State 4</strong> is for everything where both inputs are in registers (and for the jumps): <code>A op B</code>. The ALU runs exactly once per instruction." },
      { sub: "fig", img: "mc-states-mema.svg", chip: 3, foot: "", narrate: "<strong><code>MEM</code></strong>: <code>lw</code> reads memory into <code>MDR</code> (<strong>state 5</strong>)." },
      { sub: "fig", img: "mc-states-memb.svg", chip: 3, foot: "", narrate: "And <code>sw</code> writes <code>B</code> into memory (<strong>state 6</strong>). Now the second trap of the lecture." },
      { sub: "fig", img: "mc-states-memc.svg", chip: 3, foot: "", narrate: "<code>add</code> finishes its math in state 4. It doesn't need memory. Why not draw an arrow straight to write-back and skip <code>MEM</code>? <code>add</code> would take 4 cycles instead of 5, which sounds faster." },
      { sub: "fig", img: "mc-states-memd.svg", chip: 3, foot: "", narrate: "It <em>would</em> be faster for the <code>add</code>. But different instructions would then take different numbers of cycles, and the control module would have to keep track of who finishes when." },
      { sub: "fig", img: "mc-states-h20.svg", chip: 3, foot: "", narrate: "A rigid rhythm is much simpler. So <code>add</code> gets routed through <strong>state 7</strong>, a <code>MEM</code> state that does absolutely nothing. <strong>Every instruction passes through every stage, so every instruction takes exactly five cycles.</strong> Simplicity beats local efficiency." },
      { sub: "fig", img: "mc-states-mem.svg", chip: 4, foot: "", narrate: "<strong><code>WB</code></strong>: each instruction ends by writing its result into a register (if it has one) and setting the <code>pc</code> for the next instruction. So there is one state for each kind of ending." },
      { sub: "fig", img: "mc-states-wb8.svg", chip: 4, foot: "", narrate: "<strong>State 8</strong> is how a <code>lw</code> ends: the loaded value in <code>MDR</code> goes into register <code>reg2</code>, and the <code>pc</code> becomes <code>pc + 1</code>." },
      { sub: "fig", img: "mc-states-wb9.svg", chip: 4, foot: "", narrate: "<strong>State 9</strong> is how a <code>sw</code> ends. The memory write already happened, so there is no register to write: the <code>pc</code> just becomes <code>pc + 1</code>." },
      { sub: "fig", img: "mc-states-wb10.svg", chip: 4, foot: "", narrate: "<strong>State 10</strong> is for <code>addi</code> and <code>slti</code>: the ALU's result goes into <code>reg2</code>, and the <code>pc</code> becomes <code>pc + 1</code>." },
      { sub: "fig", img: "mc-states-wb11.svg", chip: 4, foot: "", narrate: "<strong>State 11</strong> is for <code>jeq</code>. No register is written, and the <code>pc</code> becomes <code>pc + 1</code>, plus <code>imm7</code> if the two registers were equal." },
      { sub: "fig", img: "mc-states-wb12.svg", chip: 4, foot: "", narrate: "<strong>State 12</strong> is for <code>j</code> and <code>jr</code>: no register is written, and the <code>pc</code> becomes <code>aluOut</code>, the jump target." },
      { sub: "fig", img: "mc-states-wb13.svg", chip: 4, foot: "", narrate: "<strong>State 13</strong> is for <code>jal</code>: it writes <code>pc + 1</code> into register 7 as the way back, and the <code>pc</code> becomes <code>aluOut</code>." },
      { sub: "fig", img: "mc-states-wb14.svg", chip: 4, foot: "", narrate: "<strong>State 14</strong> is for <code>add</code>, <code>sub</code>, <code>and</code>, <code>or</code> and <code>slt</code>: the ALU's result goes into <code>reg3</code>, and the <code>pc</code> becomes <code>pc + 1</code>." },
      { sub: "fig", img: "mc-states-h22.svg", chip: 4, foot: "", narrate: "All of them lead back to state 0, ready to fetch the next instruction. That's the full diagram: fifteen states, 0 to 14." },
      { sub: "paths", rows: 8, hl: [], chip: 5, foot: "", narrate: "Now every instruction is just a path through the diagram." },
      { sub: "paths", rows: 8, hl: [0, 1, 2, 3, 4, 5, 6, 7], chip: 5, foot: "", narrate: "Look down the last column. <strong>Every row has five states.</strong> <code>j</code> is no longer faster than <code>lw</code>: that's what you pay for the rigid rhythm." },
      { sub: "fig", img: "mc-path-lw.svg", chip: 5, foot: "", narrate: "<code>lw</code>: fetch, read the registers, compute the address, read memory, write the loaded value back. States <strong>0, 1, 3, 5, 8</strong>." },
      { sub: "fig", img: "man-lw-1.png", chip: 5, foot: "", narrate: "Here is that same trip on the manual's circuit (page 21), next to its state diagram (page 23). <strong>Cycle 1, <code>IF</code> (state 0)</strong>: the <code>pc</code> goes through <code>MUXaddr</code> to the memory's address input, and the instruction comes out of the memory into <code>IR</code>." },
      { sub: "fig", img: "man-lw-2.png", chip: 5, foot: "", narrate: "<strong>Cycle 2, <code>ID</code> (state 1)</strong>: the register fields of <code>IR</code> go through <code>MUXr1</code> into the register file, and the two values land in <code>A</code> and <code>B</code>." },
      { sub: "fig", img: "man-lw-3.png", chip: 5, foot: "", narrate: "<strong>Cycle 3, <code>EX</code> (state 3)</strong>: <code>A</code> and the sign-extended <code>imm7</code> go into the ALU, and <code>aluOut</code> catches the sum." },
      { sub: "fig", img: "man-lw-4.png", chip: 5, foot: "", narrate: "<strong>Cycle 4, <code>MEM</code> (state 5)</strong>: <code>aluOut</code> goes through <code>MUXaddr</code> to the memory, and the loaded value lands in <code>MDR</code>." },
      { sub: "fig", img: "man-lw-5.png", chip: 5, foot: "", narrate: "<strong>Cycle 5, <code>WB</code> (state 8)</strong>: <code>MDR</code> goes through <code>MUXtgt</code> into the register file, and the <code>pc</code> moves on to <code>pc + 1</code>." },
      { sub: "fig", img: "mc-path-jeq.svg", chip: 5, foot: "", narrate: "<code>jeq</code>: the ALU subtracts in state 4, and in state 11 whether <code>aluOut</code> is zero decides which way the <code>pc</code> goes. States <strong>0, 1, 4, 7, 11</strong>." },
      { sub: "fig", img: "mc-path-jr.svg", chip: 5, foot: "", narrate: "To check you can read the diagram, trace <code>jr $3</code>. In state 1, <code>A</code> gets the value of <code>$3</code>, and because <code>jr</code> has its <code>reg2</code> field set to 0, <code>B</code> gets register 0, which is always 0. State 4 computes <code>A + B</code>, which is just the value of <code>$3</code>, so <code>aluOut</code> is the target. State 7 does nothing. State 12 finishes with <code>pc &lt;- aluOut</code>." },

  }, { card: cardSub, fig: fg(["man-lw-1.png", "man-lw-2.png", "man-lw-3.png", "man-lw-4.png", "man-lw-5.png", "mc-states-wb8.svg", "mc-states-wb9.svg", "mc-states-wb10.svg", "mc-states-wb11.svg", "mc-states-wb12.svg", "mc-states-wb13.svg", "mc-states-wb14.svg", "mc-states-mema.svg", "mc-states-memb.svg", "mc-states-memc.svg", "mc-states-memd.svg", "mc-states-exa.svg", "mc-states-ida.svg", "mc-states-idb.svg", "mc-states-h10.svg", "mc-states-h11.svg", "mc-states-h12.svg", "mc-states-h14.svg", "mc-states-h15.svg", "mc-states-h16.svg", "mc-states-h17.svg", "mc-states-h18.svg", "mc-states-h19.svg", "mc-states-h20.svg", "mc-states-h21.svg", "mc-states-h22.svg", "mc-states-q1.svg", "mc-states-q2.svg", "mc-states-q3.svg", "mc-states-q4.svg", "mc-hurdle-1.svg", "mc-hurdle-2.svg", "mc-hurdle-3.svg", "mc-stages-4.svg", "mc-states-if.svg", "mc-states-id.svg", "mc-states-ex.svg", "mc-states-mem.svg", "mc-states-wb.svg", "mc-path-lw.svg", "mc-path-jeq.svg", "mc-path-jr.svg"]), wbt: tb(WBT), paths: tb(PATHS) }));

  const RETCMP = { cols: [{ h: "SIGNAL", x: 60, w: 460, mono: true, bold: true, size: 20 }, { h: "STATE 1", x: 560, w: 260, mono: true, size: 20 }, { h: "NEW STATE (for ret)", x: 850, w: 280, mono: true, size: 20 }],

  scene(mixScene({
    num: "5", title: "A Sample Question, Solved", subtitle: "Plan in plain words, then find a state for each stage.",
    chips: ["The question", "The plan", "Stage by stage", "The answer", "Another one"],
    steps: [
      { sub: "card", card: cd("A sample question", ["add ret: jump to the address held in $7","for each of the five stages: name an existing state,","or define a new one by its control signals"]), chip: 1, foot: "", narrate: "Here's the question this whole lecture has been building toward, and it's the one you will be asked on the homework and on the exam. <strong>Add a new instruction to the multicycle E20. For each of the five stages, give the number of an existing state, or define a new state by its control signals.</strong> Our instruction is <strong><code>ret</code></strong>: jump to the address held in <code>$7</code>, the way you come back from a function call. You already have the circuit and the state diagram from the manual, so let's use them." },
      { sub: "fig", img: "man-ret-plan.png", chip: 2, foot: "", narrate: "First, in plain words, with no signals yet. <code>IF</code>: fetch the instruction, like every instruction. <code>ID</code>: <code>A</code> gets the value of register 7, because that's where we're jumping. <code>EX</code>: the ALU adds <code>A</code> and <code>B</code> to make the target (<code>B</code> is 0). <code>MEM</code>: nothing. <code>WB</code>: the <code>pc</code> takes the target, and no register is written. Now we turn each of those into a state." },
      { sub: "fig", img: "man-ret-s1.png", chip: 3, foot: "", narrate: "<strong><code>IF</code></strong> is the easy one: state 0, the fetch, with <code>WEir = 1</code> and <code>MUXaddr = 1</code>. Every instruction starts there. Nothing to decide." },
      { sub: "fig", img: "man-ret-s2.png", chip: 3, foot: "", narrate: "<strong><code>ID</code></strong>: we need <code>A</code> to hold register 7. Two states load <code>A</code> and <code>B</code>: state 1 has <code>MUXr1 = 4</code> and state 2 has <code>MUXr1 = 0</code>. Which register does <code>MUXr1</code> pick?" },
      { sub: "fig", img: "man-ret-s3.png", chip: 3, foot: "", narrate: "On the circuit, <code>MUXr1</code> sits in front of the register file, and its value says which register to read: 4 is <code>reg1</code>, 3 is <code>reg2</code>, 2 is <code>reg3</code>, 0 is the number 0, and 1 is the number 7. State 1 reads <code>reg1</code> and state 2 reads the number 0. <strong>No existing state picks the number 7.</strong>" },
      { sub: "retcmp", rows: 6, hl: [3], chip: 3, foot: "", narrate: "So we write a <strong>new state</strong>, and we don't write it from scratch. Start from the closest existing state, which is state 1 (it loads <code>A</code> and <code>B</code> from registers), and change only what differs. The only difference is which register <code>A</code> comes from: <code>MUXr1 = 1</code> instead of 4. Everything else stays as in state 1." },

      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  window.DECK_STEPS = scenes.map(function (sc) { return { num: sc.num, title: sc.title, front: !!sc.front, steps: sc.steps.map(function (s) { return { narrate: s.narrate, sub: s.sub, img: s.img, card: s.card, cycle: s.cycle, rows: s.rows, hl: s.hl, marks: s.marks, arrows: s.arrows, view: s.view, mark: s.mark, danger: s.danger, chip: s.chip }; }) }; });
  if (location.search.indexOf('dump') >= 0) { var pre = document.createElement('pre'); pre.id = 'dump'; pre.textContent = JSON.stringify(window.DECK_STEPS); document.body.innerHTML = ''; document.body.appendChild(pre); return; }
  readHash();
  render();
})();
</script>

</body>
</html>
