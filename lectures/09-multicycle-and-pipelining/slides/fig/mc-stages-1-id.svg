<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#404040"/></marker>
  <marker id="r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c8202f"/></marker></defs>
  <rect x="40" y="50" width="150" height="84" rx="10" fill="#e2cdf2" stroke="#57068c" stroke-width="3"/>
  <text x="115" y="82" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">IF</text>
  <text x="115" y="106" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">read the</text>
  <text x="115" y="126" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">instruction</text>
  <polyline points="192,92 248,92" fill="none" stroke="#404040" stroke-width="3" marker-end="url(#a)" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="250" y="50" width="150" height="84" rx="10" fill="#e2cdf2" stroke="#57068c" stroke-width="3"/>
  <text x="325" y="82" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">ID</text>
  <text x="325" y="106" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">read the</text>
  <text x="325" y="126" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">registers</text>
  <polyline points="402,92 458,92" fill="none" stroke="#404040" stroke-width="3" marker-end="url(#a)" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="460" y="50" width="150" height="84" rx="10" fill="#e2cdf2" stroke="#57068c" stroke-width="3"/>
  <text x="535" y="82" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">EX</text>
  <text x="535" y="106" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">do the</text>
  <text x="535" y="126" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">math</text>
  <polyline points="612,92 668,92" fill="none" stroke="#404040" stroke-width="3" marker-end="url(#a)" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="670" y="50" width="150" height="84" rx="10" fill="#e2cdf2" stroke="#57068c" stroke-width="3"/>
  <text x="745" y="82" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">MEM</text>
  <text x="745" y="106" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">use data</text>
  <text x="745" y="126" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">memory</text>
  <polyline points="822,92 878,92" fill="none" stroke="#404040" stroke-width="3" marker-end="url(#a)" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="880" y="50" width="150" height="84" rx="10" fill="#e2cdf2" stroke="#57068c" stroke-width="3"/>
  <text x="955" y="82" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">WB</text>
  <text x="955" y="106" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">write the</text>
  <text x="955" y="126" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">result</text>
  <text x="575" y="30" fill="#6d6d6d" font-size="14" font-weight="400" text-anchor="middle" font-style="italic">each stage is one clock cycle</text>
  <rect x="246" y="46" width="158" height="92" rx="12" fill="none" stroke="#c1272d" stroke-width="5"/>
  <text x="115" y="172" fill="#6d6d6d" font-size="14" font-style="italic" text-anchor="middle">the memory's answer in cycle 2:</text>
  <rect x="20" y="182" width="190" height="46" rx="10" fill="#e2cdf2" stroke="#57068c" stroke-width="3"/>
  <text x="115" y="211" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">the next instruction</text>
  <rect x="20" y="262" width="190" height="46" rx="10" fill="none" stroke="#9f9f97" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="115" y="291" fill="#9f9f97" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">add $3, $1, $2</text>
  <line x1="30" y1="270" x2="200" y2="300" stroke="#c1272d" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="270" x2="30" y2="300" stroke="#c1272d" stroke-width="5" stroke-linecap="round"/>
  <text x="115" y="332" fill="#c1272d" font-size="16" font-style="italic" text-anchor="middle">gone: the memory moved on</text>
  <text x="325" y="176" fill="#c1272d" font-size="16" font-style="italic" text-anchor="middle">needs the instruction</text>
  <text x="575" y="350" fill="#57068c" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="2">CYCLE 2</text>
</svg>