<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 392" font-family="Helvetica, Arial, sans-serif">
<rect width="1150" height="392" rx="24" fill="#eee6f3"/>
<text x="575.0" y="30" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">element n lives at base + n x size</text>
<rect x="80" y="130" width="186" height="90" rx="0" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="173" y="184" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr[0]</text>
<text x="173" y="110" fill="#6d6d6d" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr</text>
<text x="173" y="246" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="middle">n = 0</text>
<text x="173" y="264" fill="#1a1a1a" font-size="1" font-weight="700" text-anchor="middle"></text>
<rect x="270" y="130" width="186" height="90" rx="0" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="363" y="184" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr[1]</text>
<text x="363" y="110" fill="#6d6d6d" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr + 4</text>
<text x="363" y="246" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="middle">n = 1</text>
<text x="363" y="264" fill="#1a1a1a" font-size="1" font-weight="700" text-anchor="middle"></text>
<rect x="460" y="130" width="186" height="90" rx="0" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="553" y="184" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr[2]</text>
<text x="553" y="110" fill="#6d6d6d" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr + 8</text>
<text x="553" y="246" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="middle">n = 2</text>
<text x="553" y="264" fill="#1a1a1a" font-size="1" font-weight="700" text-anchor="middle"></text>
<rect x="650" y="130" width="186" height="90" rx="0" fill="#fbeceb" stroke="#c1272d" stroke-width="6"/>
<text x="743" y="184" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr[3]</text>
<text x="743" y="110" fill="#c1272d" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr + 12</text>
<text x="743" y="246" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="middle">n = 3</text>
<text x="743" y="264" fill="#1a1a1a" font-size="1" font-weight="700" text-anchor="middle"></text>
<rect x="840" y="130" width="186" height="90" rx="0" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="933" y="184" fill="#1a1a1a" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr[4]</text>
<text x="933" y="110" fill="#6d6d6d" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">arr + 16</text>
<text x="933" y="246" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="middle">n = 4</text>
<text x="933" y="264" fill="#1a1a1a" font-size="1" font-weight="700" text-anchor="middle"></text>
<line x1="80" y1="282" x2="650" y2="282" stroke="#c1272d" stroke-width="4" stroke-linecap="round"/>
<polygon points="650.0,282.0 637.0,275.0 637.0,289.0" fill="#c1272d"/>
<text x="365" y="308" fill="#c1272d" font-size="18" font-weight="700" text-anchor="middle">3 steps of 4 bytes = 12</text>
<text x="575" y="358" fill="#57068c" font-size="21" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">address = base + n x s        (s = 4 here: each element is 4 bytes)</text>
</svg>
