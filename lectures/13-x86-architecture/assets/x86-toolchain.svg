<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="250" rx="24" fill="#eee6f3"/>
<text x="480" y="34" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">from text to a running program</text><rect x="30" y="70" width="200" height="80" rx="10" fill="#fff" stroke="#cfc3d8" stroke-width="2"/><text x="130.0" y="108" fill="#1a1a1a" font-size="18" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">helloworld.asm</text><text x="130.0" y="134" fill="#6d6d6d" font-size="12.5" font-weight="500" text-anchor="middle">you write this</text><rect x="380" y="70" width="200" height="80" rx="10" fill="#fff" stroke="#cfc3d8" stroke-width="2"/><text x="480.0" y="108" fill="#1a1a1a" font-size="18" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">helloworld.o</text><text x="480.0" y="134" fill="#6d6d6d" font-size="12.5" font-weight="500" text-anchor="middle">object file; we mostly ignore it</text><rect x="730" y="70" width="200" height="80" rx="10" fill="#fff" stroke="#cfc3d8" stroke-width="2"/><text x="830.0" y="108" fill="#1a1a1a" font-size="18" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">helloworld</text><text x="830.0" y="134" fill="#6d6d6d" font-size="12.5" font-weight="500" text-anchor="middle">executable; you run this</text><line x1="235" y1="110" x2="375" y2="110" stroke="#57068c" stroke-width="3" marker-end="url(#a)"/><text x="305.0" y="96" fill="#57068c" font-size="18" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">nasm</text><text x="305.0" y="136" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">assembler</text><line x1="585" y1="110" x2="725" y2="110" stroke="#57068c" stroke-width="3" marker-end="url(#a)"/><text x="655.0" y="96" fill="#57068c" font-size="18" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">ld</text><text x="655.0" y="136" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">linker</text><text x="480" y="200" fill="#1a1a1a" font-size="15" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">nasm -f elf -gstabs foo.asm</text><text x="480" y="226" fill="#1a1a1a" font-size="15" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">ld -o foo -m elf_i386 foo.o</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57068c"/></marker></defs>
</svg>
