<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="346" rx="24" fill="#eee6f3"/>
<text x="480" y="34" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">mov [foobar], eax   with   eax = 0xabcdef12</text><rect x="150" y="64" width="180" height="56" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="240.0" y="100" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">ab</text><rect x="330" y="64" width="180" height="56" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="420.0" y="100" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">cd</text><rect x="510" y="64" width="180" height="56" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="600.0" y="100" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">ef</text><rect x="690" y="64" width="180" height="56" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="780.0" y="100" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">12</text><text x="138" y="98" fill="#1a1a1a" font-size="18" font-weight="700" text-anchor="end" font-family="Menlo, Consolas, monospace">eax</text><text x="150" y="56" fill="#6d6d6d" font-size="13" font-weight="600" text-anchor="start">most significant</text><text x="870" y="56" fill="#6d6d6d" font-size="13" font-weight="600" text-anchor="end">least significant</text><line x1="780.0" y1="120" x2="240.0" y2="196" stroke="#57068c" stroke-width="2.5" marker-end="url(#a)"/><rect x="150" y="200" width="180" height="56" rx="10" fill="#fff" stroke="#cfc3d8" stroke-width="2"/><text x="240.0" y="236" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">12</text><text x="240.0" y="282" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">foobar+0</text><line x1="600.0" y1="120" x2="420.0" y2="196" stroke="#57068c" stroke-width="2.5" marker-end="url(#a)"/><rect x="330" y="200" width="180" height="56" rx="10" fill="#fff" stroke="#cfc3d8" stroke-width="2"/><text x="420.0" y="236" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">ef</text><text x="420.0" y="282" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">foobar+1</text><line x1="420.0" y1="120" x2="600.0" y2="196" stroke="#57068c" stroke-width="2.5" marker-end="url(#a)"/><rect x="510" y="200" width="180" height="56" rx="10" fill="#fff" stroke="#cfc3d8" stroke-width="2"/><text x="600.0" y="236" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">cd</text><text x="600.0" y="282" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">foobar+2</text><line x1="240.0" y1="120" x2="780.0" y2="196" stroke="#57068c" stroke-width="2.5" marker-end="url(#a)"/><rect x="690" y="200" width="180" height="56" rx="10" fill="#fff" stroke="#cfc3d8" stroke-width="2"/><text x="780.0" y="236" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">ab</text><text x="780.0" y="282" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">foobar+3</text><text x="138" y="236" fill="#1a1a1a" font-size="18" font-weight="700" text-anchor="end">memory</text><text x="480" y="322" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle">the least significant byte goes to the lowest address, so memory reads 12 ef cd ab</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57068c"/></marker></defs>
</svg>
