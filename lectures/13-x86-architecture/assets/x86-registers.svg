<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="336" rx="24" fill="#eee6f3"/>
<text x="480" y="34" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">eax, ax, ah, al are windows onto the same 32 bits</text><rect x="60" y="70" width="840" height="60" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="480.0" y="108" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">eax  (32 bits)</text><rect x="480.0" y="150" width="420.0" height="56" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="690.0" y="185" fill="#1a1a1a" font-size="19" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">ax  (16 bits)</text><rect x="480.0" y="226" width="210.0" height="56" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="585.0" y="260" fill="#1a1a1a" font-size="19" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">ah  (8)</text><rect x="690.0" y="226" width="210.0" height="56" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/><text x="795.0" y="260" fill="#1a1a1a" font-size="19" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">al  (8)</text><line x1="480.0" y1="130" x2="480.0" y2="150" stroke="#cfc3d8" stroke-width="2"/><text x="900" y="64" fill="#6d6d6d" font-size="13" font-weight="600" text-anchor="end">bit 0</text><text x="60" y="64" fill="#6d6d6d" font-size="13" font-weight="600" text-anchor="start">bit 31</text><text x="480" y="312" fill="#6d6d6d" font-size="14" font-weight="500" text-anchor="middle">ebx, ecx, edx nest the same way. ebp, esp, esi, edi stop at 16 bits (bp, sp, si, di).</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57068c"/></marker></defs>
</svg>
