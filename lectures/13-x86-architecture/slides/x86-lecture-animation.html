<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | Intel x86 Architecture | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* Lecture 12 on the lecture 10 deck engine. Arrow keys step, shift + arrow jumps a section, n shows the full narration. Open with #4.3. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 10px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 12px;
    font-size: 27px;
    line-height: 1.3;
    min-height: 44px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 23px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">10</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">
    <span class="num" id="num"></span>
    <h1 id="title">Intel x86 Architecture</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="372"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">Intel x86 Architecture</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenes.push(def); }

  // ================= 10 caching deck =================
  // ---------- helpers for this deck ----------
  const ASSET = "fig/";
  function figScene(cfg) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { imgs: {} };
        cfg.steps.forEach((s) => {
          if (!s.img || r.imgs[s.img]) return;
          const im = E("image", { x: 0, y: 0, width: 1150, height: 400, preserveAspectRatio: "xMidYMid meet" }, g);
          im.setAttributeNS("http://www.w3.org/1999/xlink", "href", ASSET + s.img);
          im.setAttribute("href", ASSET + s.img);
          im.style.opacity = 0;
          r.imgs[s.img] = im;
        });
        return r;
      },
      render(s, r) { for (const k in r.imgs) vis(r.imgs[k], k === s.img); },
    };
  }
  // table scene: cols = [{h, x, anchor, mono, w}], rows = arrays of strings; step: rows = how many rows are showing, hl = highlighted row indices
  function tableScene(cfg) {
    const RH = cfg.rh || 34, Y0 = cfg.y0 || 26, FS = cfg.fs || 15;
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { rows: [], bgs: [] };
        const W = cfg.cols[cfg.cols.length - 1].x + cfg.cols[cfg.cols.length - 1].w + 20 - cfg.cols[0].x;
        cfg.cols.forEach((c) => txt(g, c.x, Y0 - 8, c.h, { size: 12, weight: 700, fill: C.purple, ls: 1.5, anchor: c.anchor || "start" }));
        ln(g, cfg.cols[0].x - 10, Y0, cfg.cols[0].x - 10 + W, Y0, { stroke: C.purple, sw: 2 });
        cfg.rows.forEach((row, i) => {
          const gg = grp(g, 0); r.rows.push(gg);
          const y = Y0 + i * RH;
          r.bgs.push(rect(gg, cfg.cols[0].x - 10, y + 3, W, RH - 4, { rx: 6, fill: "none" }));
          row.forEach((cell, ci) => {
            const c = cfg.cols[ci];
            txt(gg, c.x, y + RH / 2 + 5, cell, { pre: true, size: c.size || FS, mono: !!c.mono, weight: c.bold ? 700 : 400, fill: c.bold ? C.purple : C.ink, anchor: c.anchor || "start" });
          });
        });
        return r;
      },
      render(s, r) {
        const n = s.rows === undefined ? cfg.rows.length : s.rows, hl = s.hl || [];
        r.rows.forEach((gg, i) => vis(gg, i < n));
        r.bgs.forEach((b, i) => b.setAttribute("fill", hl.indexOf(i) >= 0 ? C.t2 : "none"));
      },
    };
  }


  function mixScene(cfg, subs) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { subs: {}, gs: {} };
        for (const k in subs) { const gg = grp(g, 0); r.gs[k] = gg; r.subs[k] = subs[k].build(gg); }
        return r;
      },
      render(s, r) {
        for (const k in subs) { vis(r.gs[k], s.sub === k); if (s.sub === k) subs[k].render(s, r.subs[k]); }
      },
    };
  }
  const tb = (c) => tableScene(Object.assign({ steps: [{}] }, c));
  const fg = (imgs) => figScene({ steps: imgs.map((i) => ({ img: i })) });

  const trn = (el, ms) => { el.style.transition = "opacity " + ms + "ms, fill " + ms + "ms, stroke " + ms + "ms"; return el; };
  const growX = (el, ms) => { el.style.transformBox = "fill-box"; el.style.transformOrigin = "0% 50%"; el.style.transform = "scaleX(0)"; el.style.transition = "transform " + ms + "ms ease, opacity 0.3s"; return el; };
  const PC5 = ["#e2cdf2", "#d9e8fb", "#fbe9ea", "#e4f3e1", "#fff1cf"];

  // ---- cards, for short lists of points
  const cd = (head, lines, mono) => ({ head, lines: lines || [], mono: !!mono });
  const cardSub = {
    build(g) {
      const r = {};
      rect(g, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
      r.head = txt(g, 575, 135, "", { size: 42, weight: 700, fill: "#171715", anchor: "middle" });
      rect(g, 505, 160, 140, 6, { rx: 3, fill: C.accent });
      r.lines = [0, 1, 2, 3].map((i) => txt(g, 575, 218 + i * 34, "", { size: 21, fill: C.grey, anchor: "middle" }));
      return r;
    },
    render(s, r) {
      const c = s.card || {};
      r.head.textContent = c.head || "";
      r.head.setAttribute("font-size", (c.head || "").length > 30 ? 30 : 40);
      r.lines.forEach((t, i) => { t.textContent = (c.lines || [])[i] || ""; });
    },
  };

  const flowSub = {
    build(g) { return { g: grp(g, 1) }; },
    render(s, r) {
      const g = r.g; while (g.firstChild) g.removeChild(g.firstChild);
      const B = s.boxes || [], hot = s.hot || [], lab = s.lab || {}, dim = s.dim || [];
      const n = B.length, W = Math.min(n <= 3 ? 280 : 170, Math.floor((1100 - 40 * (n - 1)) / n)), gap = (1100 - W * n) / Math.max(1, n - 1), x0 = 25, y = 130, H = 78;
      B.forEach((name, i) => {
        const x = x0 + i * (W + gap), on = hot.indexOf(i) >= 0, dm = dim.indexOf(i) >= 0;
        rect(g, x, y, W, H, { rx: 14, fill: on ? C.t1 : C.white, stroke: on ? C.purple : (dm ? "#d9d9d3" : C.lgrey), sw: on ? 6 : 3 });
        txt(g, x + W / 2, y + H / 2 + 7, name, { size: Math.min(20, Math.floor((W - 16) / (name.length * 0.6))), weight: 700, fill: dm ? C.lgrey : C.ink, anchor: "middle" });
        if (lab[i]) lab[i].split("|").forEach((l, k) => txt(g, x + W / 2, y + H + 28 + k * 24, l, { size: 17, weight: 700, mono: true, fill: on ? C.red : C.grey, anchor: "middle" }));
        if (i < n - 1) {
          const lit = hot.indexOf(i) >= 0 && hot.indexOf(i + 1) >= 0, col = lit ? C.red : "#c9c9c1";
          ln(g, x + W + 6, y + H / 2, x + W + gap - 10, y + H / 2, { stroke: col, sw: lit ? 5 : 3 }); arrowhead(g, x + W + gap - 4, y + H / 2, "r", col);
        }
      });
      if (s.note) txt(g, 575, 80, s.note, { size: 22, weight: 700, fill: C.purple, anchor: "middle" });
      if (s.say) txt(g, 575, 372, s.say, { size: 21, weight: 700, fill: C.red, anchor: "middle" });
    },
  };

  // an address cut into labelled fields. step: bar = [[name, bits, note]], bar2 likewise; hot = lit field indices
  const barSub = {
    build(g) { return { g: grp(g, 1) }; },
    render(s, r) {
      const g = r.g; while (g.firstChild) g.removeChild(g.firstChild);
      const draw = (bar, y, title, hot) => {
        if (!bar) return;
        const tot = bar.reduce((a, b) => a + b[1], 0), X0 = 90, W = 970; let x = X0;
        txt(g, 90, y - 10, title, { size: 15, weight: 700, fill: C.purple, ls: 1 });
        bar.forEach((f, i) => {
          const w = W * f[1] / tot, on = !hot || hot.indexOf(i) >= 0;
          rect(g, x, y, w - 4, 60, { rx: 10, fill: on ? PC5[i % 5] : "#f4f4f0", stroke: C.purple, sw: on ? 4 : 2 });
          txt(g, x + w / 2 - 2, y + 28, f[0], { size: w < 120 ? 15 : 20, weight: 700, fill: on ? C.ink : C.lgrey, anchor: "middle" });
          txt(g, x + w / 2 - 2, y + 49, f[1] + (f[1] === 1 ? " bit" : " bits"), { size: 14, mono: true, fill: C.grey, anchor: "middle" });
          if (f[2]) txt(g, x + w / 2 - 2, y + 86, f[2], { size: 16, weight: 700, mono: true, fill: on ? C.red : C.lgrey, anchor: "middle" });
          x += w;
        });
      };
      if (s.bar3) { draw(s.bar, 50, s.t1, s.hot); draw(s.bar2, 160, s.t2, s.hot2); draw(s.bar3, 270, s.t3, s.hot3); }
      else { draw(s.bar, 70, s.t1 || "virtual address", s.hot); draw(s.bar2, 230, s.t2 || "physical address", s.hot2); }
      if (s.bar2 && s.link) { ln(g, 600, 170, 600, 224, { stroke: C.red, sw: 4 }); arrowhead(g, 600, 226, "d", C.red); txt(g, 620, 205, s.link, { size: 17, weight: 700, fill: C.red }); }
      if (s.say) txt(g, 575, 372, s.say, { size: 21, weight: 700, fill: C.red, anchor: "middle" });
    },
  };

  // ---- x86 visuals ----

  // ---- syntax highlighting for the code panels ----
  const SYN = { mn: "#57068c", reg: "#0b6fb8", num: "#b45f06", dir: "#c1272d", str: "#2e7d32", cmt: "#8a8a82", lab: "#00796b", addr: "#9f9f97", flag: "#6d6d6d" };
  const MN = "mov add sub inc dec imul cmp jmp jge je jne call ret int push pop lea";
  const SYNRE = new RegExp([
    "(;.*$)",                                                   // 1 comment
    "(\"[^\"]*\")",                                              // 2 string
    "(<[A-Za-z_0-9]+>)",                                        // 3 <label> reference
    "(\\b0x[0-9a-fA-F]+\\b|\\b[0-9][0-9a-fA-F]*h\\b|\\b[0-9]+\\b|\\$)", // 4 number
    "(\\b(?:e?[abcd]x|[abcd][hl]|e?[sb]p|e?[sd]i|eip|eflags)\\b)", // 5 register
    "(\\b(?:byte|word|dword|qword|section|global|extern|equ|db|dw|dd|dq|resb|resw|resd|resq)\\b)", // 6 directive or size
    "(\\b[A-Za-z_][A-Za-z_0-9]*\\b)",                           // 7 other word
  ].join("|"), "g");
  function synLine(p, x, y, line, o) {
    const t = E("text", { x, y, "font-size": o.size, "font-weight": 400, fill: C.ink }, p);
    t.style.fontFamily = MONO; t.style.whiteSpace = "pre"; if (o.op !== undefined) t.setAttribute("opacity", o.op);
    const add = (str, col, bold, ital) => { if (!str) return; const sp = E("tspan", { fill: col }, t, str); if (bold || o.bold) sp.setAttribute("font-weight", 700); if (ital) sp.setAttribute("font-style", "italic"); };
    const mnSet = MN.split(" ");
    const dis = /^\s*[0-9a-f]+:\s+(?:[0-9a-f]{2}\s)+/.exec(line);          // a disassembly line: address, bytes, then the instruction
    let rest = line;
    if (dis) { const m = /^(\s*[0-9a-f]+:)(\s+(?:[0-9a-f]{2}\s?)+)/.exec(line); add(m[1], SYN.addr); add(m[2], SYN.flag); rest = line.slice(m[0].length); }
    else if (/^\s*(nasm|ld|gcc)\b/.test(line)) { rest.split(/(\s+)/).forEach((w, i) => add(w, i === 0 ? SYN.mn : (/^-/.test(w) ? SYN.flag : (/\.(asm|o|c)$/.test(w) ? SYN.str : C.ink)), i === 0)); return t; }
    else if (/^\s*[A-Za-z_][A-Za-z_0-9]*:/.test(line) && !/^\s*(\w+):\s*(db|dw|dd|dq|resb|resw|resd|resq|equ)\b/.test(line) || /^\s*[0-9a-f]+ <\w+>:/.test(line)) {
      const m = /^(\s*[0-9a-f]+ )?(<?\w+>?:)/.exec(line); if (m) { if (m[1]) add(m[1], SYN.addr); add(m[2], SYN.lab, true); rest = line.slice(m[0].length); }
    } else { const m = /^(\s*)([A-Za-z_][A-Za-z_0-9]*:)(?=\s*(?:db|dw|dd|dq|resb|resw|resd|resq|equ))/.exec(line) || /^(\s*)([A-Za-z_][A-Za-z_0-9]*)(?=\s+equ\b)/.exec(line); if (m) { add(m[1], C.ink); add(m[2], SYN.lab, true); rest = line.slice(m[0].length); } }
    let first = true, last = 0, m; SYNRE.lastIndex = 0;
    while ((m = SYNRE.exec(rest))) {
      add(rest.slice(last, m.index), C.ink); last = m.index + m[0].length;
      if (m[1]) add(m[0], SYN.cmt, false, true);
      else if (m[2]) add(m[0], SYN.str);
      else if (m[3]) add(m[0], SYN.lab);
      else if (m[4]) add(m[0], SYN.num);
      else if (m[5]) add(m[0], SYN.reg);
      else if (m[6]) add(m[0], SYN.dir, true);
      else add(m[0], first && mnSet.indexOf(m[0]) >= 0 ? SYN.mn : C.ink, first && mnSet.indexOf(m[0]) >= 0);
      if (m[7] || m[4] || m[5] || m[6]) first = false;
    }
    add(rest.slice(last), C.ink);
    return t;
  }

  // code panel. step: t (small title), code (lines), hl (lit line indices), ann ({line: text}), annx, cmt (shown in grey), say
  const codeSub = {
    build(g) { return { g: grp(g, 1) }; },
    render(s, r) {
      const g = r.g; while (g.firstChild) g.removeChild(g.firstChild);
      const L = s.code || [], big = L.length <= 9, rh = big ? 34 : 27, fs = big ? 22 : 18, y0 = s.t ? 62 : 46, hl = s.hl || [], ann = s.ann || {};
      rect(g, 20, y0 - 26, 1110, rh * L.length + 22, { rx: 14, fill: C.white, stroke: C.purple, sw: 3 });
      if (s.t) txt(g, 30, 30, s.t, { size: 13, weight: 700, mono: true, fill: C.grey, ls: 1 });
      L.forEach((l, i) => {

      { sub: "tb8", rows: 3, chip: 1, cap: "An x86 program is divided into sections: text for code, data and bss for data.", narrate: "An x86 program is divided into <strong>sections</strong>, and you tell the assembler which one you are writing into. <code>.text</code> is your code. <code>.data</code> is global data that starts with a value. <code>.bss</code> is global data that starts uninitialised: it is just reserved space." },
      { sub: "code", t: "ONE PROGRAM, THREE SECTIONS", code: ["section .data", "my_favorite_string: db \"Here is an initialized value.\"", "some_number: dd 42", "section .bss", "uninitialized_32byte_buffer: resb 32", "section .text", "global _start", "_start:                  ; the first instruction to run", "    mov [uninitialized_32byte_buffer], ah"], chip: 1, cap: "The three sections in one program.", narrate: "Here they are in one program. Initialised data first, then the reserved buffer, then the code. <code>_start</code> is where execution begins." },
      { sub: "vfig", img: "x86-two-lines", chip: 2, cap: "Instructions become machine code. Directives instruct the assembler and are not executed.", narrate: "Two kinds of line appear in there, and the difference matters. <strong>Instructions</strong> like <code>mov</code>, <code>add</code> and <code>jmp</code> are translated by the assembler into machine-code bytes. <strong>Directives</strong> like <code>section</code>, <code>db</code>, <code>global</code> and <code>equ</code> are instructions to the assembler. They shape the output but are not themselves executed." },
      { sub: "tb8d", rows: 5, chip: 2, cap: "The five directives you will see most.", narrate: "The directives you will see most. <code>section</code> switches section. <code>db</code>, <code>dw</code>, <code>dd</code> and <code>dq</code> put initialised data in memory. <code>resb</code> and friends reserve space. <code>global</code> makes a symbol visible to the linker, and <code>equ</code> defines a constant at assembly time." },
      { sub: "tb8s", rows: 4, chip: 3, cap: "The size names, which you will see everywhere.", narrate: "The size names, which you will see everywhere: byte is 8 bits, word is 16, dword is 32, qword is 64. Each has a data directive and a matching register." },
      { sub: "code", t: "A LABEL'S VALUE IS AN ADDRESS", code: ["age: dd 0", "mov ebx, age       ; ebx = the ADDRESS of age", "mov eax, [age]     ; eax = the VALUE stored there"], hl: [1], ann: { 1: "no brackets: the address", 2: "brackets: the value" }, annx: 800, chip: 4, cap: "mov ebx, age puts the address in ebx. mov eax, [age] puts the value in eax.", narrate: "A label's value is the address of the line it names. So after <code>age: dd 0</code>, writing <code>mov ebx, age</code> puts the <strong>address</strong> in <code>ebx</code>, and <code>mov eax, [age]</code> puts the <strong>value stored there</strong> in <code>eax</code>. The brackets are the entire difference again." },
      { sub: "code", t: "SEVERAL VALUES IN ONE DIRECTIVE: BACK TO BACK", code: ["morestuff:  dd 96, 42, 99     ; at morestuff, +4, +8", "stuffstuff: dw 96, 42, 99     ; at +0, +2, +4", "bytestuff:  db 96, 42, 99     ; at +0, +1, +2"], chip: 4, cap: "Several values in one directive sit back to back, spaced by the size.", narrate: "Several values in one directive are laid out back to back. With <code>dd</code> they are four bytes apart, with <code>dw</code> two apart, with <code>db</code> one apart." },
    ],
  }, xs({ tb8: tb(T8), tb8d: tb(T8D), tb8s: tb(T8S) })));

  // ================= 9 Arrays and strings =================
  scene(mixScene({
    num: "9", title: "Arrays and Strings", subtitle: "Base plus index times size. And two ways to end a string.",
    chips: ["Arrays", "C-style strings", "Pascal-style strings", "Encodings"],
    steps: [
      { sub: "vfig", img: "x86-array", chip: 1, cap: "Element n of an array of s-byte elements lives at base + n times s.", narrate: "An array is consecutive elements of equal size, so element <em>n</em> of an array of <em>s</em>-byte elements lives at base plus <em>n</em> times <em>s</em>." },
      { sub: "code", t: "x86 COMPUTES THAT IN ONE OPERAND", code: ["mov eax, [arr + ebx*4]     ; eax = arr[ebx], an array of dwords"], ann: { 0: "" }, chip: 1, cap: "arr is the base, ebx the index, and 4 the element size.", narrate: "x86 has an operand form that computes that in one go. Here <code>arr</code> is the base address, <code>ebx</code> is the index, and the <code>*4</code> is the element size. Compare with E20, where you would shift or add in a loop to build that address by hand." },
      { sub: "lean", card: cd("The scale factor", ["1, 2, 4 or 8", "bytes, words, dwords or qwords", "the hardware allows nothing else"]), chip: 1, cap: "The scale is 1, 2, 4 or 8: the sizes of the elements.", narrate: "The hardware allows scale factors of 1, 2, 4 or 8. Those are exactly the sizes of a byte, word, dword and qword." },
      { sub: "lean", card: cd("Strings", ["there is no single way to store one", "how are characters encoded?", "how do we know where it ends?", "two separate questions"]), chip: 2, cap: "Every string representation answers two questions: the encoding, and where it ends.", narrate: "There is no single way to store a string. Every representation has to answer two questions: how are characters encoded, and how do we know where the string ends?" },
      { sub: "mem", pre: "mystring", cells: ["48", "65", "6c", "6c", "6f", "00"], chars: ["H", "e", "l", "l", "o", "\\0"], hot: [5], code: "mystring: db \"Hello\", 0", chip: 2, cap: "C-style: a zero byte marks the end.", narrate: "<strong>C-style</strong> strings end with a zero byte. <code>db \"Hello\", 0</code> stores <code>48 65 6c 6c 6f 00</code>." },
      { sub: "lean", card: cd("C-style: the trade", ["easy to write, any length allowed", "the length means walking the string", "the body cannot contain a zero byte"]), chip: 2, cap: "Easy and unlimited, but the length costs a walk, and the body cannot hold a zero.", narrate: "Easy to write, and any length is allowed. But finding the length means walking the whole string, and the body cannot contain a zero byte." },
      { sub: "mem", pre: "mystring", cells: ["05", "48", "65", "6c", "6c", "6f"], chars: ["5", "H", "e", "l", "l", "o"], hot: [0], code: "mystring: db 5, \"Hello\"", chip: 3, cap: "Pascal-style: the length comes first.", narrate: "<strong>Pascal-style</strong> strings carry their length in front. <code>db 5, \"Hello\"</code> stores <code>05 48 65 6c 6c 6f</code>." },
      { sub: "lean", card: cd("Pascal-style: the trade", ["the length is instant", "the body can hold any byte", "a one-byte length caps it at 255"]), chip: 3, cap: "Instant length and any byte allowed, but capped at 255 characters.", narrate: "Length is instant and the body can hold any byte, but a one-byte length caps the string at 255 characters." },
      { sub: "lean", card: cd("Multi-byte encodings", ["UTF-16: two or more bytes a character", "other alphabets, emoji", "indexing and length are harder", "encoding and end-marking are separate"]), chip: 4, cap: "How a string is encoded and how its length is marked are independent choices.", narrate: "Multi-byte encodings such as UTF-16 use two or more bytes per character, so they can hold other alphabets and emoji, but indexing and length are harder. How the string is <em>encoded</em> and how its length is <em>marked</em> are independent choices." },
    ],
  }, xs({})));

  // ================= 10 Where this is going =================
  scene(mixScene({
    num: "10", title: "Where This Is Going", subtitle: "Reading today. Writing next week. A first program to run.",
    chips: ["What you can read", "Next week", "Hello, world"],
    steps: [
      { sub: "ana", parts: [["mov", "opcode"], ["ah", "writes 1 byte"], ["[some_string+ebx]", "reads 1 byte from base + index"]], note: "mov ah, [some_string+ebx]", say: "which register, how many bytes, from where", chip: 1, cap: "You can now say which register is written, how many bytes, and from where.", narrate: "You can now read a line like <code>mov ah, [some_string+ebx]</code> and say which register is written, how many bytes are read, from where, and in what order they are combined. That is most of what an x86 <em>architecture</em> is." },
      { sub: "vfig", img: "x86-roadmap", chip: 2, cap: "Next week is the instruction set, then the stack, call and ret.", narrate: "Next week is the instruction set: arithmetic and logic, <code>cmp</code> and the conditional jumps, and how a <code>for</code> loop or an <code>if</code> in C turns into x86. After that, the stack, <code>call</code> and <code>ret</code>." },
      { sub: "vfig", img: "x86-syscall", chip: 2, cap: "And the one instruction that gets a program out of its sandbox: int 0x80.", narrate: "And the one instruction that gets a program out of its own sandbox: <code>int 0x80</code>, which asks Linux to do something on its behalf. Here is a preview, since it is the first program you will actually run." },
      { sub: "code", t: "HELLO, WORLD: THE DATA", code: ["section .data", "hello_text: db \"Hello, world\", 10", "hello_text_len equ $-hello_text", "", "section .text", "global _start", "_start:"], hl: [1, 2], ann: { 1: "12 characters and a newline (10)", 2: "$ is here: length = 13" }, annx: 560, chip: 3, cap: "The text, and its length: the assembler subtracts the label from here.", narrate: "The data section holds the text and a newline. <code>$-hello_text</code> is the assembler subtracting the label's address from here, which gives the string length: 13 bytes, 12 characters plus the newline." },
      { sub: "code", t: "HELLO, WORLD: THE SYSTEM CALLS", code: ["mov eax, 4              ; system call number 4: write", "mov ebx, 1              ; file descriptor 1: standard output", "mov ecx, hello_text     ; address of the bytes to write", "mov edx, hello_text_len ; how many bytes", "int 80h                 ; ask the kernel", "mov eax, 1              ; system call number 1: exit", "mov ebx, 0              ; exit code 0", "int 80h"], hl: [2], ann: {}, chip: 3, cap: "Every line is readable. Note ecx holds an address: no brackets.", narrate: "Every line should now be readable, even if you cannot yet write it from scratch. Notice <code>ecx</code> holds an <strong>address</strong>, with no brackets, because <code>write</code> wants a pointer to the bytes. <code>edx</code> says how many. Then <code>int 80h</code> asks the kernel. The second system call, number 1, exits." },
    ],
  }, xs({})));

  // ---------------- engine ----------------
  const NARR_OVR = {};
  scenes.forEach((sc) => { const p = sc.num === "" ? "0" : sc.num; sc.steps.forEach((s, i) => { const o = NARR_OVR[p + "." + (i + 1)]; if (o) s.narrate = o; }); });
  const SEC_INTRO = {};
  const $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const foot = txt(svg, 575, 392, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

  scenes.forEach((sc) => {
    sc.g = E("g", {}, svg);
    sc.g.style.display = "none";
    sc.r = sc.build(sc.g) || {};
    foot.parentNode.appendChild(foot);
  });
  $("sec-total").textContent = scenes.length - scenes.filter((x) => x.front).length;

  // si: section, ti: step, ph: 0 = question showing (diagram as before), 1 = answered
  const off = scenes.filter((x) => x.front).length;   // title slides don't count as sections
  let si = 0, ti = 0, ph = 1, shownScene = -1;
  const asks = (i, k) => !!scenes[i].steps[k].q;
  const startPh = (i, k) => (asks(i, k) && k > 0 ? 0 : 1);

  function readHash() {
    const m = location.hash.match(/^#(\d+)\.(\d+)(q?)$/);
    if (!m) { ph = startPh(si, ti); return; }
    const a = Number(m[1]) - 1 + off, b = Number(m[2]) - 1;
    if (a >= 0 && a < scenes.length) { si = a; ti = Math.max(0, Math.min(scenes[a].steps.length - 1, b)); }
    ph = m[3] && asks(si, ti) && ti > 0 ? 0 : 1;
  }

  function buildChips(sc) {
    const box = $("chips");
    box.innerHTML = "";
    sc.chips.forEach((label) => {
      const d = document.createElement("div");
      d.className = "stp";
      d.textContent = label;
      box.appendChild(d);
    });
  }


  const secOvl = grp(svg, 1); secOvl.style.display = "none";
  function drawSecTitle(sc) {
    while (secOvl.firstChild) secOvl.removeChild(secOvl.firstChild);
    secOvl.style.display = "inline";
    circ(secOvl, 150, 150, 84, { fill: C.purple });
    txt(secOvl, 150, 182, sc.num, { size: 90, weight: 700, fill: C.white, anchor: "middle" });
    txt(secOvl, 150, 276, "SECTION " + sc.num + " OF " + (scenes.length - scenes.filter((x) => x.front).length), { size: 13, weight: 700, mono: true, fill: C.grey, anchor: "middle", ls: 2 });
    const parts = sc.title.indexOf(": ") > 0 ? [sc.title.slice(0, sc.title.indexOf(": ")), sc.title.slice(sc.title.indexOf(": ") + 2)] : [sc.title, ""];
    txt(secOvl, 290, parts[1] ? 120 : 140, parts[0], { size: Math.min(46, Math.floor(840 / (parts[0].length * 0.56))), weight: 700, fill: "#171715" });
    if (parts[1]) txt(secOvl, 290, 170, parts[1], { size: 28, weight: 700, fill: C.purple });
    rect(secOvl, 290, parts[1] ? 190 : 162, 120, 6, { rx: 3, fill: C.accent });
    txt(secOvl, 290, parts[1] ? 232 : 206, sc.subtitle || "", { size: 21, italic: true, fill: C.grey });
    txt(secOvl, 290, 288, "IN THIS SECTION", { size: 13, weight: 700, mono: true, fill: C.grey, ls: 2 });
    let x = 290, y = 324;
    sc.chips.forEach((c, i) => { const w = c.length * 10.5 + 34; if (x + w > 1120) { x = 290; y += 40; } rect(secOvl, x, y - 22, w, 32, { rx: 16, fill: C.white, stroke: C.purple, sw: 3 }); txt(secOvl, x + w / 2, y, c, { size: 16, weight: 700, fill: C.ink, anchor: "middle" }); x += w + 12; });
  }
  function render() {
    const sc = scenes[si], s = sc.steps[ti];
    if (shownScene !== si) {
      scenes.forEach((x, k) => { x.g.style.display = k === si ? "inline" : "none"; });
      $("num").textContent = sc.num;
      $("title").textContent = sc.title;
      $("subtitle").textContent = sc.subtitle;
      document.querySelector(".stage").style.visibility = sc.front ? "hidden" : "";
      $("subtitle").style.visibility = sc.front ? "hidden" : "";
      $("sec-wrap").style.display = sc.front ? "none" : "";
      $("foot-left").textContent = sc.title;
      buildChips(sc);
      shownScene = si;
    }
    const asking = ph === 0 && !!s.q && ti > 0;
    // while a question is showing, the diagram stays exactly as the previous step left it
    if (s.sectitle) { sc.g.style.display = "none"; drawSecTitle(sc); } else { sc.g.style.display = "inline"; secOvl.style.display = "none"; sc.render(asking ? sc.steps[ti - 1] : s, sc.r, ti); }
    foot.textContent = asking ? "" : (s.foot || "");
    const qm = '<span class="qm">Q</span>';
    $("narration").innerHTML = asking ? '<div class="q big">' + qm + s.q + '</div>'
      : (s.q ? '<div class="q small">' + qm + s.q + '</div>' : "") + ((!fullText && s.cap) || s.narrate);
    $("sec-n").textContent = si - off + 1;
    $("step-n").textContent = ti + 1;
    $("step-total").textContent = sc.steps.length;
    document.querySelectorAll(".stp").forEach((chip, k) => {
      const n = k + 1;
      chip.classList.remove("active", "done");
      if (!s.chip) return;
      if (s.chip === n) chip.classList.add("active");
      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "n" || e.key === "N") { fullText = !fullText; render(); return; }
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  let fullText = false;
  window.DECK_STEPS = scenes.map(function (sc) { return { num: sc.num, title: sc.title, front: !!sc.front, steps: sc.steps.map(function (s) { return Object.assign({}, s); }) }; });
  if (location.search.indexOf('dump') >= 0) { var pre = document.createElement('pre'); pre.id = 'dump'; pre.textContent = JSON.stringify(window.DECK_STEPS); document.body.innerHTML = ''; document.body.appendChild(pre); return; }
  readHash();
  render();
})();
</script>

</body>
