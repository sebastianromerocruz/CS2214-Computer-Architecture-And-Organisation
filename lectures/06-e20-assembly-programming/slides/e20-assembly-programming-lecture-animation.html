<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | E20 Assembly Programming | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* One deck for the whole E20 Assembly Programming lecture, built on the 05-e20 deck (same step engine).
     Same principle as the 03-verilog animations: a hand-rolled step machine
     driven by the arrow keys, one small change per step, plain language
     before jargon. Each section is a "scene" with its own diagram; the arrow
     keys run straight through all of them. Shift + arrow jumps a section.
     Question-and-answer form: at key beats the slide first asks a question
     (the diagram stays as the previous step left it) and the next key press
     reveals the diagram and the answer. Open with #3.5 to start at section 3,
     step 5 (answered), or #3.5q for the same step with the question showing. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 16px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 14px;
    font-size: 19px;
    line-height: 1.35;
    min-height: 52px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">9</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">
    <span class="num" id="num"></span>
    <h1 id="title">E20 Assembly Programming</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="340"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">E20 Assembly Programming</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenes.push(def); }
  // ---------- shared helpers for the E20 scenes ----------
  function codeRows(g, x, y0, dy, w, lines, o) {
    o = o || {};
    const rows = [], texts = [], addrs = [];
    lines.forEach((ln, i) => {
      const y = y0 + i * dy;
      const sz = o.size || 17, tight = dy < 22;
      rows.push(rect(g, x, tight ? y - sz * 0.95 - 1 : y - dy + 8, w, tight ? sz * 0.95 + 6 : dy - 2, { rx: 6 }));
      addrs.push(txt(g, x + 26, y, ln.a === undefined ? "" : String(ln.a), { size: tight ? Math.min(15, sz + 1) : 15, mono: true, fill: C.lgrey, anchor: "middle" }));
      texts.push(txt(g, x + 56, y, ln.t, { size: o.size || 17, weight: 600, mono: true, pre: true, fill: ln.dim ? C.lgrey : C.ink }));
    });
    return { rows, texts, addrs };
  }
  function regBoxes(g, x0, y0, w, h, dx, dy, vals) {
    const boxes = [], vs = [];
    for (let i = 0; i < 8; i++) {
      const x = x0 + (i % 4) * dx, y = y0 + Math.floor(i / 4) * dy;
      boxes.push(rect(g, x, y, w, h, { rx: 10, fill: i === 0 ? "#dcd2e6" : C.white, stroke: C.purple, sw: 4 }));
      txt(g, x + 10, y + 20, "$" + i, { size: 14, weight: 700, mono: true, fill: C.purple });
      vs.push(txt(g, x + w / 2, y + h - 14, String(vals[i]), { size: 24, weight: 700, mono: true, anchor: "middle", fill: i === 0 ? C.grey : C.ink }));
    }
    return { boxes, vs };
  }

  // ---------- generic trace scene: code on the left, registers (and memory) on the right ----------
  function traceScene(cfg) {
    const rowH = cfg.rowH || 32, Y0 = 92;
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [],
      steps: cfg.steps,
      build(g) {
        const r = {};
        rect(g, 30, 52, 560, 320, { rx: 16, fill: C.white, stroke: C.purple, sw: 5 });
        txt(g, 58, 80, "ADDR", { size: 11, weight: 700, fill: C.grey, ls: 1 });
        txt(g, 100, 80, "E20 ASSEMBLY", { size: 13, weight: 700, fill: C.purple, ls: 1 });
        r.code = codeRows(g, 44, Y0 + 12, rowH, 536, cfg.lines, { size: cfg.size });
        r.chev = txt(g, 20, 0, "▶", { size: 15, fill: C.red });
        r.tags = [];
        (cfg.labels || []).forEach(([li, name]) => {
          const t = txt(g, 570, Y0 + 12 + li * rowH, name, { size: 13, weight: 700, mono: true, fill: C.accent, anchor: "end" });
          t.style.opacity = 0; r.tags.push(t);
        });
        r.reg = regBoxes(g, 620, 60, 118, 66, 128, 82, [0, 0, 0, 0, 0, 0, 0, 0]);
        txt(g, 620, 236, "PC", { size: 12, weight: 700, fill: C.grey, ls: 1 });
        rect(g, 620, 244, 130, 52, { rx: 10, fill: C.white, stroke: C.purple, sw: 4 });
        r.pc = txt(g, 685, 279, "0", { size: 24, weight: 700, mono: true, anchor: "middle", fill: C.purple });
        r.mem = [];
        if (cfg.mem) {
          txt(g, 790, 236, "MEMORY", { size: 12, weight: 700, fill: C.grey, ls: 1 });
          cfg.mem.forEach((a, i) => {
            const x = 790 + i * 92;
            const b = rect(g, x, 244, 84, 52, { rx: 10, fill: C.white, stroke: C.purple, sw: 4 });
            txt(g, x + 8, 262, "[" + a + "]", { size: 12, weight: 700, mono: true, fill: C.lgrey });
            const v = txt(g, x + 42, 288, "", { size: 20, weight: 700, mono: true, anchor: "middle" });
            r.mem.push({ a, b, v });
          });
        }
        r.note = txt(g, 620, 340, "", { size: 15, italic: true, fill: C.grey });
        return r;
      },
      render(s, r) {
        r.code.rows.forEach((el) => { el.setAttribute("fill", "none"); el.setAttribute("stroke", "none"); });
        if (s.ex !== null && s.ex !== undefined) { r.code.rows[s.ex].setAttribute("fill", C.t2); r.code.rows[s.ex].setAttribute("stroke", C.red); r.code.rows[s.ex].setAttribute("stroke-width", 3); }
        r.chev.setAttribute("y", Y0 + 12 + s.pc * rowH);
        r.pc.textContent = s.pcv !== undefined ? s.pcv : s.pc;
        r.reg.vs.forEach((v, i) => { v.textContent = s.regs[i]; });
        r.reg.boxes.forEach((b, i) => {
          const ch = s.changed === "r" + i;
          b.setAttribute("fill", ch ? C.t2 : (i === 0 ? "#dcd2e6" : C.white));
          b.setAttribute("stroke", ch ? C.red : C.purple);
        });
        r.mem.forEach((m) => {
          const v = s.mem ? s.mem[m.a] : undefined;
          m.v.textContent = v === undefined ? "0" : v;
          const ch = s.changed === "m" + m.a, rd = s.read === "m" + m.a;
          m.b.setAttribute("fill", ch ? C.t2 : (rd ? C.t4 : C.white));
          m.b.setAttribute("stroke", ch ? C.red : (rd ? C.accent : C.purple));
        });
        r.tags.forEach((t) => vis(t, !!s.labels));
        r.note.textContent = s.note || "";
      },
    };
  }

  // ================= Title slide =================
  (function () {
    const ROUTE = ["From Instructions to Programs", "Conditionals: If/Else", "Loops: For and While",
                   "Arrays", "Palindrome: Two Pointers", "Subroutines: jal and jr",
                   "The Return-Address Problem", "Recursion and the Case for a Stack", "Tracing a Complete Program"];
    scene({
      front: true,
      num: "", title: "E20 Assembly Programming", subtitle: "",
      chips: [],
      steps: [
        { view: "title", foot: "",
          narrate: "Last week: the E20's vocabulary, registers, memory, the raw mechanics of jumping. Today: the grammar. We take those primitives and assemble them into <strong>if</strong>/<strong>else</strong>, <strong>for</strong>, <strong>while</strong>, arrays, and function calls." },
        { view: "route", foot: "nine sections, one small toolkit",
          narrate: "E20 has no <code>if</code>, no <code>for</code>, no <code>while</code>, no <code>function</code>. Everything on this list compiles down to some arrangement of four primitives: <code>jeq</code>, <code>j</code>, <code>jr</code>, <code>jal</code>. Here's the route." },
      ],
      build(g) {
        const r = {};
        r.title = grp(g, 1);
        rect(r.title, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
        txt(r.title, 575, 104, "CS-UY 2214  |  WEEK V", { size: 15, weight: 700, fill: C.red, anchor: "middle", ls: 2 });
        txt(r.title, 575, 190, "E20 Assembly Programming", { size: 54, weight: 700, fill: "#171715", anchor: "middle" });
        rect(r.title, 505, 214, 140, 6, { rx: 3, fill: C.accent });
        txt(r.title, 575, 258, "Four primitives, every control-flow pattern you know", { size: 22, italic: true, fill: C.grey, anchor: "middle" });
        txt(r.title, 575, 312, "Computer Architecture and Organization", { size: 14, fill: C.lgrey, anchor: "middle", ls: 1 });

        r.route = grp(g, 0);
        txt(r.route, 575, 46, "TODAY'S ROUTE", { size: 13, weight: 700, fill: C.purple, anchor: "middle", ls: 2 });
        ROUTE.forEach((name, i) => {
          const col = i < 5 ? 0 : 1, row = col === 0 ? i : i - 5;
          const x = 150 + col * 460, y = 70 + row * 58;
          rect(r.route, x, y, 420, 48, { rx: 12, fill: C.white, stroke: C.purple, sw: 4 });
          circ(r.route, x + 30, y + 24, 15, { fill: C.purple });
          txt(r.route, x + 30, y + 30, String(i + 1), { size: 15, weight: 700, fill: C.white, anchor: "middle" });
          txt(r.route, x + 60, y + 31, name, { size: 17, weight: 700, fill: C.ink });
        });
        txt(r.route, 575, 366, "1 to 4.1: control flow and data   |   5 to 7: subroutines and their one real limitation   |   8: it all comes together", { size: 13, italic: true, fill: C.grey, anchor: "middle" });
        return r;
      },
      render(s, r) { vis(r.title, s.view === "title"); vis(r.route, s.view === "route"); },
    });
  })();

  // ================= 1 From Instructions to Programs =================
  (function () {
    const cards = [
      { name: "jeq", sub: "conditional", desc: "changes flow based on a condition", fill: C.t1 },
      { name: "j", sub: "unconditional", desc: "changes flow, no questions asked", fill: C.t4 },
      { name: "jr", sub: "register", desc: "changes flow through a register", fill: C.t5 },
      { name: "jal", sub: "remembers", desc: "changes flow AND remembers where it came from", fill: C.t6 },
    ];
    scene({
      num: "1", title: "From Instructions to Programs", subtitle: "E20 has no if, no for, no while, no function.",
      chips: ["The primitives", "jeq", "j and jr", "jal", "The upshot"],
      steps: [
        { n: 0, chip: 1, foot: "vocabulary vs. grammar", narrate: "Every structured pattern you'll write this semester, no matter how it reads in a higher-level language, is built from exactly <strong>four</strong> primitives. That's it. Four." },
        { n: 1, chip: 2, foot: "the only conditional", narrate: "<code>jeq</code>: the only thing that changes control flow <em>based on a condition</em>. Compare two registers, jump if they're equal, fall through otherwise." },
        { n: 2, chip: 3, foot: "unconditional, and through a register", narrate: "<code>j</code>: changes flow unconditionally, no questions asked. <code>jr</code>: changes flow through whatever address is sitting in a register: the destination can change at runtime." },
        { n: 3, chip: 4, foot: "the one that remembers", narrate: "<code>jal</code>: changes flow <em>and</em> remembers where it came from, by stashing a return address in <code>$7</code> before it jumps." },
        { n: 4, chip: 5, foot: "the upshot", narrate: "Every <code>if</code>/<code>else</code>, every <code>for</code>, every <code>while</code>, every function call you'll write in E20 compiles down to some arrangement of these four. This isn't an E20 limitation: it's true of every processor you'll ever program close to the metal, including the one in your laptop. A compiler's whole job, in the control-flow department, is exactly this translation: <code>if (x &lt; y) { ... } else { ... }</code> becomes a comparison plus a couple of jumps. Once you've done it by hand a few times, you'll never see an <code>if</code> statement the same way again." },
      ],
      build(g) {
        const r = { cards: [] };
        cards.forEach((c, i) => {
          const x = 60 + i * 260, e = grp(g, 0);
          rect(e, x, 90, 230, 200, { rx: 18, fill: c.fill, stroke: C.purple, sw: 6 });
          txt(e, x + 115, 140, c.name, { size: 34, weight: 700, mono: true, fill: C.purple, anchor: "middle" });
          txt(e, x + 115, 164, c.sub.toUpperCase(), { size: 12, weight: 700, fill: C.grey, anchor: "middle", ls: 1 });
          const words = c.desc.split(" ");
          let line = "", ylines = [];
          words.forEach((w) => { if ((line + w).length > 22) { ylines.push(line.trim()); line = ""; } line += w + " "; });
          ylines.push(line.trim());
          ylines.forEach((l, k) => txt(e, x + 115, 200 + k * 20, l, { size: 15, weight: 600, anchor: "middle" }));
          r.cards.push(e);
        });
        r.closing = grp(g, 0);
        rect(r.closing, 60, 320, 1030, 60, { rx: 14, fill: C.white, stroke: C.red, sw: 5 });
        txt(r.closing, 575, 356, "if / for / while / function  ->  jeq + j + jr + jal, composed", { size: 22, weight: 700, mono: true, fill: C.red, anchor: "middle" });
        return r;
      },
      render(s, r) {
        r.cards[0].style.opacity = s.n >= 1 ? 1 : 0;
        r.cards[1].style.opacity = s.n >= 2 ? 1 : 0;
        r.cards[2].style.opacity = s.n >= 2 ? 1 : 0;
        r.cards[3].style.opacity = s.n >= 3 ? 1 : 0;
        vis(r.closing, s.n === 4);
      },
    });
  })();

  // ================= 2 Conditionals: If/Else in E20 =================
  (function () {
    const linesIf = [
      { a: 0, t: "movi $1, 5" }, { a: 1, t: "jeq  $1, $0, they_are_equal" }, { a: 2, t: "addi $1, $1, 1" },
      { a: 3, t: "j    done" }, { t: "they_are_equal:", dim: true }, { a: 4, t: "    addi $1, $1, 2" },
      { t: "done:", dim: true }, { a: 5, t: "    halt" },
    ];
    const linesRel = [
      { a: 0, t: "movi $2, 3" }, { a: 1, t: "movi $3, 8" }, { a: 2, t: "slt  $1, $2, $3" },
      { a: 3, t: "jeq  $1, $0, not_less" }, { a: 4, t: "addi $2, $2, 1" }, { a: 5, t: "j    done" },
      { t: "not_less:", dim: true }, { a: 6, t: "    addi $2, $2, 2" }, { t: "done:", dim: true }, { a: 7, t: "    halt" },
    ];
    const RZ8 = [0, 0, 0, 0, 0, 0, 0, 0];
    const wr = (base, i, v) => { const a = base.slice(); a[i] = v; return a; };
    const S = (view, o) => Object.assign({ view, chip: 0 }, o);
    const steps = [
      S("if", { ex: null, pc: 0, regs: RZ8, foot: "the else problem", narrate: "<code>jeq</code> gives you the 'then' branch for free. The subtlety is the 'else' branch: E20 doesn't jump on failure, the <code>pc</code> just moves to the next line as if the comparison never happened." }),
      S("if", { ex: 0, pc: 1, regs: wr(RZ8, 1, 5), changed: "r1", foot: "start with $1 = 5", narrate: "<code>$1 = 5</code>, our starting value." }),

      S({ n: 6, chip: 3, call: "fib(2) saves 1, calls fib(0)", stack: ["3   (fib(3)'s argument)", "RA0 (fib(3)'s return address)", "2   (fib(2)'s argument)", "RA1 (fib(2)'s return address)", "1   (fib(1)'s result, saved)"], foot: "step 4", narrate: "Back in <code>fib(2)</code>: <code>fib(1)</code>'s result is 1. Push it (it needs to survive the next call), then call <code>fib(0)</code>." }),
      S({ n: 7, chip: 3, call: "fib(0): base case, returns 0", stack: ["3   (fib(3)'s argument)", "RA0 (fib(3)'s return address)", "2   (fib(2)'s argument)", "RA1 (fib(2)'s return address)", "1   (fib(1)'s result, saved)"], foot: "step 5", narrate: "<code>fib(0)</code> is a base case too: it returns 0 directly." }),
      S({ n: 8, chip: 3, call: "fib(2) returns 1 to fib(3)", stack: ["3   (fib(3)'s argument)", "RA0 (fib(3)'s return address)"], foot: "step 6", narrate: "Back in <code>fib(2)</code>: pop <code>fib(0)</code>'s result (0) and <code>fib(1)</code>'s saved result (1), sum them (1), then pop its own return address and argument off the stack, and return 1 to <code>fib(3)</code>." }),
      S({ n: 9, chip: 4, call: "fib(3) saves 1, calls fib(1) again", stack: ["3   (fib(3)'s argument)", "RA0 (fib(3)'s return address)", "1   (fib(2)'s result, saved)"], foot: "step 7", narrate: "Back in <code>fib(3)</code>: <code>fib(2)</code>'s result is 1. Push it, then call <code>fib(1)</code> a second time: the other term in <code>fib(3) = fib(2) + fib(1)</code>." }),
      S({ n: 10, chip: 4, call: "fib(1): base case again, returns 1", stack: ["3   (fib(3)'s argument)", "RA0 (fib(3)'s return address)", "1   (fib(2)'s result, saved)"], foot: "step 8", narrate: "<code>fib(1)</code> is a base case again: returns 1." }),
      S({ n: 11, chip: 4, call: "fib(3) returns 2", stack: [], foot: "step 9: stack empty again", narrate: "Back in <code>fib(3)</code>: pop this second <code>fib(1)</code>'s result (1) and the saved <code>fib(2)</code> result (1), sum them (2), pop its own return address and argument, and return 2. Every cell that went on has come back off, in reverse order: the stack is empty again." }),
      S({ n: 12, chip: 4, call: "", stack: [], foot: "one return address -> as many as you need", narrate: "<strong>A stack turns 'one return address' into 'as many as you have memory for.'</strong> <code>fib(3)</code> only goes three calls deep; nothing about the mechanism changes if it went thirty, or three thousand. That's the capability plain E20 subroutines are missing, and it's the single biggest reason real ISAs build a hardware stack in." }),
    ];
    scene({
      num: "7", title: "Recursion and the Case for a Stack", subtitle: "One return address turns into as many as you have memory for.",
      chips: ["The idea", "fib(3) begins", "The deepest point", "Unwinding"],
      steps,
      build(g) {
        const r = {};
        r.intro = grp(g, 1);
        rect(r.intro, 175, 70, 800, 220, { rx: 18, fill: C.white, stroke: C.purple, sw: 6 });
        txt(r.intro, 575, 106, "SIMULATING PUSH / POP BY HAND", { size: 13, weight: 700, fill: C.purple, anchor: "middle", ls: 2 });
        const psLines = ["# push $reg: store at top of stack, bump the pointer up", "sw   $reg, 0($6)", "addi $6, $6, 1", "", "# pop into $reg: bump the pointer down, load from the new top", "addi $6, $6, -1", "lw   $reg, 0($6)"];
        psLines.forEach((l, i) => txt(r.intro, 210, 140 + i * 22, l, { size: 15, weight: 600, mono: true, pre: true, fill: l.startsWith("#") ? C.grey : C.ink }));

        r.stackPanel = grp(g, 0);
        rect(r.stackPanel, 60, 60, 520, 320, { rx: 16, fill: C.white, stroke: C.purple, sw: 5 });
        txt(r.stackPanel, 320, 90, "THE STACK", { size: 13, weight: 700, fill: C.purple, anchor: "middle", ls: 2 });
        r.slots = []; r.slotTexts = [];
        for (let i = 0; i < SLOTS; i++) {
          const y = 110 + (SLOTS - 1 - i) * 40;
          const b = rect(r.stackPanel, 90, y, 460, 34, { rx: 6, fill: C.t3, stroke: C.purple, sw: 2 });
          const t = txt(r.stackPanel, 320, y + 23, "", { size: 15, weight: 700, mono: true, anchor: "middle" });
          r.slots.push(b); r.slotTexts.push(t);
        }
        r.topTag = txt(r.stackPanel, 570, 0, "◀ top", { size: 13, weight: 700, fill: C.red, anchor: "start" });

        r.callPanel = grp(g, 0);
        rect(r.callPanel, 620, 60, 460, 90, { rx: 16, fill: C.t1, stroke: C.purple, sw: 5 });
        txt(r.callPanel, 850, 92, "RIGHT NOW", { size: 12, weight: 700, fill: C.purple, anchor: "middle", ls: 1 });
        r.callText = txt(r.callPanel, 850, 128, "", { size: 19, weight: 700, mono: true, anchor: "middle" });

        r.closing = grp(g, 0);
        rect(r.closing, 620, 170, 460, 190, { rx: 16, fill: C.t4, stroke: C.purple, sw: 5 });
        txt(r.closing, 850, 340, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });
        return r;
      },
      render(s, r) {
        vis(r.intro, s.n <= 1);
        vis(r.stackPanel, s.n >= 2);
        vis(r.callPanel, s.n >= 2);
        for (let i = 0; i < SLOTS; i++) {
          const content = s.stack[i];
          r.slotTexts[i].textContent = content || "";
          r.slots[i].setAttribute("fill", content ? (i === s.stack.length - 1 ? C.t2 : C.t1) : C.t3);
          r.slots[i].setAttribute("stroke", content ? C.purple : "#d9d9d3");
        }
        r.callText.textContent = s.call || "";
      },
    });
  })();

  // ================= 8 Tracing a Complete Program =================
  (function () {
    const lines = [
      { a: 0, t: "main: movi $1, 0" }, { a: 1, t: "    movi $2, 0" }, { a: 2, t: "loop: lw   $3, myarray($1)" },
      { a: 3, t: "    jeq  $3, $0, done" }, { a: 4, t: "    slti $4, $3, 10" }, { a: 5, t: "    jeq  $4, $0, big" },
      { a: 6, t: "    j    next" }, { a: 7, t: "big:  addi $2, $2, 1" }, { a: 8, t: "next: addi $1, $1, 1" },
      { a: 9, t: "    j    loop" }, { a: 10, t: "done: sw   $2, count($0)" }, { a: 11, t: "halt" },
      { t: "myarray: .fill 10, 3, 0", dim: true }, { t: "count: .fill 0", dim: true },
    ];
    const S = (o) => Object.assign({ chip: 0 }, o);
    const steps = [
      S({ ex: null, pc: 0, pcv: 0, regs: [0, 0, 0, 0, 0, 0, 0, 0], mem: {"15": 0}, foot: "count the elements >= 10", narrate: "Everything at once: a sentinel loop (Section 3), array reads (Section 4), and an <code>if</code> inside the loop (Section 2). The goal: count how many elements are at least 10. <code>$1</code> is the index, <code>$2</code> the count, <code>$3</code> the current element, <code>$4</code> a comparison result." }),
      S({ ex: 0, pc: 1, pcv: 1, regs: [0, 0, 0, 0, 0, 0, 0, 0], mem: {"15": 0}, foot: "$1 := index", narrate: "<code>$1 = 0</code>: the index." }),
      S({ ex: 1, pc: 2, pcv: 2, regs: [0, 0, 0, 0, 0, 0, 0, 0], mem: {"15": 0}, foot: "$2 := count", narrate: "<code>$2 = 0</code>: the count so far." }),
      S({ ex: 2, pc: 3, pcv: 3, regs: [0, 0, 0, 10, 0, 0, 0, 0], changed: "r3", mem: {"15": 0}, foot: "lw: the first element", narrate: "<code>$3 = myarray[0] = 10</code>." }),
      S({ ex: 3, pc: 4, pcv: 4, regs: [0, 0, 0, 10, 0, 0, 0, 0], mem: {"15": 0}, foot: "not the sentinel", narrate: "10 isn't 0, so the loop continues." }),
      S({ ex: 4, pc: 5, pcv: 5, regs: [0, 0, 0, 10, 0, 0, 0, 0], mem: {"15": 0}, foot: "slti: is it less than 10?", narrate: "<code>slti $4, $3, 10</code>: is 10 &lt; 10? No, it's equal, so <code>$4 = 0</code>." }),
      S({ ex: 5, pc: 7, pcv: 7, regs: [0, 0, 0, 10, 0, 0, 0, 0], mem: {"15": 0}, foot: "jeq fires: big", narrate: "<code>$4 == $0</code>, so <code>jeq</code> jumps to <code>big</code>: this element counts, because \"at least 10\" includes 10." }),
      S({ ex: 7, pc: 8, pcv: 8, regs: [0, 0, 1, 10, 0, 0, 0, 0], changed: "r2", mem: {"15": 0}, foot: "count++", narrate: "<code>$2 = 1</code>." }),
      S({ ex: 8, pc: 9, pcv: 9, regs: [0, 1, 1, 10, 0, 0, 0, 0], changed: "r1", mem: {"15": 0}, foot: "advance index", narrate: "<code>$1 = 1</code>." }),
      S({ ex: 9, pc: 2, pcv: 2, regs: [0, 1, 1, 10, 0, 0, 0, 0], mem: {"15": 0}, foot: "j loop", narrate: "Back to the top." }),
      S({ ex: 2, pc: 3, pcv: 3, regs: [0, 1, 1, 3, 0, 0, 0, 0], changed: "r3", mem: {"15": 0}, foot: "lw: the next element", narrate: "<code>$3 = myarray[1] = 3</code>." }),
      S({ ex: 3, pc: 4, pcv: 4, regs: [0, 1, 1, 3, 0, 0, 0, 0], mem: {"15": 0}, foot: "not the sentinel", narrate: "3 isn't 0, so the loop continues." }),
      S({ ex: 4, pc: 5, pcv: 5, regs: [0, 1, 1, 3, 1, 0, 0, 0], changed: "r4", mem: {"15": 0}, foot: "slti: 3 < 10", narrate: "<code>slti</code>: is 3 &lt; 10? Yes, so <code>$4 = 1</code>." }),
      S({ ex: 5, pc: 6, pcv: 6, regs: [0, 1, 1, 3, 1, 0, 0, 0], mem: {"15": 0}, foot: "jeq doesn't fire", narrate: "<code>$4</code> is 1, not 0, so <code>jeq</code> falls through." }),
      S({ ex: 6, pc: 8, pcv: 8, regs: [0, 1, 1, 3, 1, 0, 0, 0], mem: {"15": 0}, foot: "j next: skip the count", narrate: "<code>j next</code> jumps over the count: 3 doesn't qualify." }),
      S({ ex: 8, pc: 9, pcv: 9, regs: [0, 2, 1, 3, 1, 0, 0, 0], changed: "r1", mem: {"15": 0}, foot: "advance index", narrate: "<code>$1 = 2</code>." }),
      S({ ex: 9, pc: 2, pcv: 2, regs: [0, 2, 1, 3, 1, 0, 0, 0], mem: {"15": 0}, foot: "j loop", narrate: "Back to the top." }),
      S({ ex: 2, pc: 3, pcv: 3, regs: [0, 2, 1, 0, 1, 0, 0, 0], changed: "r3", mem: {"15": 0}, foot: "the sentinel", narrate: "<code>$3 = myarray[2] = 0</code>: the sentinel." }),
      S({ ex: 3, pc: 10, pcv: 10, regs: [0, 2, 1, 0, 1, 0, 0, 0], mem: {"15": 0}, foot: "jeq fires: done", narrate: "<code>$3 == $0</code>, so <code>jeq</code> jumps to <code>done</code>." }),
      S({ ex: 10, pc: 11, pcv: 11, regs: [0, 2, 1, 0, 1, 0, 0, 0], changed: "m15", mem: {"15": 1}, foot: "store the answer", narrate: "<code>count = $2 = 1</code> (cell 15)." }),
      S({ ex: 11, pc: 11, pcv: 11, regs: [0, 2, 1, 0, 1, 0, 0, 0], mem: {"15": 1}, foot: "halt", narrate: "<code>halt</code>. Final: <code>$2 = 1</code>: only the 10 is at least 10." }),
    ];
    scene(traceScene({ num: "8", title: "Tracing a Complete Program", subtitle: "Conditionals, loops, and arrays, composed: counting the elements that are at least 10.", rowH: 19, size: 14, lines, mem: [15], steps }));
  })();
  // ---------------- engine ----------------
  const $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const foot = txt(svg, 575, 392, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

  scenes.forEach((sc) => {
    sc.g = E("g", {}, svg);
    sc.g.style.display = "none";
    sc.r = sc.build(sc.g) || {};
    foot.parentNode.appendChild(foot);
  });
  $("sec-total").textContent = scenes.length - scenes.filter((x) => x.front).length;

  // si: section, ti: step, ph: 0 = question showing (diagram as before), 1 = answered
  const off = scenes.filter((x) => x.front).length;   // title slides don't count as sections
  let si = 0, ti = 0, ph = 1, shownScene = -1;
  const asks = (i, k) => !!scenes[i].steps[k].q;
  const startPh = (i, k) => (asks(i, k) && k > 0 ? 0 : 1);

  function readHash() {
    const m = location.hash.match(/^#(\d+)\.(\d+)(q?)$/);
    if (!m) { ph = startPh(si, ti); return; }
    const a = Number(m[1]) - 1 + off, b = Number(m[2]) - 1;
    if (a >= 0 && a < scenes.length) { si = a; ti = Math.max(0, Math.min(scenes[a].steps.length - 1, b)); }
    ph = m[3] && asks(si, ti) && ti > 0 ? 0 : 1;
  }

  function buildChips(sc) {
    const box = $("chips");
    box.innerHTML = "";
    sc.chips.forEach((label) => {
      const d = document.createElement("div");
      d.className = "stp";
      d.textContent = label;
      box.appendChild(d);
    });
  }

  function render() {
    const sc = scenes[si], s = sc.steps[ti];
    if (shownScene !== si) {
      scenes.forEach((x, k) => { x.g.style.display = k === si ? "inline" : "none"; });
      $("num").textContent = sc.num;
      $("title").textContent = sc.title;
      $("subtitle").textContent = sc.subtitle;
      document.querySelector(".stage").style.visibility = sc.front ? "hidden" : "";
      $("subtitle").style.visibility = sc.front ? "hidden" : "";
      $("sec-wrap").style.display = sc.front ? "none" : "";
      $("foot-left").textContent = sc.title;
      buildChips(sc);
      shownScene = si;
    }
    const asking = ph === 0 && !!s.q && ti > 0;
    // while a question is showing, the diagram stays exactly as the previous step left it
    sc.render(asking ? sc.steps[ti - 1] : s, sc.r, ti);
    foot.textContent = asking ? "" : (s.foot || "");
    const qm = '<span class="qm">Q</span>';
    $("narration").innerHTML = asking ? '<div class="q big">' + qm + s.q + '</div>'
      : (s.q ? '<div class="q small">' + qm + s.q + '</div>' : "") + s.narrate;
    $("sec-n").textContent = si - off + 1;
    $("step-n").textContent = ti + 1;
    $("step-total").textContent = sc.steps.length;
    document.querySelectorAll(".stp").forEach((chip, k) => {
      const n = k + 1;
      chip.classList.remove("active", "done");
      if (!s.chip) return;
      if (s.chip === n) chip.classList.add("active");
      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  readHash();
  render();
})();
</script>

</body>
