<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" font-family="Helvetica, Arial, sans-serif">
<rect width="1150" height="400" rx="24" fill="#eee6f3"/>
<text x="575.0" y="30" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">a page fault, step by step: slow, but routine</text>
<rect x="20" y="70" width="190" height="96" rx="12" fill="#fff" stroke="#57068c" stroke-width="4"/>
<circle cx="24" cy="74" r="14" fill="#57068c"/>
<text x="24" y="79" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text>
<text x="115.0" y="116" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">CPU asks for</text>
<text x="115.0" y="140" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">virtual page 2</text>
<rect x="250" y="70" width="190" height="96" rx="12" fill="#fff" stroke="#57068c" stroke-width="4"/>
<circle cx="254" cy="74" r="14" fill="#57068c"/>
<text x="254" y="79" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="345.0" y="116" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">TLB: miss</text>
<text x="345.0" y="140" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle"></text>
<rect x="480" y="70" width="190" height="96" rx="12" fill="#fff" stroke="#57068c" stroke-width="4"/>
<circle cx="484" cy="74" r="14" fill="#57068c"/>
<text x="484" y="79" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text>
<text x="575.0" y="116" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">page table:</text>
<text x="575.0" y="140" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">V = 0</text>
<rect x="710" y="70" width="190" height="96" rx="12" fill="#e9d9f5" stroke="#57068c" stroke-width="4"/>
<circle cx="714" cy="74" r="14" fill="#57068c"/>
<text x="714" y="79" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text>
<text x="805.0" y="116" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">OS takes over:</text>
<text x="805.0" y="140" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">a page fault</text>
<rect x="940" y="70" width="190" height="96" rx="12" fill="#fff" stroke="#57068c" stroke-width="4"/>
<circle cx="944" cy="74" r="14" fill="#57068c"/>
<text x="944" y="79" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">5</text>
<text x="1035.0" y="116" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">RAM is full:</text>
<text x="1035.0" y="140" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">pick a victim (LRU)</text>
<rect x="940" y="230" width="190" height="96" rx="12" fill="#fbeceb" stroke="#c1272d" stroke-width="4"/>
<circle cx="944" cy="234" r="14" fill="#c1272d"/>
<text x="944" y="239" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">6</text>
<text x="1035.0" y="276" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">victim dirty?</text>
<text x="1035.0" y="300" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">write it to disk first</text>
<rect x="710" y="230" width="190" height="96" rx="12" fill="#fbeceb" stroke="#c1272d" stroke-width="4"/>
<circle cx="714" cy="234" r="14" fill="#c1272d"/>
<text x="714" y="239" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">7</text>
<text x="805.0" y="276" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">read page 2</text>
<text x="805.0" y="300" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">from disk to the frame</text>
<rect x="480" y="230" width="190" height="96" rx="12" fill="#fff" stroke="#57068c" stroke-width="4"/>
<circle cx="484" cy="234" r="14" fill="#57068c"/>
<text x="484" y="239" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">8</text>
<text x="575.0" y="276" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">update the page</text>
<text x="575.0" y="300" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">table and the TLB</text>
<rect x="250" y="230" width="190" height="96" rx="12" fill="#fff" stroke="#57068c" stroke-width="4"/>
<circle cx="254" cy="234" r="14" fill="#57068c"/>
<text x="254" y="239" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">9</text>
<text x="345.0" y="276" fill="#1a1a1a" font-size="17" font-weight="700" text-anchor="middle">retry the access:</text>
<text x="345.0" y="300" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">it hits</text>
<line x1="214" y1="118.0" x2="244" y2="118.0" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="244.0,118.0 231.0,111.0 231.0,125.0" fill="#6d6d6d"/>
<line x1="444" y1="118.0" x2="474" y2="118.0" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="474.0,118.0 461.0,111.0 461.0,125.0" fill="#6d6d6d"/>
<line x1="674" y1="118.0" x2="704" y2="118.0" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="704.0,118.0 691.0,111.0 691.0,125.0" fill="#6d6d6d"/>
<line x1="904" y1="118.0" x2="934" y2="118.0" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="934.0,118.0 921.0,111.0 921.0,125.0" fill="#6d6d6d"/>
<line x1="1035.0" y1="170" x2="1035.0" y2="224" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="1035.0,224.0 1042.0,211.0 1028.0,211.0" fill="#6d6d6d"/>
<line x1="934" y1="278.0" x2="904" y2="278.0" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="904.0,278.0 917.0,285.0 917.0,271.0" fill="#6d6d6d"/>
<line x1="704" y1="278.0" x2="674" y2="278.0" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="674.0,278.0 687.0,285.0 687.0,271.0" fill="#6d6d6d"/>
<line x1="474" y1="278.0" x2="444" y2="278.0" stroke="#6d6d6d" stroke-width="4" stroke-linecap="round"/>
<polygon points="444.0,278.0 457.0,285.0 457.0,271.0" fill="#6d6d6d"/>
<text x="575" y="372" fill="#c1272d" font-size="17" font-weight="700" text-anchor="middle">red boxes touch the disk: milliseconds, not nanoseconds</text>
</svg>
