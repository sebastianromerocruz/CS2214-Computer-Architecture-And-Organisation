<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 350" font-family="Helvetica, Arial, sans-serif">
<rect width="1150" height="350" rx="24" fill="#eee6f3"/>
<text x="575.0" y="30" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">the TLB: a hit skips the page table, a miss walks it once and remembers</text>
<text x="40" y="56" fill="#57068c" font-size="16" font-weight="700" text-anchor="start">TLB hit: one trip</text>
<rect x="40" y="70" width="170" height="70" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="125.0" y="112.0" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">CPU</text>
<rect x="300" y="70" width="170" height="70" rx="10" fill="#e9d9f5" stroke="#57068c" stroke-width="5"/>
<text x="385.0" y="101.0" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">TLB</text>
<text x="385.0" y="125.0" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">has page 2</text>
<rect x="820" y="70" width="240" height="70" rx="10" fill="#e9d9f5" stroke="#57068c" stroke-width="5"/>
<text x="940.0" y="101.0" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">the data</text>
<text x="940.0" y="125.0" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">in RAM</text>
<line x1="214" y1="105" x2="296" y2="105" stroke="#c1272d" stroke-width="4" stroke-linecap="round"/>
<polygon points="296.0,105.0 283.0,98.0 283.0,112.0" fill="#c1272d"/>
<line x1="474" y1="105" x2="816" y2="105" stroke="#c1272d" stroke-width="4" stroke-linecap="round"/>
<polygon points="816.0,105.0 803.0,98.0 803.0,112.0" fill="#c1272d"/>
<text x="645" y="128" fill="#9f9f97" font-size="14" font-weight="600" text-anchor="middle" font-style="italic">the page table is skipped</text>
<text x="880" y="166" fill="#2e7d32" font-size="17" font-weight="700" text-anchor="middle">one trip to RAM</text>
<text x="645" y="92" fill="#2e7d32" font-size="15" font-weight="700" text-anchor="middle">hit: the frame is known</text>
<text x="40" y="206" fill="#57068c" font-size="16" font-weight="700" text-anchor="start">TLB miss: two trips</text>
<rect x="40" y="220" width="170" height="70" rx="10" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="125.0" y="262.0" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">CPU</text>
<rect x="300" y="220" width="170" height="70" rx="10" fill="#e9d9f5" stroke="#57068c" stroke-width="5"/>
<text x="385.0" y="251.0" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">TLB</text>
<text x="385.0" y="275.0" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">no page 2</text>
<rect x="560" y="220" width="170" height="70" rx="10" fill="#e9d9f5" stroke="#57068c" stroke-width="5"/>
<text x="645.0" y="251.0" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">page table</text>
<text x="645.0" y="275.0" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">in RAM</text>
<rect x="820" y="220" width="240" height="70" rx="10" fill="#e9d9f5" stroke="#57068c" stroke-width="5"/>
<text x="940.0" y="251.0" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">the data</text>
<text x="940.0" y="275.0" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">in RAM</text>
<line x1="214" y1="255" x2="296" y2="255" stroke="#c1272d" stroke-width="4" stroke-linecap="round"/>
<polygon points="296.0,255.0 283.0,248.0 283.0,262.0" fill="#c1272d"/>
<line x1="474" y1="255" x2="556" y2="255" stroke="#c1272d" stroke-width="4" stroke-linecap="round"/>
<polygon points="556.0,255.0 543.0,248.0 543.0,262.0" fill="#c1272d"/>
<line x1="734" y1="255" x2="816" y2="255" stroke="#c1272d" stroke-width="4" stroke-linecap="round"/>
<polygon points="816.0,255.0 803.0,248.0 803.0,262.0" fill="#c1272d"/>
<text x="515" y="238" fill="#c1272d" font-size="15" font-weight="700" text-anchor="middle">miss</text>
<text x="775" y="238" fill="#c1272d" font-size="14" font-weight="700" text-anchor="middle">frame 5</text>
<line x1="645" y1="294" x2="645" y2="322" stroke="#6d6d6d" stroke-width="3" stroke-linecap="round"/>
<line x1="645" y1="322" x2="385" y2="322" stroke="#6d6d6d" stroke-width="3" stroke-linecap="round"/>
<line x1="385" y1="322" x2="385" y2="294" stroke="#6d6d6d" stroke-width="3" stroke-linecap="round"/>
<polygon points="385.0,294.0 378.0,307.0 392.0,307.0" fill="#6d6d6d"/>
<text x="515" y="342" fill="#6d6d6d" font-size="15" font-weight="700" text-anchor="middle">save the entry in the TLB for next time</text>
<text x="940" y="314" fill="#c1272d" font-size="17" font-weight="700" text-anchor="middle">two trips, once</text>
</svg>
