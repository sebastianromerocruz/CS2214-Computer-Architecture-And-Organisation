<text x="640" y="338" fill="#c1272d" font-size="17" font-weight="700" text-anchor="middle">both address spaces reach physical page 0</text>
<text x="640" y="360" fill="#6d6d6d" font-size="15" font-weight="700" text-anchor="middle">the OS exposes its code to programs for system calls: what stops a program writing here?</text>
<text x="640" y="382" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle">the protect bit: a program may not write a page marked P = 1</text>
