<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 310" font-family="Helvetica, Arial, sans-serif">
<rect width="1150" height="310" rx="24" fill="#eee6f3"/>
<text x="575.0" y="30" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">a virtual address is cut like a cache address: the low bits say where you are inside the page</text>
<rect x="75" y="60" width="625" height="80" rx="10" fill="#e2cdf2" stroke="#57068c" stroke-width="4"/>
<rect x="700" y="60" width="375" height="80" rx="10" fill="#d9e8fb" stroke="#57068c" stroke-width="4"/>
<text x="387" y="98" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle">virtual page number</text>
<text x="387" y="124" fill="#6d6d6d" font-size="16" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">20 bits</text>
<text x="887" y="98" fill="#1a1a1a" font-size="22" font-weight="700" text-anchor="middle">offset</text>
<text x="887" y="124" fill="#6d6d6d" font-size="16" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">12 bits</text>
<text x="387" y="200" fill="#c1272d" font-size="34" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">page 2</text>
<text x="387" y="232" fill="#6d6d6d" font-size="18" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">8200 // 4096 = 2</text>
<text x="887" y="200" fill="#c1272d" font-size="34" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">offset 8</text>
<text x="887" y="232" fill="#6d6d6d" font-size="18" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">8200 % 4096 = 8</text>
<line x1="387" y1="148" x2="387" y2="160" stroke="#c1272d" stroke-width="3" stroke-linecap="round"/>
<line x1="887" y1="148" x2="887" y2="160" stroke="#c1272d" stroke-width="3" stroke-linecap="round"/>
<text x="575" y="284" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">example: virtual address 8200, with 4096-byte pages (2^12)</text>
</svg>
