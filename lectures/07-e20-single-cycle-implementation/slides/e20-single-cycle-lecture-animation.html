<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | The E20 Single-Cycle Datapath | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* One deck for the whole E20 Single-Cycle Datapath lecture, built on the 06 deck (same step engine).
     Same principle as the 03-verilog animations: a hand-rolled step machine
     driven by the arrow keys, one small change per step, plain language
     before jargon. Each section is a "scene" with its own diagram; the arrow
     keys run straight through all of them. Shift + arrow jumps a section.
     Question-and-answer form: at key beats the slide first asks a question
     (the diagram stays as the previous step left it) and the next key press
     reveals the diagram and the answer. Open with #3.5 to start at section 3,
     step 5 (answered), or #3.5q for the same step with the question showing. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 16px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 14px;
    font-size: 19px;
    line-height: 1.35;
    min-height: 52px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">11</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">
    <span class="num" id="num"></span>
    <h1 id="title">The E20 Single-Cycle Datapath</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="340"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">The E20 Single-Cycle Datapath</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenes.push(def); }
  // ================= datapath (shared by the wire-by-wire scenes) =================
  function makeDatapath(g0) {
    const g = E("g", { transform: "translate(0,10)" }, g0);
    const items = {};
    function mk(id, from, to) { const gg = grp(g, 0); items[id] = { from, to: to === undefined ? 999 : to, g: gg, hlf: null }; return items[id]; }
    function plabels(gg, x, w, left, right, o) {
      o = o || {};
      left.forEach(([y, s]) => txt(gg, x + 7, y + 4, s, { size: 12, mono: true, weight: 700, fill: C.accent }));
      right.forEach(([y, s]) => txt(gg, x + w - 7, y + 4, s, { size: 12, mono: true, weight: 700, fill: C.accent, anchor: "end" }));
    }
    function box(id, from, x, y, w, h, label, o) {
      o = o || {};
      const it = mk(id, from);
      const r = rect(it.g, x, y, w, h, { rx: h < 40 ? 8 : 10, fill: C.white, stroke: C.purple, sw: h < 40 ? 3 : 4 });
      if (h < 40) txt(it.g, x + w / 2, y + h / 2 + 5, label, { size: 13, weight: 700, fill: C.purple, anchor: "middle" });
      else txt(it.g, x + w / 2, o.titleY || y + 26, label, { size: 17, weight: 700, fill: C.purple, anchor: "middle" });
      plabels(it.g, x, w, o.left || [], o.right || []);
      it.hlf = (on) => { r.setAttribute("fill", on ? C.t2 : C.white); r.setAttribute("stroke", on ? C.red : C.purple); };
      return it;
    }
    function muxp(id, from, pts, cx, cy, label, o) {
      o = o || {};
      const it = mk(id, from);
      const p = poly(it.g, pts, { fill: C.t5, stroke: C.purple, sw: 3 });
      if (o.nameX !== undefined) txt(it.g, o.nameX, cy + 4, label, { size: 10, weight: 700, mono: true, fill: C.purple, anchor: "start" });
      else if (label) txt(it.g, cx, cy + 4, label, { size: 11, weight: 700, mono: true, fill: C.purple, anchor: "middle" });
      (o.ins || []).forEach(([x, y, s, a]) => txt(it.g, x, y + 3, s, { size: o.insSize || 9, mono: true, weight: 700, fill: C.accent, anchor: a || "start" }));
      it.hlf = (on) => { p.setAttribute("fill", on ? C.t2 : C.t5); p.setAttribute("stroke", on ? C.red : C.purple); };
      return it;
    }
    function wire(id, from, pts, o) {
      o = o || {};
      const it = mk(id, from, o.to);
      const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
      const pa = path(it.g, d, { stroke: C.ink, sw: o.sw || 3 });
      if (o.dash) pa.setAttribute("stroke-dasharray", o.dash);
      let ah = null;
      if (o.arrow !== false) {
        const a = pts[pts.length - 2], b = pts[pts.length - 1];
        const dir = Math.abs(b[0] - a[0]) > Math.abs(b[1] - a[1]) ? (b[0] > a[0] ? "r" : "l") : (b[1] > a[1] ? "d" : "u");
        ah = arrowhead(it.g, b[0], b[1], dir, C.ink);
      }
      if (o.label) txt(it.g, o.label[0], o.label[1], o.label[2], { size: 12, italic: true, fill: C.grey, anchor: o.label[3] || "middle" });
      it.hlf = (on) => { pa.setAttribute("stroke", on ? C.red : C.ink); pa.setAttribute("stroke-width", on ? 5 : (o.sw || 3)); if (ah) ah.setAttribute("fill", on ? C.red : C.ink); };
      return it;
    }
    function dot(id, from, x, y, to) { const it = mk(id, from, to); const c = circ(it.g, x, y, 4.5, { fill: C.ink }); it.hlf = (on) => c.setAttribute("fill", on ? C.red : C.ink); return it; }
    function lab(id, from, x, y, s, o) { const it = mk(id, from); txt(it.g, x, y, s, Object.assign({ size: 12, italic: true, fill: C.grey, anchor: "middle" }, o || {})); return it; }

    // --- the four base components (stage 0), each with its port names
    box("mem", 0, 230, 110, 150, 170, "MEMORY", {
      left: [[162, "instrAddr"], [250, "dataAddr"], [276, "dataIn"]], right: [[162, "instrOut"], [214, "dataOut"]] });
    box("pc", 0, 55, 140, 100, 44, "PC");
    box("rf", 0, 800, 185, 140, 165, "REG FILE", { titleY: 312,
      left: [[205, "SRC1"], [245, "SRC2"], [286, "TGT"], [328, "TGTdataIn"]], right: [[230, "SRC2dataOut"], [260, "SRC1dataOut"]] });
    const alu = mk("alu", 0);
    const ap = poly(alu.g, "1010,205 1100,225 1100,275 1010,295", { fill: C.white, stroke: C.purple, sw: 4 });
    txt(alu.g, 1050, 262, "ALU", { size: 18, weight: 700, fill: C.purple, anchor: "middle" });
    txt(alu.g, 1017, 234, "in1", { size: 12, mono: true, weight: 700, fill: C.accent });
    txt(alu.g, 1017, 274, "in2", { size: 12, mono: true, weight: 700, fill: C.accent });
    txt(alu.g, 1094, 243, "result", { size: 12, mono: true, weight: 700, fill: C.accent, anchor: "end" });
    txt(alu.g, 1046, 200, "FUNCalu", { size: 12, mono: true, weight: 700, fill: C.accent, anchor: "end" });
    alu.hlf = (on) => { ap.setAttribute("fill", on ? C.t2 : C.white); ap.setAttribute("stroke", on ? C.red : C.purple); };
    const ports = {};

    // --- stage 1: fetch
    wire("pcmem", 1, [[155, 162], [230, 162]], { label: [192, 152, "pc"] });
    // --- stage 2: the +1 adder
    box("inc", 2, 155, 70, 70, 34, "+1");
    dot("jct", 2, 190, 162);
    wire("jctw", 2, [[190, 162], [190, 104]]);
    wire("tmp", 2, [[190, 70], [190, 50], [105, 50], [105, 140]], { to: 8 });
    // --- stage 3: decode
    wire("iw", 3, [[380, 162], [430, 162]]);
    const rib = mk("ribbon", 3);
    const cells = [[430, 52.5, "opcode"], [482.5, 52.5, "rA"], [535, 52.5, "rB"], [587.5, 52.5, "rC"], [640, 70, "func"]];
    cells.forEach(([x, w, l], i) => {
      rect(rib.g, x, 140, w, 36, { fill: i === 0 ? C.t5 : C.t6, stroke: C.purple, sw: 3 });
      txt(rib.g, x + w / 2, 163, l, { size: i === 0 ? 12 : 14, weight: 700, mono: true, fill: C.purple, anchor: "middle" });
    });
    rect(rib.g, 482.5, 122, 227.5, 12, { rx: 4, fill: C.t4, stroke: C.accent, sw: 2 });
    txt(rib.g, 596, 132, "imm13", { size: 11, weight: 700, mono: true, fill: C.accent, anchor: "middle" });
    rect(rib.g, 587.5, 108, 122.5, 12, { rx: 4, fill: C.t4, stroke: C.accent, sw: 2 });
    txt(rib.g, 648, 118, "imm7", { size: 11, weight: 700, mono: true, fill: C.accent, anchor: "middle" });
    rib.hlf = null;
    // --- stage 4: register reads
    wire("rB", 4, [[561, 176], [561, 205], [800, 205]], { label: [690, 198, "rB"] });
    wire("rAd", 4, [[508, 176], [508, 237], [785, 237], [785, 245], [800, 245]], { to: 5.5, label: [655, 230, "rA"] });
    wire("o1", 4, [[940, 230], [1010, 230]]);
    wire("o2d", 4, [[940, 260], [975, 260], [975, 270], [1010, 270]], { to: 6 });
    // --- stage 5: MUXdst
    dot("dstdot", 5, 561, 205);
    wire("dstB", 5, [[561, 205], [561, 275], [700, 275]]);
    wire("dstC", 5, [[614, 176], [614, 286], [700, 286]]);
    wire("dst7", 5, [[656, 297], [700, 297]]);
    lab("seven", 5, 646, 301, "7", { size: 14, weight: 700, mono: true, italic: false, fill: C.purple, anchor: "end" });
    muxp("muxdst", 5, "700,268 770,276 770,296 700,304", 735, 286, "MUXdst", { nameX: 731, ins: [[704, 275, "rB"], [704, 286, "rC"], [704, 297, "7"]] });
    wire("dstOut", 5, [[770, 286], [800, 286]]);
    // --- stage 5.5: MUXrf
    dot("rCdot", 5.5, 614, 253);
    wire("rAm", 5.5, [[508, 176], [508, 237], [700, 237]]);
    wire("rCm", 5.5, [[614, 253], [700, 253]]);
    muxp("muxrf", 5.5, "700,225 770,235 770,255 700,265", 735, 245, "MUXrf", { nameX: 731, ins: [[704, 237, "rA"], [704, 253, "rC"]] });
    wire("rfOut", 5.5, [[770, 245], [800, 245]]);
    // --- stage 6: MUXalu and sign-extend
    wire("imm7t", 5.9, [[655, 108], [655, 88]]);
    box("sext", 5.9, 610, 64, 90, 24, "sign-ext");
    wire("sextd", 5.9, [[700, 76], [954, 76], [954, 284], [1000, 284], [1000, 270], [1010, 270]], { to: 6 });
    wire("sextAlu", 6, [[700, 76], [954, 76], [954, 280], [962, 280]]);
    dot("o2dot", 7.1, 948, 260);
    wire("o2m", 6, [[940, 260], [962, 260]]);
    muxp("muxalu", 6, "962,250 992,257 992,283 962,290", 977, 270, "", { ins: [] });
    lab("muxalulab", 6, 977, 244, "MUXalu", { size: 11, weight: 700, mono: true, italic: false, fill: C.purple });
    wire("aluIn2", 6, [[992, 270], [1010, 270]]);
    // --- stage 7: memory access
    wire("resb", 7, [[1100, 250], [1125, 250], [1125, 354], [690, 354]], { arrow: false });
    dot("resdot", 7.2, 690, 354);
    wire("addrLane", 7, [[690, 354], [205, 354], [205, 250], [230, 250]]);
    wire("dataInLane", 7.1, [[948, 260], [948, 364], [195, 364], [195, 276], [230, 276]]);
    wire("tgtd", 7.2, [[690, 354], [690, 328], [800, 328]], { to: 7.3 });
    wire("dataOutRaw", 7.2, [[380, 214], [392, 214], [392, 340], [690, 340], [690, 328]], { to: 7.3, arrow: false });
    wire("dataOut", 7.3, [[380, 214], [392, 214], [392, 340], [700, 340]]);
    wire("tgtALU", 7.3, [[690, 354], [690, 316], [700, 316]]);
    muxp("muxtgt", 7.3, "700,308 770,316 770,340 700,348", 735, 328, "MUXtgt", { nameX: 731, ins: [[704, 316, "ALU"], [704, 328, "pc+1"], [704, 340, "mem"]] });
    wire("tgtOut", 7.3, [[770, 328], [800, 328]]);
    // --- stage 8: the program counter's suitors
    muxp("muxpc", 8, "20,36 190,36 135,72 75,72", 105, 66, "MUXpc", { insSize: 9, ins: [[54, 47, "ALU", "middle"], [92, 47, "adder", "middle"], [132, 47, "imm13", "middle"], [166, 47, "pc+1", "middle"]] });
    wire("pcOut", 8, [[105, 72], [105, 140]]);
    wire("j1", 8, [[225, 87], [245, 87]], { arrow: false });
    dot("j1dot", 8, 245, 87);
    wire("pcLane", 8, [[245, 87], [245, 28], [170, 28], [170, 36]]);
    wire("zext", 8.1, [[520, 122], [520, 104]]);
    box("zextb", 8.1, 470, 80, 100, 24, "zero-ext");
    wire("immLane", 8.1, [[520, 80], [520, 20], [130, 20], [130, 36]]);
    wire("jrLane", 8.2, [[1125, 250], [1125, 4], [50, 4], [50, 36]], { label: [600, 0, "ALU result (jr)"] });
    wire("j1ext", 8.3, [[245, 87], [405, 87]], { arrow: false });
    wire("jal", 8.3, [[405, 87], [405, 328], [700, 328]], { label: [520, 321, "pc+1 (jal)"] });
    dot("j1dot2", 8.3, 405, 87);
    box("adder", 8.4, 300, 40, 100, 28, "ADD");
    dot("addPdot", 8.4, 325, 87);
    wire("addP", 8.4, [[325, 87], [325, 68]]);
    wire("addI", 8.4, [[610, 77], [375, 77], [375, 68]]);
    wire("addLane", 8.4, [[400, 54], [415, 54], [415, 12], [90, 12], [90, 36]]);
    // --- stage 9: control
    const ctlw = mk("ctlw", 9);
    [[105, 56], [735, 286], [977, 270], [735, 328], [735, 245], [1020, 255], [870, 185], [305, 110]].forEach(([x, y]) =>
      ln(ctlw.g, 1050, 50, x, y, { stroke: "#c9b3e0", sw: 2, dash: "4 5" }));
    ln(ctlw.g, 456, 140, 1024, 52, { stroke: "#c9b3e0", sw: 2, dash: "4 5" });
    const cc = mk("ctl", 8.5);
    const cco = circ(cc.g, 1050, 50, 28, { fill: C.purple });
    txt(cc.g, 1050, 55, "CONTROL", { size: 11, weight: 700, fill: C.white, anchor: "middle" });
    cc.hlf = (on) => cco.setAttribute("fill", on ? C.red : C.purple);
    wire("eq", 8.5, [[1075, 219], [1075, 74], [1068, 68]], { label: [1090, 150, "EQ", "start"] });
    // control readout
    const ro = grp(g, 0), rov = {};
    const ROWS = [["FUNCalu", 730, 24], ["MUXalu", 730, 38], ["MUXpc", 730, 52], ["MUXrf", 730, 66], ["MUXtgt", 880, 24], ["MUXdst", 880, 38], ["WErf", 880, 52], ["WEdmem", 880, 66]];

      chips: ["The work", "One period", "The waste", "Why lw?"],
      steps: [
        { n: 0, chip: 1, foot: "each instruction's real work", narrate: "Here's the catch. Each instruction has a different amount of real work to do before its result is ready (bars illustrative, not to scale). <code>j</code> barely has to decode; <code>lw</code> has to cross main memory in the middle of the cycle." },
        { n: 1, chip: 2, foot: "the clock is fixed", narrate: "But a single-cycle processor has exactly <strong>one</strong> clock period, the same for every instruction. So how long must it be? Long enough for the <em>slowest</em> instruction to finish: here, <code>lw</code>." },
        { n: 2, chip: 3, foot: "idle time", narrate: "Everything else finishes early and then sits there twiddling its thumbs until the clock ticks. A <code>j</code> or a <code>nop</code> wastes most of its cycle: like making a sprinter walk at a toddler's pace because the marathoner is in the same race. That's the price of one-instruction-per-cycle simplicity, and it's the seed of the multicycle lecture." },
        { n: 3, chip: 4, foot: "trace both paths", q: "jeq sounds like a long trip too: read registers, subtract, wait for EQ to flow backwards, flip MUXpc. So why is the clock period set by lw and not by jeq?",
          narrate: "<code>jeq</code>'s path ends at <code>MUXpc</code>. It never touches data memory, and the branch adder runs in parallel with the ALU's comparison, so it adds no time. <code>lw</code> does everything <code>jeq</code> does up through the ALU, <em>and then</em> goes out to memory and back. Memory is slow, so <code>lw</code> wins." },
        { n: 4, chip: 4, foot: "what comes next", narrate: "What if, instead of stretching the cycle to fit the slowest instruction, we split the work into <em>stages</em> and let different instructions occupy different stages at once? Same components, same wires, mostly, just no longer required to all finish in one tick. That's multicycle, and then pipelining." },
      ],
      build(g) {
        const r = { bars: [], idle: [] };
        BARS.forEach(([name, w, desc], i) => {
          const y = Y0 + i * RH;
          txt(g, X0 - 16, y + 30, name, { size: 22, weight: 700, mono: true, fill: C.purple, anchor: "end" });
          const b = grp(g, 0); r.bars.push(b);
          rect(b, X0, y + 6, w, 36, { rx: 8, fill: name === "lw" ? C.t2 : C.t5, stroke: name === "lw" ? C.red : C.purple, sw: 4 });
          txt(b, X0 + 14, y + 30, desc, { size: 13, weight: 600, fill: C.ink });
          const id = grp(g, 0); r.idle.push(id);
          if (w < MAXW) {
            rect(id, X0 + w + 4, y + 6, MAXW - w - 4, 36, { rx: 8, fill: "none", stroke: C.lgrey, sw: 2, dash: "6 5" });
            txt(id, X0 + w + (MAXW - w) / 2, y + 30, "idle", { size: 13, italic: true, fill: C.lgrey, anchor: "middle" });
          }
        });
        r.clock = grp(g, 0);
        ln(r.clock, X0 + MAXW + 6, 54, X0 + MAXW + 6, 330, { stroke: C.red, sw: 4, dash: "8 6" });
        txt(r.clock, X0 + MAXW + 12, 50, "clock", { size: 14, weight: 700, fill: C.red, anchor: "start" });
        txt(r.clock, X0 + MAXW + 12, 66, "edge", { size: 14, weight: 700, fill: C.red, anchor: "start" });
        r.note = txt(g, 575, 350, "illustrative, not to scale", { size: 13, italic: true, fill: C.grey, anchor: "middle" });
        return r;
      },
      render(s, r) {
        r.bars.forEach((b) => vis(b, true));
        r.idle.forEach((b) => vis(b, s.n >= 2));
        vis(r.clock, s.n >= 1);
      },
    });
  })();


  // ---------------- engine ----------------
  const $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const foot = txt(svg, 575, 392, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

  scenes.forEach((sc) => {
    sc.g = E("g", {}, svg);
    sc.g.style.display = "none";
    sc.r = sc.build(sc.g) || {};
    foot.parentNode.appendChild(foot);
  });
  $("sec-total").textContent = scenes.length - scenes.filter((x) => x.front).length;

  // si: section, ti: step, ph: 0 = question showing (diagram as before), 1 = answered
  const off = scenes.filter((x) => x.front).length;   // title slides don't count as sections
  let si = 0, ti = 0, ph = 1, shownScene = -1;
  const asks = (i, k) => !!scenes[i].steps[k].q;
  const startPh = (i, k) => (asks(i, k) && k > 0 ? 0 : 1);

  function readHash() {
    const m = location.hash.match(/^#(\d+)\.(\d+)(q?)$/);
    if (!m) { ph = startPh(si, ti); return; }
    const a = Number(m[1]) - 1 + off, b = Number(m[2]) - 1;
    if (a >= 0 && a < scenes.length) { si = a; ti = Math.max(0, Math.min(scenes[a].steps.length - 1, b)); }
    ph = m[3] && asks(si, ti) && ti > 0 ? 0 : 1;
  }

  function buildChips(sc) {
    const box = $("chips");
    box.innerHTML = "";
    sc.chips.forEach((label) => {
      const d = document.createElement("div");
      d.className = "stp";
      d.textContent = label;
      box.appendChild(d);
    });
  }

  function render() {
    const sc = scenes[si], s = sc.steps[ti];
    if (shownScene !== si) {
      scenes.forEach((x, k) => { x.g.style.display = k === si ? "inline" : "none"; });
      $("num").textContent = sc.num;
      $("title").textContent = sc.title;
      $("subtitle").textContent = sc.subtitle;
      document.querySelector(".stage").style.visibility = sc.front ? "hidden" : "";
      $("subtitle").style.visibility = sc.front ? "hidden" : "";
      $("sec-wrap").style.display = sc.front ? "none" : "";
      $("foot-left").textContent = sc.title;
      buildChips(sc);
      shownScene = si;
    }
    const asking = ph === 0 && !!s.q && ti > 0;
    // while a question is showing, the diagram stays exactly as the previous step left it
    sc.render(asking ? sc.steps[ti - 1] : s, sc.r, ti);
    foot.textContent = asking ? "" : (s.foot || "");
    const qm = '<span class="qm">Q</span>';
    $("narration").innerHTML = asking ? '<div class="q big">' + qm + s.q + '</div>'
      : (s.q ? '<div class="q small">' + qm + s.q + '</div>' : "") + s.narrate;
    $("sec-n").textContent = si - off + 1;
    $("step-n").textContent = ti + 1;
    $("step-total").textContent = sc.steps.length;
    document.querySelectorAll(".stp").forEach((chip, k) => {
      const n = k + 1;
      chip.classList.remove("active", "done");
      if (!s.chip) return;
      if (s.chip === n) chip.classList.add("active");
      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  readHash();
  render();
})();
</script>

</body>
</html>
