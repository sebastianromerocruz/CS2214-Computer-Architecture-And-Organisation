<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | The E15 Processor | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* One deck for the whole E15 lecture, built on bits-to-assembly-animation.html.
     Same principle as the 03-verilog animations: a hand-rolled step machine
     driven by the arrow keys, one small change per step, plain language
     before jargon. Each section is a "scene" with its own diagram; the arrow
     keys run straight through all of them. Shift + arrow jumps a section.
     Question-and-answer form: at key beats the slide first asks a question
     (the diagram stays as the previous step left it) and the next key press
     reveals the diagram and the answer. Open with #3.5 to start at section 3,
     step 5 (answered), or #3.5q for the same step with the question showing. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 16px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 14px;
    font-size: 19px;
    line-height: 1.35;
    min-height: 52px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">8</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">9</span></div>

  <div class="stage">
    <span class="num" id="num">1.1</span>
    <h1 id="title">From Bits to Assembly</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="340"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">From Bits to Assembly</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenes.push(def); }
  // ================= Title slide =================
  (function () {
    const ROUTE = ["From Bits to Assembly", "Instruction Format", "The Instruction Set", "Tracing a Full Program",
                   "Fetch and Execute", "Overflow and Wraparound", "How a Jump Goes Back", "E15 in Verilog"];
    scene({
      front: true,
      num: "", title: "The E15 Processor", subtitle: "",
      chips: [],
      steps: [
        { view: "title", foot: "",
          narrate: "Today: the <strong>E15</strong>, the smallest processor we can build. A 4-bit toy CPU, small enough to trace by hand, that still does everything a real one does." },
        { view: "route", foot: "eight sections, one small processor",
          narrate: "Last time we gave our circuits a past: a clock, registers, memory. Today we use them to build a machine that runs a program. Here's the route." },
      ],
      build(g) {
        const r = {};
        r.title = grp(g, 1);
        rect(r.title, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
        txt(r.title, 575, 104, "CS-UY 2214  |  WEEK IV", { size: 15, weight: 700, fill: C.red, anchor: "middle", ls: 2 });
        txt(r.title, 575, 190, "The E15 Processor", { size: 66, weight: 700, fill: "#171715", anchor: "middle" });
        rect(r.title, 535, 214, 80, 6, { rx: 3, fill: C.accent });
        txt(r.title, 575, 258, "A 4-bit toy CPU you can trace by hand", { size: 24, italic: true, fill: C.grey, anchor: "middle" });
        txt(r.title, 575, 312, "Computer Architecture and Organization", { size: 14, fill: C.lgrey, anchor: "middle", ls: 1 });
        txt(r.title, 575, 368, "Song of the day: Strangers by Majid Jordan (2026), recommended by Akshita P.", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

        r.route = grp(g, 0);
        txt(r.route, 575, 52, "TODAY'S ROUTE", { size: 13, weight: 700, fill: C.purple, anchor: "middle", ls: 2 });
        ROUTE.forEach((name, i) => {
          const col = i < 4 ? 0 : 1, row = i % 4;
          const x = 150 + col * 460, y = 90 + row * 62;
          rect(r.route, x, y, 420, 50, { rx: 12, fill: C.white, stroke: C.purple, sw: 4 });
          circ(r.route, x + 30, y + 25, 15, { fill: C.purple });
          txt(r.route, x + 30, y + 31, String(i + 1), { size: 16, weight: 700, fill: C.white, anchor: "middle" });
          txt(r.route, x + 60, y + 32, name, { size: 19, weight: 700, fill: C.ink });
        });
        txt(r.route, 575, 366, "1: bits and assembly   |   2 to 3: the vocabulary   |   4 to 7: how it runs   |   8: the hardware", { size: 13, italic: true, fill: C.grey, anchor: "middle" });
        return r;
      },
      render(s, r) { vis(r.title, s.view === "title"); vis(r.route, s.view === "route"); },
    });
  })();

  // ================= 1.1 From Bits to Assembly =================
  (function () {
    const bits = ["100100100000", "100100010001", "101001100000", "111100100111", "001100001110", "000000000000"];
    const hex = ["920", "911", "a60", "f27", "30e", "000"];
    const asm = ["{movi, RXX, Rg2, 4'b0000}", "{movi, RXX, Rg1, 4'b0001}", "{add,  Rg1, Rg2, 4'b0000}",
                 "{cmpi, RXX, Rg2, 4'b0111}", "{jnz,  RXX, RXX, 4'b1110}", "{jmp,  RXX, RXX, 4'b0000}"];
    const cLines = ["int rg2 = 0;", "int rg1 = 1;", "while (true) {", "    rg2 += rg1;", "    if (rg2 == 7)", "        break;", "}", "while (true) {}"];
    const groups = [
      { color: C.t1, rows: [0, 1], lines: [0, 1] },
      { color: C.t2, rows: [2, 3, 4], lines: [2, 3, 4, 5, 6] },
      { color: C.t3, rows: [5], lines: [7] },
    ];
    const ROW_Y0 = 132, ROW_DY = 40, C_Y0 = 118, C_DY = 34;
    const group4 = (b) => b.slice(0, 4) + " " + b.slice(4, 8) + " " + b.slice(8, 12);

    scene({
      num: "1.1", title: "From Bits to Assembly", subtitle: "One tiny program, written down four different ways.",
      chips: ["Bits", "Hex", "Assembly", "Pseudocode"],
      steps: [
        { grouped: false, hex: false, asm: false, c: false, bands: false, hlRow: null, hlC: null, chip: 1,
          foot: "a memory only ever holds bits",
          narrate: "Before defining anything formally, let's peek inside the machine we're about to build. Here's a complete tiny program sitting in the E15's instruction memory, exactly as stored: six 12-bit words. A memory only ever holds bits." },
        { grouped: true, hex: false, asm: false, c: false, bands: false, hlRow: null, hlC: null, chip: 1,
          foot: "completely unreadable as written",
          narrate: "That's completely unreadable as written. Let's start by chopping every word into groups of four bits." },
        { grouped: true, hex: true, asm: false, c: false, bands: false, hlRow: null, hlC: null, chip: 2,
          foot: "still meaningless without a decoder ring",
          narrate: "Each group of four bits becomes one <strong>hex</strong> digit: <strong>1001</strong> is 9, <strong>0010</strong> is 2, <strong>0000</strong> is 0, so the first word is 920. Shorter, but still meaningless without a decoder ring." },
        { grouped: true, hex: true, asm: true, c: false, bands: false, hlRow: null, hlC: null, chip: 3,
          foot: "a human-readable name for every distinct pattern",
          narrate: "What we really want is to talk about instructions by name instead of by bit pattern. That's <strong>assembly language</strong>. Don't worry about decoding it yet: the next few sections define every piece." },
        { grouped: true, hex: true, asm: true, c: false, bands: false, hlRow: 2, hlC: null, chip: 3,
          foot: "same instruction, three names",
          narrate: "Follow one instruction across: the same bits underneath, three different names. Assembly changes what a <strong>human</strong> can read, not what the processor executes." },
        { grouped: true, hex: true, asm: true, c: true, bands: false, hlRow: null, hlC: null, chip: 4,
          foot: "roughly equivalent code you already know how to read",
          q: "Before I show you: what do you think this program does?",
          narrate: "And if you squint, this specific program corresponds, roughly, to code you already know how to read." },
        { grouped: true, hex: true, asm: true, c: true, bands: true, hlRow: null, hlC: null, chip: 4,
          foot: "matching colors: the instructions that do the same job",
          narrate: "Matching colors show which instructions do which job: set up two variables, then loop until <strong>rg2</strong> reaches 7, then stop." },
        { grouped: true, hex: true, asm: true, c: true, bands: true, hlRow: 5, hlC: 7, chip: 4,
          foot: "the last instruction jumps to itself, forever",
          narrate: "Every E15 program ends this way, with an instruction that jumps to itself. More on why later." },
        { grouped: true, hex: true, asm: true, c: true, bands: true, hlRow: null, hlC: null, chip: 5,
          foot: "same six instructions, four names",
          narrate: "That's the whole ladder this lecture climbs. Nothing at the bottom ever goes away: bits, hex, assembly and pseudocode are just <strong>different names for the same bit patterns</strong>, chosen for different audiences." },
      ],
      build(g) {
        const r = { bandEls: [], bitEls: [], cBandEls: [] };
        r.cCol = grp(g, 0);
        rect(r.cCol, 730, 60, 390, 316, { rx: 16, fill: C.white, stroke: C.purple, sw: 5 });
        txt(r.cCol, 925, 88, "PSEUDOCODE", { size: 14, weight: 700, fill: C.purple, anchor: "middle", ls: 1 });
        cLines.forEach((line, i) => { r.cBandEls.push(rect(r.cCol, 738, C_Y0 + i * C_DY - 22, 374, 30, { rx: 6 })); });
        cLines.forEach((line, i) => { txt(r.cCol, 750, C_Y0 + i * C_DY, line, { size: 17, mono: true, pre: true }); });
        r.cHl = rect(r.cCol, 738, 0, 374, 30, { rx: 6, stroke: C.accent, sw: 4 });
        r.cHl.style.opacity = 0;

        txt(g, 76, 88, "ADDR", { size: 11, weight: 700, fill: C.grey, anchor: "middle", ls: 1 });
        txt(g, 110, 88, "MEMORY (BITS)", { size: 14, weight: 700, fill: C.purple, ls: 1 });
        r.hexHead = txt(g, 345, 88, "HEX", { size: 14, weight: 700, fill: C.purple, ls: 1 });
        r.asmHead = txt(g, 420, 88, "ASSEMBLY", { size: 14, weight: 700, fill: C.purple, ls: 1 });
        r.hexHead.style.opacity = 0; r.asmHead.style.opacity = 0;
        bits.forEach((b, i) => { r.bandEls.push(rect(g, 52, ROW_Y0 + i * ROW_DY - 26, 660, 38, { rx: 8 })); });
        r.hexG = grp(g, 0); r.asmG = grp(g, 0);
        bits.forEach((b, i) => {
          const y = ROW_Y0 + i * ROW_DY;
          txt(g, 76, y, String(i), { size: 15, mono: true, fill: C.lgrey, anchor: "middle" });
          r.bitEls.push(txt(g, 110, y, b, { size: 20, weight: 700, mono: true, fill: C.purple }));
          txt(r.hexG, 345, y, hex[i], { size: 20, weight: 700, mono: true, fill: C.accent });
          txt(r.asmG, 420, y, asm[i], { size: 17, weight: 600, mono: true, pre: true });
        });
        r.rowHl = rect(g, 52, 0, 660, 40, { rx: 8, stroke: C.accent, sw: 4 });
        r.rowHl.style.opacity = 0;
        return r;
      },
      render(s, r) {
        r.bitEls.forEach((el, i) => { el.textContent = s.grouped ? group4(bits[i]) : bits[i]; });
        vis(r.hexG, s.hex); vis(r.hexHead, s.hex);
        vis(r.asmG, s.asm); vis(r.asmHead, s.asm);
        vis(r.cCol, s.c);
        r.bandEls.forEach((el) => el.setAttribute("fill", "none"));
        r.cBandEls.forEach((el) => el.setAttribute("fill", "none"));
        if (s.bands) groups.forEach((g) => {
          g.rows.forEach((i) => r.bandEls[i].setAttribute("fill", g.color));
          g.lines.forEach((i) => r.cBandEls[i].setAttribute("fill", g.color));
        });
        if (s.hlRow === null) vis(r.rowHl, false);
        else { r.rowHl.setAttribute("y", ROW_Y0 + s.hlRow * ROW_DY - 28); vis(r.rowHl, true); }
        if (s.hlC === null) vis(r.cHl, false);
        else { r.cHl.setAttribute("y", C_Y0 + s.hlC * C_DY - 23); vis(r.cHl, true); }
      },
    });
  })();
  // ================= 1.2 Instruction Format =================
  (function () {
    const WORD = "100100100000";
    const CELL = 64, X0 = (1150 - 12 * CELL) / 2;
    const fields = [
      { name: "opcode", bits: "4 bits", a: 0, b: 3, fill: C.t1, meaning: "1001 = movi" },
      { name: "src", bits: "2 bits", a: 4, b: 5, fill: C.t4, meaning: "00 = RXX" },
      { name: "dst", bits: "2 bits", a: 6, b: 7, fill: C.t5, meaning: "10 = Rg2" },
      { name: "immediate", bits: "4 bits", a: 8, b: 11, fill: C.t6, meaning: "0000 = 0" },
    ];

    scene({
      num: "1.2", title: "Instruction Format", subtitle: "What the E15 remembers, and how one instruction is laid out.",
      chips: ["State", "Fields", "Decoded"],
      steps: [
        { view: "st", n: 0, chip: 1, foot: "the machine we're about to build",
          narrate: "Before looking at an instruction, take stock of everything the E15 remembers. Right now: an empty box." },
        { view: "st", n: 1, chip: 1, foot: "four registers",
          narrate: "Four general-purpose registers, <strong>Rg0</strong> to <strong>Rg3</strong>. Each holds a 4-bit value." },
        { view: "st", n: 2, chip: 1, foot: "one flag",
          narrate: "One <strong>zero flag</strong>, <code>zFlag</code>: a single bit that remembers whether the last arithmetic or compare result was zero." },
        { view: "st", n: 3, chip: 1, foot: "one counter",
          narrate: "One <strong>program counter</strong>, <code>pc</code>: a 4-bit number saying which instruction runs next." },
        { view: "st", n: 4, chip: 1, foot: "one program",
          narrate: "And an instruction memory: a ROM of exactly 16 words, each 12 bits wide, holding the program." },
        { view: "st", n: 5, chip: 1, foot: "pc and the ROM are sized to match",
          q: "Why exactly 16 words in the ROM? Why not 10, or 20?",
          narrate: "Why 16 words? A 4-bit program counter can address exactly 2<sup>4</sup> = 16 locations, so <code>pc</code> and the ROM's depth are sized to match each other." },
        { view: "wd", f: 0, dec: false, chip: 2, foot: "twelve bits, no more, no fewer",
          narrate: "Now one instruction. Every instruction is a fixed <strong>12-bit word</strong>, laid out identically no matter which instruction it is." },
        { view: "wd", f: 1, dec: false, chip: 2, foot: "field 1 of 4",
          narrate: "The first four bits are the <strong>opcode</strong>: which operation to perform. <code>1001</code> is <code>movi</code>." },
        { view: "wd", f: 2, dec: false, chip: 2, foot: "field 2 of 4",
          narrate: "The next two bits pick the <strong>source</strong> register. Here it's <code>00</code>, but <code>movi</code> doesn't use a source, so it's written <code>RXX</code>: a placeholder for \"this field isn't used.\"" },
        { view: "wd", f: 3, dec: false, chip: 2, foot: "field 3 of 4",
          narrate: "The next two bits pick the <strong>destination</strong> register: <code>10</code> is <code>Rg2</code>." },
        { view: "wd", f: 4, dec: false, chip: 2, foot: "field 4 of 4",
          narrate: "The last four bits are the <strong>immediate</strong>: a small constant baked into the instruction itself. Here, 0." },
        { view: "wd", f: 4, dec: true, chip: 3, foot: "the same instruction, read by a human",

        if (s.view === "alu") {
          const ex = {
            add: { src: "0011", dst: "0110", mode: "1", mux: "0011", cin: "0", sum: "0110 + 0011 + 0", res: "1001", z: "0" },
            sub: { src: "0011", dst: "0110", mode: "0", mux: "1100", cin: "1", sum: "0110 + 1100 + 1", res: "0011", z: "0" },
            zero: { src: "0101", dst: "0101", mode: "0", mux: "1010", cin: "1", sum: "0101 + 1010 + 1", res: "0000", z: "1" },
          }[s.mode];
          r.vSrc.textContent = ex.src; r.vDst.textContent = ex.dst;
          r.vMode.textContent = "addNotSub = " + ex.mode;
          r.vMux.textContent = ex.mux; r.vCin.textContent = "Cin = ~addNotSub = " + ex.cin;
          r.vSum.textContent = ex.sum; r.vRes.textContent = ex.res; r.vZ.textContent = "zFlag = " + ex.z;
        }
        if (s.view === "two") {
          vis(r.jobs, s.stage === 0); vis(r.sol, s.stage >= 1); vis(r.todo, s.stage >= 2);
        }
      },
    });
  })();

  // ---------------- engine ----------------
  const $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const foot = txt(svg, 575, 392, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

  scenes.forEach((sc) => {
    sc.g = E("g", {}, svg);
    sc.g.style.display = "none";
    sc.r = sc.build(sc.g) || {};
    foot.parentNode.appendChild(foot);
  });
  $("sec-total").textContent = scenes.length - scenes.filter((x) => x.front).length;

  // si: section, ti: step, ph: 0 = question showing (diagram as before), 1 = answered
  const off = scenes.filter((x) => x.front).length;   // title slides don't count as sections
  let si = 0, ti = 0, ph = 1, shownScene = -1;
  const asks = (i, k) => !!scenes[i].steps[k].q;
  const startPh = (i, k) => (asks(i, k) && k > 0 ? 0 : 1);

  function readHash() {
    const m = location.hash.match(/^#(\d+)\.(\d+)(q?)$/);
    if (!m) { ph = startPh(si, ti); return; }
    const a = Number(m[1]) - 1 + off, b = Number(m[2]) - 1;
    if (a >= 0 && a < scenes.length) { si = a; ti = Math.max(0, Math.min(scenes[a].steps.length - 1, b)); }
    ph = m[3] && asks(si, ti) && ti > 0 ? 0 : 1;
  }

  function buildChips(sc) {
    const box = $("chips");
    box.innerHTML = "";
    sc.chips.forEach((label) => {
      const d = document.createElement("div");
      d.className = "stp";
      d.textContent = label;
      box.appendChild(d);
    });
  }

  function render() {
    const sc = scenes[si], s = sc.steps[ti];
    if (shownScene !== si) {
      scenes.forEach((x, k) => { x.g.style.display = k === si ? "inline" : "none"; });
      $("num").textContent = sc.num;
      $("title").textContent = sc.title;
      $("subtitle").textContent = sc.subtitle;
      document.querySelector(".stage").style.visibility = sc.front ? "hidden" : "";
      $("subtitle").style.visibility = sc.front ? "hidden" : "";
      $("sec-wrap").style.display = sc.front ? "none" : "";
      $("foot-left").textContent = sc.title;
      buildChips(sc);
      shownScene = si;
    }
    const asking = ph === 0 && !!s.q && ti > 0;
    // while a question is showing, the diagram stays exactly as the previous step left it
    sc.render(asking ? sc.steps[ti - 1] : s, sc.r, ti);
    foot.textContent = asking ? "" : (s.foot || "");
    const qm = '<span class="qm">Q</span>';
    $("narration").innerHTML = asking ? '<div class="q big">' + qm + s.q + '</div>'
      : (s.q ? '<div class="q small">' + qm + s.q + '</div>' : "") + s.narrate;
    $("sec-n").textContent = si - off + 1;
    $("step-n").textContent = ti + 1;
    $("step-total").textContent = sc.steps.length;
    document.querySelectorAll(".stp").forEach((chip, k) => {
      const n = k + 1;
      chip.classList.remove("active", "done");
      if (!s.chip) return;
      if (s.chip === n) chip.classList.add("active");
      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  readHash();
  render();
})();
</script>

</body>
</html>
