<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="736" cy="376" r="7" fill="#7b5aa6"/>

  <!-- E15 body -->
  <rect x="50" y="56" width="660" height="290" rx="18" fill="#ffffff" stroke="#57068c" stroke-width="7"/>
  <text x="380" y="92" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">E15</text>

  <!-- general-purpose registers -->
  <text x="80" y="132" fill="#404040" font-size="14" font-weight="700">4 general-purpose registers</text>
  <text x="80" y="149" fill="#6d6d6d" font-size="11" font-style="italic">4 bits each</text>
  <g fill="#eee6f3" stroke="#57068c" stroke-width="3">
    <rect x="80"  y="162" width="70" height="38" rx="6"/>
    <rect x="156" y="162" width="70" height="38" rx="6"/>
    <rect x="232" y="162" width="70" height="38" rx="6"/>
    <rect x="308" y="162" width="70" height="38" rx="6"/>
  </g>
  <g fill="#57068c" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="115" y="187">Rg0</text>
    <text x="191" y="187">Rg1</text>
    <text x="267" y="187">Rg2</text>
    <text x="343" y="187">Rg3</text>
  </g>

  <!-- zero flag -->
  <text x="80" y="242" fill="#404040" font-size="14" font-weight="700">zero flag</text>
  <text x="80" y="259" fill="#6d6d6d" font-size="11" font-style="italic">1 bit</text>
  <rect x="80" y="272" width="90" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="125" y="297" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">zFlag</text>

  <!-- program counter -->
  <text x="212" y="242" fill="#404040" font-size="14" font-weight="700">program counter</text>
  <text x="212" y="259" fill="#6d6d6d" font-size="11" font-style="italic">4 bits</text>
  <rect x="212" y="272" width="90" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="257" y="297" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">pc</text>

  <!-- pc selects a ROM word -->
  <path d="M302,291 L440,291" fill="none" stroke="#8900e1" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M446,291 L436,285 L436,297 Z" fill="#8900e1"/>
  <text x="372" y="283" fill="#8900e1" font-size="11" font-weight="700" text-anchor="middle">picks a word</text>

  <!-- instruction memory -->
  <text x="450" y="132" fill="#404040" font-size="14" font-weight="700">instruction memory (ROM)</text>
  <text x="450" y="149" fill="#6d6d6d" font-size="11" font-style="italic">16 words &#215; 12 bits each</text>
  <g fill="#eee6f3" stroke="#57068c" stroke-width="3">
    <rect x="450" y="162" width="230" height="30" rx="5"/>
    <rect x="450" y="196" width="230" height="30" rx="5"/>
    <rect x="450" y="262" width="230" height="30" rx="5"/>
    <rect x="450" y="296" width="230" height="30" rx="5"/>
  </g>
  <g fill="#57068c" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="565" y="182">myROM[0]</text>
    <text x="565" y="216">myROM[1]</text>
    <text x="565" y="282">myROM[14]</text>
    <text x="565" y="316">myROM[15]</text>
  </g>
  <text x="565" y="250" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">&#8942;</text>

  <text x="380" y="384" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">everything the E15 remembers: four registers, one flag, one counter, one program</text>
</svg>
