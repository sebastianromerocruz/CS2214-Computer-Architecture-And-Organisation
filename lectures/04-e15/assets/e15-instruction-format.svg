<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="320" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="736" cy="296" r="7" fill="#7b5aa6"/>

  <!-- field group backgrounds -->
  <rect x="60"  y="100" width="160" height="50" fill="#e9d9f5" stroke="#57068c" stroke-width="5"/>
  <rect x="220" y="100" width="80"  height="50" fill="#f3e9ff" stroke="#57068c" stroke-width="5"/>
  <rect x="300" y="100" width="80"  height="50" fill="#e2cdf2" stroke="#57068c" stroke-width="5"/>
  <rect x="380" y="100" width="160" height="50" fill="#f7f0ff" stroke="#57068c" stroke-width="5"/>

  <!-- bit separators -->
  <g stroke="#8900e1" stroke-width="2">
    <line x1="100" y1="100" x2="100" y2="150"/>
    <line x1="140" y1="100" x2="140" y2="150"/>
    <line x1="180" y1="100" x2="180" y2="150"/>
    <line x1="260" y1="100" x2="260" y2="150"/>
    <line x1="340" y1="100" x2="340" y2="150"/>
    <line x1="420" y1="100" x2="420" y2="150"/>
    <line x1="460" y1="100" x2="460" y2="150"/>
    <line x1="500" y1="100" x2="500" y2="150"/>
  </g>

  <!-- bit digits: 1001 00 10 0000 -->
  <g fill="#57068c" font-size="22" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="80"  y="132">1</text>
    <text x="120" y="132">0</text>
    <text x="160" y="132">0</text>
    <text x="200" y="132">1</text>
    <text x="240" y="132">0</text>
    <text x="280" y="132">0</text>
    <text x="320" y="132">1</text>
    <text x="360" y="132">0</text>
    <text x="400" y="132">0</text>
    <text x="440" y="132">0</text>
    <text x="480" y="132">0</text>
    <text x="520" y="132">0</text>
  </g>

  <!-- brackets -->
  <g stroke="#57068c" stroke-width="3">
    <line x1="60"  y1="150" x2="60"  y2="160"/><line x1="220" y1="150" x2="220" y2="160"/>
    <line x1="60"  y1="160" x2="220" y2="160"/>
    <line x1="220" y1="150" x2="220" y2="160"/><line x1="300" y1="150" x2="300" y2="160"/>
    <line x1="220" y1="160" x2="300" y2="160"/>
    <line x1="300" y1="150" x2="300" y2="160"/><line x1="380" y1="150" x2="380" y2="160"/>
    <line x1="300" y1="160" x2="380" y2="160"/>
    <line x1="380" y1="150" x2="380" y2="160"/><line x1="540" y1="150" x2="540" y2="160"/>
    <line x1="380" y1="160" x2="540" y2="160"/>
  </g>

  <!-- field labels -->
  <g fill="#57068c" font-size="14" font-weight="700" text-anchor="middle">
    <text x="140" y="180">opcode</text>
    <text x="260" y="180">src</text>
    <text x="340" y="180">dst</text>
    <text x="460" y="180">immediate</text>
  </g>
  <g fill="#6d6d6d" font-size="11" font-style="italic" text-anchor="middle">
    <text x="140" y="196">(4 bits)</text>
    <text x="260" y="196">(2)</text>
    <text x="340" y="196">(2)</text>
    <text x="460" y="196">(4 bits)</text>
  </g>

  <!-- decode arrow -->
  <line x1="300" y1="206" x2="300" y2="226" stroke="#404040" stroke-width="4"/>
  <path d="M300,232 L293,220 L307,220 Z" fill="#404040"/>

  <text x="300" y="258" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">movi &#160;&#160;RXX &#160;&#160;Rg2 &#160;&#160;0</text>
  <text x="300" y="280" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">1001 = movi &#183; 00 = RXX (unused) &#183; 10 = Rg2 &#183; 0000 = 0</text>
</svg>
