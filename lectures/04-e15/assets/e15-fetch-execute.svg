<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="740" height="600" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="716" cy="576" r="7" fill="#7b5aa6"/>

  <!-- fetch box -->
  <rect x="190" y="50" width="320" height="90" rx="18" fill="#ffffff" stroke="#57068c" stroke-width="7"/>
  <text x="350" y="90" fill="#57068c" font-size="24" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">myROM[pc]</text>
  <text x="350" y="114" fill="#6d6d6d" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">assign {opcode,src,dst,imm} = myROM[pc];</text>

  <text x="215" y="172" fill="#6d6d6d" font-size="12" font-style="italic">continuous: no separate fetch cycle to wait for</text>

  <!-- vertical flow arrow with clock trigger marker -->
  <line x1="350" y1="182" x2="350" y2="322" stroke="#404040" stroke-width="5"/>
  <path d="M350,332 L342,314 L358,314 Z" fill="#404040"/>
  <polygon points="335,245 365,245 350,227" fill="#eee6f3" stroke="#57068c" stroke-width="4" stroke-linejoin="round"/>
  <text x="380" y="246" fill="#57068c" font-size="13" font-weight="700">posedge clk</text>

  <!-- update box -->
  <rect x="100" y="340" width="500" height="160" rx="18" fill="#ffffff" stroke="#57068c" stroke-width="7"/>
  <line x1="267" y1="360" x2="267" y2="440" stroke="#d8c7ea" stroke-width="2"/>
  <line x1="433" y1="360" x2="433" y2="440" stroke="#d8c7ea" stroke-width="2"/>

  <text x="183" y="385" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">zFlag</text>
  <text x="183" y="408" fill="#6d6d6d" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">(result == 0)</text>

  <text x="350" y="385" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">dst register</text>
  <text x="350" y="408" fill="#6d6d6d" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Rg0..Rg3 &#8656; result</text>

  <text x="517" y="385" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">pc</text>
  <text x="517" y="408" fill="#6d6d6d" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">pc+1 or pc+imm</text>

  <text x="350" y="476" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">all three commit together, on the same edge</text>

  <!-- feedback loop: new pc feeds next fetch -->
  <circle cx="600" cy="400" r="5" fill="#8900e1"/>
  <path d="M600,400 C690,400 690,100 522,100" fill="none" stroke="#8900e1" stroke-width="5"/>
  <polygon points="512,100 526,93 526,107" fill="#8900e1"/>
  <text x="712" y="250" fill="#8900e1" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 712 250)">next pc feeds fetch</text>

  <text x="350" y="546" fill="#57068c" font-size="19" font-weight="700" text-anchor="middle">fetch is continuous; execute is atomic</text>
  <text x="350" y="568" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">one instruction decoded per cycle, three state updates committed together</text>
</svg>
