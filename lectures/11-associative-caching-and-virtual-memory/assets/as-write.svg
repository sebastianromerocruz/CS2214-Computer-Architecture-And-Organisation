<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 380" font-family="Helvetica, Arial, sans-serif">
<rect width="1150" height="380" rx="24" fill="#eee6f3"/>
<text x="575.0" y="30" fill="#6d6d6d" font-size="17" text-anchor="middle">a loop stores to the same address 100 times, then the block is evicted.</text>
<text x="290" y="70" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">write-through</text>
<rect x="40" y="90" width="230" height="110" rx="8" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="155" y="118" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">cache row</text>
<text x="155" y="152" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">tag  value</text>
<text x="155" y="182" fill="#6d6d6d" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">D n/a</text>
<rect x="370" y="90" width="170" height="110" rx="8" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="455" y="118" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">RAM</text>
<text x="455" y="160" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">[addr]</text>
<polyline points="272,145 368,145" fill="none" stroke="#c1272d" stroke-width="5" stroke-linecap="round"/>
<text x="320" y="132" fill="#c1272d" font-size="20" font-weight="700" text-anchor="middle">× 100</text>
<text x="290" y="250" fill="#c1272d" font-size="28" font-weight="700" text-anchor="middle">100 writes to RAM</text>
<text x="290" y="290" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">every store goes to RAM</text>
<text x="850" y="70" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">write-back</text>
<rect x="600" y="90" width="230" height="110" rx="8" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="715" y="118" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">cache row</text>
<text x="715" y="152" fill="#6d6d6d" font-size="14" font-weight="600" text-anchor="middle">tag  value</text>
<text x="715" y="182" fill="#b07a00" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">D = 1</text>
<rect x="930" y="90" width="170" height="110" rx="8" fill="#fff" stroke="#57068c" stroke-width="3"/>
<text x="1015" y="118" fill="#6d6d6d" font-size="15" font-weight="600" text-anchor="middle">RAM</text>
<text x="1015" y="160" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">[addr]</text>
<polyline points="832,145 928,145" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
<text x="880" y="132" fill="#2e7d32" font-size="20" font-weight="700" text-anchor="middle">× 1</text>
<text x="850" y="250" fill="#2e7d32" font-size="28" font-weight="700" text-anchor="middle">1 write to RAM</text>
<text x="850" y="290" fill="#6d6d6d" font-size="17" font-weight="600" text-anchor="middle">only the eviction writes to RAM</text>
<text x="575" y="350" fill="#57068c" font-size="17" font-weight="600" text-anchor="middle">the dirty bit D is what lets write-back remember: this block is newer than RAM, write it before dropping it</text>
</svg>
