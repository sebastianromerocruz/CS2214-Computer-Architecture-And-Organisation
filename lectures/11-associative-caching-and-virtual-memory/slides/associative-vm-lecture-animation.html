<!DOCTYPE html>

<title>CS-UY 2214 | Associative Caches and Virtual Memory | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* Lecture 11 on the lecture 10 deck engine. Arrow keys step, shift + arrow jumps a section, n shows the full narration. Open with #9.3. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 10px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {

  .narration strong { color: var(--red); }
  .narration code {

  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {

  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>

<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">17</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">Associative Caches and Virtual Memory</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenes.push(def); }

  // ================= 10 caching deck =================
  // ---------- helpers for this deck ----------
  const ASSET = "fig/";
  function figScene(cfg) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { imgs: {} };
        cfg.steps.forEach((s) => {
          if (!s.img || r.imgs[s.img]) return;
          const im = E("image", { x: 0, y: 0, width: 1150, height: 400, preserveAspectRatio: "xMidYMid meet" }, g);
          im.setAttributeNS("http://www.w3.org/1999/xlink", "href", ASSET + s.img);
          im.setAttribute("href", ASSET + s.img);
          im.style.opacity = 0;
          r.imgs[s.img] = im;
        });
        return r;
      },
      render(s, r) { for (const k in r.imgs) vis(r.imgs[k], k === s.img); },
    };
  }
  // table scene: cols = [{h, x, anchor, mono, w}], rows = arrays of strings; step: rows = how many rows are showing, hl = highlighted row indices
  function tableScene(cfg) {
    const RH = cfg.rh || 34, Y0 = cfg.y0 || 26, FS = cfg.fs || 15;
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { rows: [], bgs: [] };
        const W = cfg.cols[cfg.cols.length - 1].x + cfg.cols[cfg.cols.length - 1].w + 20 - cfg.cols[0].x;
        cfg.cols.forEach((c) => txt(g, c.x, Y0 - 8, c.h, { size: 12, weight: 700, fill: C.purple, ls: 1.5, anchor: c.anchor || "start" }));
        ln(g, cfg.cols[0].x - 10, Y0, cfg.cols[0].x - 10 + W, Y0, { stroke: C.purple, sw: 2 });
        cfg.rows.forEach((row, i) => {
          const gg = grp(g, 0); r.rows.push(gg);
          const y = Y0 + i * RH;
          r.bgs.push(rect(gg, cfg.cols[0].x - 10, y + 3, W, RH - 4, { rx: 6, fill: "none" }));
          row.forEach((cell, ci) => {
            const c = cfg.cols[ci];
            txt(gg, c.x, y + RH / 2 + 5, cell, { pre: true, size: c.size || FS, mono: !!c.mono, weight: c.bold ? 700 : 400, fill: c.bold ? C.purple : C.ink, anchor: c.anchor || "start" });
          });
        });
        return r;
      },
      render(s, r) {
        const n = s.rows === undefined ? cfg.rows.length : s.rows, hl = s.hl || [];
        r.rows.forEach((gg, i) => vis(gg, i < n));
        r.bgs.forEach((b, i) => b.setAttribute("fill", hl.indexOf(i) >= 0 ? C.t2 : "none"));
      },
    };
  }


  function mixScene(cfg, subs) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { subs: {}, gs: {} };
        for (const k in subs) { const gg = grp(g, 0); r.gs[k] = gg; r.subs[k] = subs[k].build(gg); }
        return r;
      },
      render(s, r) {
        for (const k in subs) { vis(r.gs[k], s.sub === k); if (s.sub === k) subs[k].render(s, r.subs[k]); }
      },
    };
  }
  const tb = (c) => tableScene(Object.assign({ steps: [{}] }, c));
  const fg = (imgs) => figScene({ steps: imgs.map((i) => ({ img: i })) });

  const trn = (el, ms) => { el.style.transition = "opacity " + ms + "ms, fill " + ms + "ms, stroke " + ms + "ms"; return el; };
  const growX = (el, ms) => { el.style.transformBox = "fill-box"; el.style.transformOrigin = "0% 50%"; el.style.transform = "scaleX(0)"; el.style.transition = "transform " + ms + "ms ease, opacity 0.3s"; return el; };
  const PC5 = ["#e2cdf2", "#d9e8fb", "#fbe9ea", "#e4f3e1", "#fff1cf"];

  // ---- cards, for short lists of points
  const cd = (head, lines, mono) => ({ head, lines: lines || [], mono: !!mono });
  const cardSub = {
    build(g) {
      const r = {};
      rect(g, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
      r.head = txt(g, 575, 135, "", { size: 42, weight: 700, fill: "#171715", anchor: "middle" });
      rect(g, 505, 160, 140, 6, { rx: 3, fill: C.accent });
      r.lines = [0, 1, 2, 3].map((i) => txt(g, 575, 218 + i * 34, "", { size: 21, fill: C.grey, anchor: "middle" }));
      return r;
    },
    render(s, r) {
      const c = s.card || {};
      r.head.textContent = c.head || "";
      r.head.setAttribute("font-size", (c.head || "").length > 30 ? 30 : 40);
      r.lines.forEach((t, i) => { t.textContent = (c.lines || [])[i] || ""; });
    },
  };

  // ================= lecture 11 helpers =================
  const ASSETS = "../assets/";
  const figSub = (function () {
    const imgs = ["as-conflict.svg", "as-ways.svg", "as-lru.svg", "as-spectrum.svg", "as-write.svg"];
    return {
      build(g) {
        const r = {};
        imgs.forEach((n) => {
          const im = E("image", { x: 0, y: 0, width: 1150, height: 380, preserveAspectRatio: "xMidYMid meet" }, g);
          im.setAttributeNS("http://www.w3.org/1999/xlink", "href", ASSETS + n); im.setAttribute("href", ASSETS + n);
          im.style.opacity = 0; r[n] = im;
        });
        return r;
      },
      render(s, r) { for (const k in r) vis(r[k], k === s.img); },
    };
  })();

  // ---- set-associative cache simulator (block size cfg.bs, cfg.sets sets of cfg.ways ways)
  const CFG = {
    dm: { sets: 4, ways: 1, bs: 8, policy: "LRU", sn: "row" },
    w2: { sets: 2, ways: 2, bs: 8, policy: "LRU", sn: "set" },
    w2f: { sets: 2, ways: 2, bs: 8, policy: "FIFO", sn: "set" },
    fa: { sets: 1, ways: 4, bs: 8, policy: "LRU", sn: "set" },
    w4: { sets: 2, ways: 4, bs: 4, policy: "LRU", sn: "set" },
    fa4: { sets: 1, ways: 4, bs: 4, policy: "LRU", sn: "set" },
  };
  const TRS = {
    recap: [16, 80, 17, 81, 18, 82],
    lru: [16, 80, 17, 144, 17],
    ten: [52, 53, 92, 55, 20, 54, 60, 53, 29, 28],
    w4t: [0, 8, 16, 24, 0, 32, 8, 4, 5, 16],
    fat: [4, 20, 36, 8, 5, 52, 20, 4, 37, 9],
  };
  function asim(cfg, trace, n) {
    const sets = []; for (let i = 0; i < cfg.sets; i++) sets.push(new Array(cfg.ways).fill(null));
    const res = []; let hits = 0, misses = 0;
    for (let k = 0; k < n; k++) {
      const a = trace[k], blk = Math.floor(a / cfg.bs), set = blk % cfg.sets, tag = Math.floor(blk / cfg.sets), S = sets[set];
      const r = { a, blk, set, tag, n: k + 1 };
      let w = S.findIndex((x) => x && x.tag === tag);
      if (w >= 0) { r.hit = true; S[w].t = k + 1; hits++; }
      else {
        misses++;
        w = S.indexOf(null);
        if (w < 0) {
          let best = 0;
          S.forEach((x, i) => { const key = cfg.policy === "LRU" ? x.t : x.a; const bk = cfg.policy === "LRU" ? S[best].t : S[best].a; if (key < bk) best = i; });
          w = best; r.evict = S[w].tag; r.evblk = S[w].blk;
        }
        S[w] = { tag, blk, t: k + 1, a: k + 1 };
      }
      r.way = w; res.push(r);
    }
    return { sets, res, hits, misses };
  }

  // a trace of a set-associative cache. step: cfg, tr, k (access number, 1-based), ph 0 request, 1 calculate, 2 compare, 3 outcome.
  const asSub = {
    build(g) { return { g: grp(g, 1) }; },
    render(s, r) {
      const g = r.g; while (g.firstChild) g.removeChild(g.firstChild);
      const cfg = CFG[s.cfg], tr = TRS[s.tr], k = s.k || 0, ph = s.ph === undefined ? 3 : s.ph;
      const pre = asim(cfg, tr, Math.max(0, k - 1)), post = asim(cfg, tr, k);
      const cur = k > 0 ? post.res[k - 1] : null;
      const showPost = ph === 3 || k === 0;
      const st = showPost ? post : pre;
      const SH = Math.min(s.meta === "both" ? 92 : 70, Math.floor(300 / cfg.sets)), BW = cfg.ways <= 2 ? 190 : 118, BX = 395;
      // request panel
      rect(g, 14, 40, 290, 252, { rx: 14, fill: C.white, stroke: C.purple, sw: 3 });
      txt(g, 159, 66, k > 0 ? "ACCESS " + k + " OF " + tr.length : "EMPTY CACHE", { size: 13, weight: 700, fill: C.grey, anchor: "middle", ls: 2 });
      if (cur) {
        txt(g, 159, 112, "address " + cur.a, { size: 30, weight: 700, mono: true, fill: C.red, anchor: "middle" });
        const q = ph >= 1;
        const L = [["block", q ? cur.a + " // " + cfg.bs + " = " + cur.blk : "?"], [cfg.sn, q ? cur.blk + " % " + cfg.sets + " = " + cur.set : "?"], ["tag", q ? cur.blk + " // " + cfg.sets + " = " + cur.tag : "?"]];
        L.forEach((l, i) => { txt(g, 34, 152 + i * 34, l[0], { size: 17, weight: 700, fill: C.purple }); txt(g, 110, 152 + i * 34, q ? l[1] : "?", { size: 19, weight: 700, mono: true, fill: q ? C.ink : C.lgrey }); });
        if (ph >= 3) {
          const ok = cur.hit;
          rect(g, 34, 244, 250, 38, { rx: 10, fill: ok ? "#e4f3e1" : C.t2, stroke: ok ? "#2e7d32" : C.red, sw: 3 });
          txt(g, 159, 270, ok ? "HIT" : "MISS", { size: 22, weight: 700, fill: ok ? "#2e7d32" : C.red, anchor: "middle", ls: 3 });
        }
      } else txt(g, 159, 170, "block size " + cfg.bs, { size: 20, fill: C.grey, anchor: "middle" });
      txt(g, 159, 322, "hits " + st.hits + "   misses " + st.misses, { size: 18, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
      // sets and ways
      const y0 = 40 + (300 - SH * cfg.sets) / 2;
      txt(g, BX + (BW * cfg.ways + 10 * (cfg.ways - 1)) / 2, 26, cfg.ways === 1 ? "ONE WAY" : cfg.ways + " WAYS", { size: 13, weight: 700, fill: C.grey, anchor: "middle", ls: 2 });
      for (let i = 0; i < cfg.sets; i++) {
        const y = y0 + i * SH, hotset = cur && cur.set === i && ph >= 2;
        if (hotset) rect(g, 328, y - 3, BX - 328 + cfg.ways * (BW + 10) - 4, SH - 4, { rx: 12, fill: C.t1 });
        txt(g, 385, y + SH / 2 + 2, cfg.sn + " " + i, { size: 18, weight: 700, mono: true, fill: C.grey, anchor: "end" });
        for (let w = 0; w < cfg.ways; w++) {
          const x = BX + w * (BW + 10), cell = st.sets[i][w];
          let fill = C.white, stroke = C.purple, sw = 3, mark = "", mcol = C.grey;
          const isNew = showPost && cur && cur.set === i && cur.way === w && k > 0;
          if (isNew) { fill = cur.hit ? "#e4f3e1" : C.t2; stroke = cur.hit ? "#2e7d32" : C.red; sw = 6; }
          if (ph === 2 && cur && cur.set === i) {
            if (!cell) { mark = "free"; mcol = C.grey; }
            else if (cell.tag === cur.tag) { mark = "match"; mcol = "#2e7d32"; stroke = "#2e7d32"; fill = "#e4f3e1"; sw = 6; }
            else { mark = "differs"; mcol = C.red; }
          }
          rect(g, x, y, BW, SH - 12, { rx: 10, fill, stroke, sw });
          (s.vic || []).forEach((v) => { if (i === 0 && v[0] === w) rect(g, x - 4, y - 4, BW + 8, SH - 4, { rx: 12, fill: "none", stroke: v[1], sw: 6, dash: v[2] ? "9 6" : undefined }); });
          if (cell) {
            if (s.meta === "both") {
              txt(g, x + BW / 2, y + 28, "tag " + cell.tag, { size: 22, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
              txt(g, x + BW / 2, y + 50, "arrived: access " + cell.a, { size: 15, mono: true, fill: C.grey, anchor: "middle" });
              txt(g, x + BW / 2, y + 68, "last used: access " + cell.t, { size: 15, mono: true, fill: C.grey, anchor: "middle" });
            } else {
              txt(g, x + BW / 2, y + (SH - 12) / 2 - (s.meta ? 2 : -7), "tag " + cell.tag, { size: 21, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
              if (s.meta) txt(g, x + BW / 2, y + (SH - 12) / 2 + 18, (cfg.policy === "LRU" ? "last used: " + cell.t : "arrived: " + cell.a), { size: 14, mono: true, fill: C.grey, anchor: "middle" });
            }
          } else txt(g, x + BW / 2, y + (SH - 12) / 2 + 6, "empty", { size: 16, italic: true, fill: C.lgrey, anchor: "middle" });
          if (mark) txt(g, x + BW / 2, y - 6, mark, { size: 13, weight: 700, fill: mcol, anchor: "middle", mono: true });
        }
      }
      if (!s.why && !s.nolog && k > 0) {
        const lx = 932, ly = 40, done = ph === 3 ? k : k - 1, n = post.res.length;
        rect(g, lx - 10, ly, 214, 40 + Math.max(n, 1) * 22 + 12, { rx: 12, fill: C.white, stroke: C.purple, sw: 3 });
        txt(g, lx + 97, ly + 26, "HITS AND MISSES", { size: 13, weight: 700, mono: true, fill: C.grey, anchor: "middle", ls: 1 });
        for (let j = 0; j < n; j++) {
          const y = ly + 54 + j * 22, rr = post.res[j], shown = j < done, now = j === k - 1 && ph < 3;

      { sub: "dec", hot: ["A"], chip: 2, cap: "Every memory access starts here.", narrate: "Here is the logic of every memory access. It starts with the access itself." },
      { sub: "dec", hot: ["A", "B"], he: ["AB"], chip: 2, cap: "First question: is the page valid?", narrate: "The first question: is the page valid? That is the valid bit in the page table." },

      { sub: "card", card: cd("Choosing a victim", ["pick a seldom-used page", "same idea as LRU in a cache", "if it is dirty, write it to disk first", "then reuse its frame"]), chip: 3, cap: "Evict a seldom-used page, like LRU.", narrate: "The OS chooses a seldom-used page to evict, the same idea as LRU in a cache. If the page has been modified, it has to be written to disk first." },

      { sub: "vm", mode: "table", pt: PT1, hotv: 6, fault: true, say: "address 50: page 6 is on disk; the victim is page 3, which is dirty", chip: 4, cap: "Address 50: page 6 is on disk. Victim: page 3, D = 1.", narrate: "A second example. Address 50 is page 6, offset 2, and page 6 is on disk. The OS picks page 3 as the victim, and page 3 has D equal to 1." },
      { sub: "vm", mode: "table", pt: PT2, hotf: 3, say: "page 3 written to disk first; its frame is free", chip: 4, cap: "Page 3 is written to disk first.", narrate: "Page 3 is dirty, so it is written to disk first. Only then is its frame free." },

      { sub: "card", card: cd("The problems, answered", ["more memory than RAM: swapping to disk", "same address in two programs: a page table each", "protection: valid and protect bits", "the OS is protected from the applications"]), chip: 5, cap: "The five questions have answers.", narrate: "Go back to the questions we started with. A program bigger than RAM works, because pages swap to disk. Two programs can use the same virtual address, because each has its own page table mapping it to different frames. And the valid and protect bits keep programs out of each other's memory and out of the operating system's." },
    ],
  }, asSubs({ vm: vmSub, dec: decSub, sim: tb(SIM), fsm: fsmSub })));

  // ================= 14 Too big, too slow =================

    num: "17", title: "Too Big, Too Slow", subtitle: "The page table has two problems. Both have caches for an answer.",

      { sub: "card", card: cd("And every process has one", ["3 MB per process", "ten processes: 30 MB of tables", "most programs use a small part of their space", "most of each table is empty"]), chip: 1, cap: "One table per process, and mostly empty.", narrate: "Each process has its own page table, so this adds up. And most programs use only a small part of their address space, so most page tables are mostly empty." },
      { sub: "flow", boxes: ["CPU", "page table (in RAM)", "the data (in RAM)"], hot: [0, 1], lab: { 1: "trip 1: translate" }, chip: 2, cap: "First trip to RAM: read the page table.", narrate: "The second problem is speed. To translate an address, the hardware has to read the page table, and the page table lives in RAM. That is one trip to memory." },
      { sub: "flow", boxes: ["CPU", "page table (in RAM)", "the data (in RAM)"], hot: [0, 1, 2], lab: { 1: "trip 1: translate", 2: "trip 2: the access" }, chip: 2, cap: "Second trip: the actual data. Memory is twice as slow.", narrate: "Only then can it make the real access. Every memory access now takes two round trips to memory. We have just cut the speed of memory in half." },
      { sub: "card", card: cd("Two problems, two answers", ["too big: a hierarchy of page tables", "too slow: cache the translations", "the cache of translations is the TLB"]), chip: 2, cap: "A <strong>page table hierarchy</strong> for size, the <strong>TLB</strong> for speed.", narrate: "Both problems have answers we already know. Too big: swap parts of the table out, with a <strong>hierarchy of page tables</strong>, much as we had a hierarchy of caches. Too slow: cache the translations, in the <strong>translation lookaside buffer</strong>, or <strong>TLB</strong>." },
      { sub: "flow", boxes: ["CPU", "TLB", "page table", "RAM"], hot: [0, 1, 3], dim: [2], lab: { 1: "hit: frame known" }, chip: 3, cap: "TLB hit: no trip to the page table.", narrate: "The TLB sits between the processor and the page table. On a hit, it already knows the frame, so the page table is skipped and only the real access goes to RAM." },
      { sub: "flow", boxes: ["CPU", "TLB", "page table", "RAM"], hot: [0, 1, 2, 3], lab: { 1: "miss", 2: "walk the table" }, chip: 3, cap: "TLB miss: walk the page table, remember the result.", narrate: "On a miss, the hardware walks the page table, as before, and keeps the answer in the TLB for next time." },
      { sub: "card", card: cd("The TLB", ["a cache of the page table", "tag: the virtual page; value: the physical page", "also holds valid, dirty and protect bits", "usually fully associative"]), chip: 3, cap: "A small, fully associative cache of translations.", narrate: "The TLB is a cache of the page table. The tag is the virtual page, and the value stored is the physical page, plus the valid, dirty and protect bits. It is consulted before the page table, and it is usually fully associative, which is why we spent this lecture on what that means." },
      { sub: "bar", t1: "32-bit virtual address, two levels", bar: [["index 1", 10, "top table"], ["index 2", 10, "second table"], ["offset", 12, "4 KB"]], chip: 4, cap: "A <strong>two-level page table</strong>: a table of tables.", narrate: "Now the size problem. Cut the 20-bit page number in two. The first 10 bits index a top-level table, whose entries point to second-level tables. The second 10 bits index the second-level table, which gives the frame. This is a <strong>two-level page table</strong>." },
      { sub: "tbl", b: 3, chip: 4, cap: "Unused regions cost almost nothing.", narrate: "Most programs use a small part of their address space, so most second-level tables never need to exist. An unused region costs one entry in the top-level table. The price is more steps in a lookup, which is why the TLB matters even more." },
      { sub: "bar", t1: "48-bit virtual address, four levels", bar: [["9", 9, ""], ["9", 9, ""], ["9", 9, ""], ["9", 9, ""], ["offset", 12, "4 KB"]], chip: 4, cap: "Modern x86-64: four levels of 9 bits.", narrate: "Modern 64-bit Intel systems use four or five levels. Each level has a 9-bit index. Four levels allow a 48-bit virtual address, an address space of 256 tebibytes. Five levels allow 57 bits, 128 pebibytes." },
      { sub: "card", card: cd("The whole picture", ["pages, a page table, valid, dirty and protect bits", "a page fault: the OS loads the page from disk", "the TLB: a cache of translations", "multi-level tables: pay for what you use"]), chip: 4, cap: "Virtual memory, from the program's view down to the disk.", narrate: "To sum up. Virtual memory maps virtual pages to frames with a page table, with valid, dirty and protect bits. A page fault sends the operating system to bring the page from disk. The TLB caches translations so that most accesses skip the table. And multi-level tables mean we only pay for the address space a program actually uses." },
    ],

  // ---------------- engine ----------------
  const NARR_OVR = {"0.1": "Last week ended with a cache that threw away its own data while three of its four rows sat empty. We stopped there on purpose, because the fix is the first half of today. And once the cache is fixed, two things are still being pretended away. The processor does not only read memory, it also writes to it. And memory is neither as big as the addresses we use, nor private to one program.", "0.2": "So today has two halves. In the first we finish caches: where a block is allowed to live, who gets evicted when there is no room, what a store does, and how several caches stack into a hierarchy. In the second half we turn to the two problems we have been pretending away, and that is virtual memory. Here is the route.", "1.1": "Let us start from the cache that failed. It has four rows and a block size of 8, and the program reads 16, 80, 17, 81, 18 and 82. Addresses 16 to 18 sit in block 2, and 80 to 82 sit in block 10. Divide either block number by 4 and the remainder is 2, so both blocks belong in row 2. Watch what that costs.", "1.2": "The first read is address 16: block 2, row 2, tag 0. The cache is empty, so it misses, and block 2 is loaded into row 2. So far so good.", "1.3": "Next, address 80: block 10, which also goes to row 2, with tag 2. The row holds tag 0, so the tags differ. It is a miss, and block 2 is thrown out to make room.", "1.4": "Now the program goes back to block 2 with address 17. The row holds block 10 by now, so this is a miss, and block 10 is thrown out in turn.", "1.5": "Address 81 is in block 10, the block that was just evicted. Another miss. The two blocks are taking turns.", "1.6": "Address 18 is in block 2 once more. Another miss.", "1.7": "And address 82 misses too. Six reads, six misses, a hit ratio of zero. And the whole time, rows 0, 1 and 3 never held a single block.", "1.8": "We gave this a name last week: a conflict. Notice what did not go wrong. The cache was not too small, three of its rows were empty. It failed because a direct-mapped cache gives every block exactly one place to live, so two blocks that need the same place keep evicting each other. That suggests the question for today: what if a block had more than one place to go?", "2.1": "Here is the idea. Keep the same amount of storage, four blocks, but arrange it differently. Instead of four rows with one block each, make two rows with two blocks each. A block is still routed to a row, but inside that row it may sit in either of two seats. Let us see whether that rescues our trace.", "2.2": "Compare the two layouts. On the left is the direct-mapped cache, where blocks 2 and 10 both map to row 2 and tow each other. On the right is the two-by-two layout. Both blocks still map to the same row, but now the row has room for both.", "2.3": "This arrangement needs some vocabulary. A row that holds several blocks is called a <strong>set</strong>, and each seat in it is a <strong>way</strong>. A cache with two ways per set is a <strong>2-way set-associative</strong> cache. And the cache we had before is simply the special case with one way per set.", "2.4": "How does a block find its set? The routing rule changes in only one place. The set comes from the block number: set equals block mod the number of sets. We now have two sets, so block 2 gives 0 and block 10 gives 0. Both land in set 0, and this time that is fine, because set 0 has two seats.", "2.5": "A lookup has one extra step. Go to the set, then compare the tag against every way in it. In hardware that comparison happens in all the ways at once. If some way is valid and its tag matches, that is a hit. If none does, it is a miss.", "2.6": "Now let us redo the recap trace on this cache. The first read is address 16. Before you press on, work out its block, its set and its tag.", "2.7": "16 divided by 8 is block 2. Block 2 mod 2 is set 0. And block 2 divided by 2 is tag 1.", "2.8": "The cache is empty, so this is a miss, and the block goes into the first free way of set 0.", "2.9": "Next comes address 80, the one that threw block 2 out last time. What are its block, set and tag?", "2.10": "80 divided by 8 is block 10. Block 10 mod 2 is 0, so it is set 0 again. And 10 divided by 2 is tag 5.", "2.11": "Set 0 holds tag 1, not tag 5, so this is a miss. But here is the difference: the second way is free, so nothing has to be evicted. In the direct-mapped cache, this was the moment block 2 was thrown out.", "2.12": "Now address 17, which missed last time. It is block 2, set 0, tag 1, and the first way holds tag 1. A hit.", "2.13": "Address 81 is block 10, set 0, tag 5. The second way holds it: a hit.", "2.14": "Address 18 is block 2 again, and block 2 is still there. A hit.", "2.15": "And address 82 is block 10 again: a hit. Four hits out of six, against none before.", "2.16": "Stop and notice what we did. We did not buy any more storage. We only relaxed the rule about where a block may go, and the conflict disappeared. But more seats bring a new question: what happens when all of them are taken?", "3.1": "Here is the new question. When a block arrives and every seat in its set is taken, someone has to leave. We call that block the <strong>victim</strong>. A direct-mapped cache never had to decide anything, because there was exactly one block it could throw out. Now there is a choice, and we need a rule for making it.", "3.2": "To see how the rules differ, go back to our trace, this time reading 16, 80 and 17. After those three reads, set 0 holds tag 1 and tag 5. Each way keeps track of two facts: when it arrived, and when it was last used. Tag 1 arrived at access 1 and was used again at access 3. Tag 5 arrived at access 2 and has not been touched since.", "3.3": "Now the program reads address 144: block 18, set 0, tag 9. Neither way holds tag 9, so it is a miss, and both ways are taken. One of the two blocks has to go. Which one?", "3.4": "There are several rules, and each asks a different question about those same two facts. <strong>Random</strong> picks any way at all. <strong>FIFO</strong>, first in first out, picks the block that arrived first. <strong>LRU</strong>, least recently used, picks the block that was used longest ago. And <strong>NMRU</strong>, not most recently used, picks at random, but never the block that was used last.", "3.5": "Take FIFO first. It looks at the arrival numbers: tag 1 arrived at access 1 and tag 5 at access 2. Tag 1 arrived first, so FIFO evicts tag 1, even though the program touched it only a moment ago.", "3.6": "LRU asks a different question. It looks at the last-used numbers: tag 1 was last used at access 3 and tag 5 at access 2. Tag 5 was used longer ago, so LRU evicts tag 5, and the block the program just touched stays.", "3.7": "NMRU is not allowed to pick tag 1, since tag 1 was used last, so with two ways it has only one choice: tag 5. Random could pick either. The important thing is that FIFO and LRU disagree on this very trace, so the choice of rule can change what happens next. Let us play both out.", "3.8": "First LRU. Tag 5 leaves and tag 9 takes its way, so set 0 now holds tags 1 and 9.", "3.9": "The next read, address 17, asks for tag 1 again, and tag 1 is still there. A hit. Under LRU this trace has two hits.", "3.10": "Now FIFO, on the same accesses. Tag 1 leaves, even though it was just used, and tag 9 takes its way. Set 0 now holds tags 9 and 5.", "3.11": "Then address 17 asks for tag 1, which was evicted a moment ago. A miss. Under FIFO this trace has only one hit.", "3.12": "Same accesses, same cache, two hits against one, and the only thing that changed was the choice of victim. LRU kept the block the program had just used, and that paid off. It is a sensible bet: a block used recently is likely to be used again soon.", "3.13": "That bet is not free. LRU has to remember the order of use in every set. For two ways that is one bit per set, and the bookkeeping grows with more ways. On exams, unless you are told otherwise, assume LRU, and track each set as a short list ordered from least to most recently used.", "4.1": "With placement and eviction settled, we should check that we can still decode an address. Last week an address split into offset, index and tag, and the golden rule was to write the block first. That rule survives. Only one word changes: the index now picks a set, not a row of one block.", "4.2": "Here is the recipe, step by step. Step one, the block: the address divided by the block size. Step two, the offset: the address mod the block size. Neither of these has changed.", "4.3": "Step three, the set: the block mod the number of sets. Step four, the tag: the block divided by the number of sets. These are the same formulas as last week, with rows replaced by sets.", "4.4": "Look at what happens to the bits. The number of index bits is log base two of the number of sets, not of the number of blocks. So as we add ways, there are fewer sets, fewer index bits, and more of the block number is left over for the tag. That is the trade: the tag gets longer.", "4.5": "Let us do a full example. Take 12-bit addresses and a 4-way cache with 2 sets and a block size of 16. First question: how wide is each field of the address?", "4.6": "Start from the right. The offset is log base two of 16, which is 4 bits.", "4.7": "Next, the index. It is log base two of the number of sets, and there are two sets, so the index is 1 bit.", "4.8": "The tag is whatever is left over: 12 minus 1 minus 4, which is 7 bits.", "4.9": "Now a real address, 1234. First the block: 1234 divided by 16 is 77. And the offset is 1234 mod 16, which is 2.", "4.10": "Then the set: 77 mod 2 is 1. And the tag: 77 divided by 2 is 38. So address 1234 goes to set 1, with tag 38.", "4.11": "The last piece is size. Take the size formula from last week and add one factor, the number of ways. The total number of bits is the number of sets, times the number of ways, times the bits in one block. One block costs a valid bit, plus its tag bits, plus its data bits. Exam questions normally ignore the LRU bookkeeping bits unless they ask for them.", "4.12": "For our example, 2 sets times 4 ways is 8 blocks. Each block needs 1 valid bit, 7 tag bits and 128 data bits, because 16 bytes is 128 bits. That is 136 bits a block, and 8 times 136 is 1088 bits in total.", "5.1": "Step back and look at what we have built. Fix the amount of storage: four blocks of 8 bytes, with 12-bit addresses. That total never changes. The one decision left is how to group those four blocks into sets, that is, how many blocks share a set. That number is the number of ways.", "5.2": "There are three groupings. Four sets of one way, two sets of two ways, or one set of four ways. The blocks are the same each time, and only the grouping changes. As the number of ways goes up, the number of sets goes down, there are fewer index bits, and the tag gets longer.", "5.3": "Take the groupings one at a time. Four sets of one way is the direct-mapped cache we already know: two index bits, a seven-bit tag, and one tag comparison per lookup.", "5.4": "Two sets of two ways is the cache we just built. It has one index bit, an eight-bit tag, and two comparisons per lookup, one for each way in the set.", "5.5": "And one set of four ways has no index bits at all, a nine-bit tag, and four comparisons per lookup. This is a <strong>fully associative</strong> cache, the far end of the dial.", "5.6": "At that far end, one set holds everything. A block may go in any seat, so there are zero index bits, and the whole block number is the tag. A fully associative cache never suffers a conflict: the only reason to evict is that every seat is genuinely full.", "5.7": "Here is the vocabulary, in one place. An n-way set-associative cache has n blocks in each row. A direct-mapped cache is the one-way case. A fully associative cache is the other extreme: where a block goes does not depend on its address at all, so it is an n-way cache whose single row is the whole cache.", "5.8": "If fully associative never conflicts, why does anyone build anything else? Because every lookup must compare the tag against every seat at once. Each comparison needs its own circuit and wire, and all of them must finish before the hit can be declared. More ways means more hardware, more energy and a slower hit.", "5.9": "So the dial has a cost at each end. Direct-mapped is fast and cheap but conflict-prone. Fully associative never conflicts but is slow and expensive. Real caches live in the middle, usually between two and eight ways.", "6.1": "Time to test the 2-way cache on a trace we already know. Last week we ran 52, 53, 92, 55, 20, 54, 60, 53, 29 and 28, with a block size of 8 and four blocks, starting empty. The direct-mapped cache got four hits, and its miss at 54 was a conflict. Keep that miss in mind as we run the trace on the 2-way cache, with two sets.", "6.2": "The first read is 52: block 6, set 0, tag 3. The set is empty, so it is a miss.", "6.3": "53 is in the same block as 52, so it is a hit.", "6.4": "92 is block 11, set 1, tag 5. Set 1 is empty, so another miss.", "6.5": "55 is block 6 again, so a hit.", "6.6": "Now 20, which is where last week's trouble began. It is block 2, set 0 again, tag 1. Set 0 holds tag 3. Is there a free way?", "6.7": "There is. It is a miss, but set 0 has a second way free, so nothing is evicted. In the direct-mapped cache, this access threw block 6 out.", "6.8": "And now the access that missed last week: 54. Work out its block, its set and its tag, and decide whether it hits or misses.", "6.9": "54 divided by 8 is block 6, in set 0 with tag 3. Set 0 holds tags 3 and 1.", "6.10": "A hit. Block 6 never left, because block 2 had its own seat. This is the extra hit, and it is exactly the conflict from last week, gone.", "6.11": "Next, 60: block 7, set 1, tag 3. Set 1 holds tag 5 and has a free way, so it is a miss with no eviction.", "6.12": "53 is block 6 again, a hit.", "6.13": "Now 29, the first real test of eviction. It is block 3, set 1, tag 1. Set 1 holds tags 5 and 3, and both ways are taken.", "6.14": "It is a miss, and this time somebody has to leave. Tag 5 was last used at access 3 and tag 3 at access 7, so LRU evicts tag 5, which is block 11.", "6.15": "The last read, 28, is in block 3, which we just loaded: a hit. Five hits out of ten.", "6.16": "Five hits against four, and the extra hit is exactly 54, the conflict. The five misses that remain are all first visits to a block. A fully associative cache also gets five hits: the misses that were left were never about conflicts. That observation deserves a name.", "7.1": "Every cache miss falls into one of three categories, and associativity only helps with one of them. They are called the <strong>three Cs</strong>, and the next three steps take them one at a time.", "7.2": "The first is the <strong>compulsory miss</strong>: the first time a block is touched. The cache cannot have it, because it has never seen it. Only bigger blocks, which bring in neighbours early, reduce these.", "7.3": "The second is the <strong>capacity miss</strong>. The program uses more blocks than the cache can hold, so earlier blocks fall out and are needed again. Only a bigger cache helps.", "7.4": "The third is the <strong>conflict miss</strong>: a block was evicted even though the cache as a whole had space, because of where blocks were allowed to go. This is the one associativity cures.", "7.5": "Now classify last week's misses. 52, 92, 20, 60 and 29 were compulsory, each one a first visit. The miss at 54 was a conflict: block 6 had been in the cache and was towed by block 2, while rows 0 and 1 sat empty. The 2-way cache removed that one miss and nothing else, which is why it gained exactly one hit.", "7.6": "That gives a practical rule for diagnosing a trace. If a re-reference to a block missed while some other row or way was empty, it was a conflict miss.", "8.1": "Now let us practise on two traces of our own. The first uses a 4-way cache with two sets, a block size of 4, and LRU. The reads are 0, 8, 16, 24, 0, 32, 8, 4, 5 and 16. Set is the block mod 2, and tag is the block divided by 2. Keep your eye on set 0.", "8.2": "Address 0 is block 0, set 0, tag 0. The set is empty, so it is a miss.", "8.3": "Address 8 is block 2. Block 2 mod 2 is 0, so it is set 0 again, with tag 1. A miss, and a way is free.", "8.4": "Address 16 is block 4, set 0, tag 2. Another miss, and another free way.", "8.5": "Address 24 is block 6, set 0, tag 3. A miss that takes the last free way. Set 0 is now full, and set 1 has not been touched yet.", "8.6": "Address 0 is block 0 again, and tag 0 is in the set: a hit. It also becomes the most recently used.", "8.7": "Address 32 is block 8, set 0, tag 4, and set 0 is full. Look at the last-used labels. Which tag will LRU evict?", "8.8": "Tag 1 was last used at access 2, the oldest of the four. Tag 0 was refreshed at access 5, so it stays. Tag 1 leaves.", "8.9": "Address 8 is block 2, tag 1, the block we just evicted. A miss, and the oldest block is now tag 2, last used at access 3, so tag 2 leaves.", "8.10": "Address 4 is block 1, which is odd, so it belongs to set 1, with tag 0. Set 1 is empty: a miss.", "8.11": "Address 5 is in the same block as 4, so a hit.", "8.12": "The last read is address 16: block 4, tag 2, which was evicted at access 7. A miss. Two hits out of ten, from a 4-way cache.", "8.13": "Why so few hits with four ways? Five different blocks all mapped to set 0, which has four ways, while set 1 held a single block. Ways are per set, not shared across the cache. Associativity reduces conflicts, but it does not remove them. What would a fully associative cache do with a similar trace?", "8.14": "Let us find out. This cache is fully associative, with four blocks, a block size of 4, and LRU. The reads are 4, 20, 36, 8, 5, 52, 20, 4, 37 and 9. With one set, the tag is the whole block number, and no conflict is possible.", "8.15": "The first four reads are blocks 1, 5, 9 and 2. All different, so all misses, and all four seats fill up.", "8.16": "Address 5 is block 1, which is in the cache: a hit. Block 1 becomes the most recently used.", "8.17": "Address 52 is block 13, and every seat is taken. Which block will LRU evict?", "8.18": "Block 5 was last used at access 2, the oldest, so block 5 leaves. In this cache the tag is the block number, so the label reads tag 5.", "8.19": "Address 20 is block 5, the block just evicted: a miss. The oldest now is block 9, last used at access 3, so block 9 leaves.", "8.20": "Address 4 is block 1, refreshed at access 5: a hit.", "8.21": "Address 37 is block 9, which was evicted at access 7. A miss, and block 2 leaves.", "8.22": "And address 9 is block 2, evicted one access ago: a miss. Two hits out of ten.", "8.23": "Both caches got two hits out of ten, but for different reasons. The 4-way cache missed because five blocks piled into one set: a conflict. The fully associative cache cannot have conflicts. It missed because the trace used more blocks than the cache holds: capacity.", "8.24": "So classify the misses. The first visit to each block is compulsory in both. The re-references that missed in the 4-way cache were conflicts, since set 1 had room. In the fully associative cache the same kind of miss was a capacity miss. Only a bigger cache removes those, not more ways.", "9.1": "We have seen that more ways means fewer misses. Is that always worth it? Fewer misses are only half the story, because the extra comparators slow down every hit. To weigh the two, use last lecture's formula: average time is the cache time plus one minus the hit ratio, times the memory time. Take a memory trip of 60 nanoseconds.", "9.2": "A direct-mapped cache hits in 2 nanoseconds and gets an 80 percent hit ratio on some program. The average is 2 plus 0.2 times 60, which is 14 nanoseconds.", "9.3": "A 4-way cache of the same total size takes 2.2 nanoseconds for a hit, because of the extra comparators and the mux, but it reaches 90 percent. The average is 2.2 plus 0.1 times 60, which is 8.2 nanoseconds. It wins by a wide margin, because a miss costs so much more than a slightly slower hit.", "9.4": "It does not always win. If associativity only moved the hit ratio from 80 to 81 percent, the average would be 13.6 nanoseconds against 14. A slightly slower hit would wipe that gain out, and the chip would be bigger on top.", "9.5": "That is how designers decide: they measure real programs and stop adding ways when the returns shrink. It is why the practical range is two to eight ways, not sixty-four. That finishes the question of where a block lives. The next question is what happens when the processor writes.", "10.1": "So far everything has been about reading. But the processor also executes <code>sw</code>, and that creates an awkward situation. The cache holds a copy of memory, and a store changes one of the two copies. Which one, and when?", "10.2": "Suppose a direct-mapped cache holds the block containing address 20. The cache and RAM agree: address 20 holds 3.", "10.3": "Now a <code>sw</code> writes 5 to address 20. Suppose it updates only the cache. The cache says 5 and RAM still says 3: its copy is <strong>stale</strong>. Nothing is wrong yet, because the processor reads the cache first.", "10.4": "Then another access maps to the same row and evicts the block. The 5 existed only in the cache, and it has just been thrown away. RAM still says 3.", "10.5": "So the next load of address 20 misses, fetches from RAM, and gets the old value. The store has vanished. Writing to the cache alone is a bug waiting for an eviction.", "10.6": "So the cache and RAM have to be reconciled at some point, and the only question is when. There are two answers: right now, which is <strong>write-through</strong>, or later, which is <strong>write-back</strong>.", "10.7": "Take the first answer. With write-through, every store updates the cache and RAM at once. RAM is never stale.", "10.8": "That makes evictions trivial: just drop the block. But there is a price. Every <code>sw</code> pays a trip to memory, which is the cost the cache was built to avoid. Real machines hide some of it with a small <strong>write buffer</strong> that lets the processor carry on while the write drains.", "10.9": "The second answer avoids that price. With write-back, a store updates only the cache, and the row is marked <strong>dirty</strong> with one extra bit, <strong>D</strong>. RAM is allowed to be stale for now. No memory trip yet.", "10.10": "RAM finds out only when a dirty block is evicted. Here a load to address 24 needs the row. The row is dirty, so its value is written to RAM first, and then the row is reused. A clean block would simply be dropped.", "10.11": "Count the difference. A loop that adds to a running total updates the same address a hundred times. Write-through makes a hundred memory writes. Write-back makes one, when the block is finally evicted.", "10.12": "Let us follow one row of a write-back cache through its life, as a state machine. It starts invalid: the valid bit is 0 and there is nothing in it.", "10.13": "A miss loads a block into the row, and the row is now clean: valid, and identical to RAM.", "10.14": "A store that hits writes the cache only, and the row becomes dirty. More stores keep it dirty.", "10.15": "Now the row has to be reused. If it is clean, that costs nothing: RAM already has the data, so the row simply goes back to invalid, or is reused.", "10.16": "If it is dirty, the block is written back to RAM first, and only then can the row be reused. That is the only case where an eviction touches RAM.", "10.17": "Side by side, then. Write-through sends a store hit to the cache and RAM, needs no extra bit, and evicting a block means just dropping it.", "10.18": "Write-back sends a store hit to the cache only, needs a dirty bit, and must write a dirty block to RAM before evicting it. The hit and miss logic does not change: a hit still needs a valid bit and matching tags, and the dirty bit only matters on eviction. That is why almost every real cache above L1 is write-back.", "10.19": "That settles stores that hit. One case is left: a <strong>write miss</strong>, a store to an address whose block is not in the cache. <strong>Write-allocate</strong> fetches the block into the cache first, then writes to it as if it were a hit. It bets that you will touch nearby addresses soon. <strong>Write-around</strong> skips the cache and writes straight to RAM. It bets the data will not be touched again soon.", "10.20": "The two choices pair up naturally. Write-back usually goes with write-allocate, because the block has to come into the cache so the dirty bit can keep track of it.", "10.21": "Write-through usually goes with write-around. RAM is being written anyway, so caching the block adds nothing.", "10.22": "Put the hit policy and the miss policy together and there are four combinations. Write-through with write-allocate: a hit writes the cache and RAM, and a miss loads the block first, then writes both. Write-through with write-around: a hit writes the cache and RAM, and a miss writes RAM only.", "10.23": "Then the write-back pair. Write-back with write-around: a hit writes the cache and marks it dirty, and a miss writes RAM only. Write-back with write-allocate: a hit writes the cache and marks it dirty, and a miss loads the block, writes it, and marks it dirty. This last one is the usual pairing.", "10.24": "So the write behaviour of a cache has two parts, one for hits and one for misses, and exams ask for both. For example: write-back with write-allocate, or write-through with write-around.", "10.25": "Let us finish with a worked sequence that uses everything. The cache has four rows and a block size of 1, with write-back and write-allocate, and starts empty. Register 7 holds 20, register 1 holds 5, RAM at address 20 holds 3, and RAM at address 24 holds 9.", "10.26": "The first load misses, and address 20 is loaded into row 0, since 20 mod 4 is 0. The row is clean.", "10.27": "Next the store. It is a write hit: row 0 gets the new value and is marked dirty. RAM is untouched.", "10.28": "A load of the same address is a read hit, and it returns 5, the new value. The cache is doing its job.", "10.29": "Now a load of address 24, which also maps to row 0, since 24 mod 4 is 0. It is a miss, and the row is dirty, so the dirty block is first written back to RAM.", "10.30": "Only then is address 24 loaded into row 0, and the row is clean again.", "10.31": "Finally, a load of address 20 misses and fetches from RAM, which now holds the updated 5. Nothing was lost, which is the whole point of the dirty bit.", "11.1": "Everything we have built so far is a single cache between the processor and RAM. Real machines do not stop there. They stack several caches, and that stack is called a <strong>cache hierarchy</strong>.", "11.2": "The first cache, <strong>L1</strong>, is small and very fast. Behind it sits a second cache, <strong>L2</strong>, which is bigger and slower. A miss in L1 goes to L2, and only a miss in L2 goes to RAM.", "11.3": "Many machines add a third level, <strong>L3</strong>. The labels show sizes from a typical laptop: 32 kilobytes for L1, 256 for L2 and 3 megabytes for L3. Each level is bigger and slower than the one above it, and each one backs it up.", "11.4": "Follow a read through the levels. A read that misses in L1 asks L2. If L2 misses too, it asks L3, and then RAM. The block is copied into the levels it passes on the way back, so the next read of it hits in L1.", "11.5": "Now the writes. Suppose every level is write-back. A store changes L1 only, and marks the block dirty. Nothing else knows.", "11.6": "Later that dirty block is evicted from L1. It is written into L2, and L2 marks it dirty. L1 only ever talks to the level below it.", "11.7": "When the block is evicted from L2, it moves to L3, and eventually to RAM. A dirty block moves down one level at a time.", "11.8": "With write-through, the story is shorter and slower. A store is written to every cache and to memory at once. Everything stays current, and everything pays the cost of the slowest write.", "11.9": "Students ask: if L1 is so fast, why not make it bigger? Price is one limit. Faster caches need more read and write ports, which means more routing and a higher manufacturing cost. Caches that are used less often do not need that. There is a trade-off between speed and size: you can choose your priorities, but you cannot raise both without limit.", "11.10": "Distance is another limit. A signal takes time to cross the chip. A small cache can sit right next to the processor, but if L1 were larger, not all of it could be that close, and its hit time would grow. So L1 stays small, and L2 and L3 sit farther away.", "11.11": "Designers also choose how the levels relate to each other. In a strictly <strong>inclusive</strong> hierarchy, every block in L1 is also in L2. The advantage is that data evicted from L1 is still in L2, so fewer misses go all the way out.", "11.12": "In a strictly <strong>exclusive</strong> hierarchy it is the opposite: a block is in L1 or in L2, never both. The advantage is that the two levels together hold more distinct data.", "11.13": "And in a <strong>non-exclusive</strong> hierarchy, a block in L1 may also be in L2, with no strict rule. The advantage is that larger caches can use larger blocks and smaller tags.", "11.14": "Is a second level worth it? Let us measure. The average access time is the L1 time, plus the L1 miss rate times the cost of a miss. And the cost of an L1 miss is the L2 time, plus the share of those that also miss L2, called the <strong>local miss rate</strong>, times the RAM time. Take L1 at 1 nanosecond, L2 at 10, and RAM at 100. L1 misses 4 percent of the time, and L2 misses a quarter of what reaches it.", "11.15": "Without an L2, every L1 miss goes to RAM: 1 plus 0.04 times 100, which is 5 nanoseconds.", "11.16": "With an L2, a miss in L1 costs 10 plus a quarter of 100, which is 35. So the average is 1 plus 0.04 times 35, which is 2.4 nanoseconds, a bit more than twice as fast.", "11.17": "The same idea in cycles, which is how the pipeline sees it. Take a base CPI of 1 and a 2 gigahertz clock, so one cycle is half a nanosecond. RAM costs 100 nanoseconds, which is 200 cycles, and L2 costs 10 nanoseconds, which is 20 cycles. Four percent of instructions miss L1, and one percent go all the way to RAM.", "11.18": "With only L1, every miss costs 200 cycles. The effective CPI is 1 plus 0.04 times 200, which is 9.", "11.19": "With L2, four percent of instructions pay 20 cycles and one percent pay 200. That is 1 plus 0.8 plus 2, a CPI of 3.8. The second level cut the cost of memory by more than half.", "12.1": "There is one more kind of memory access to account for. <code>lw</code> and <code>sw</code> are not the only instructions that touch memory: every instruction has to be read from memory in the fetch stage. Instructions are fetched very often, so caching them gives a large speed-up.", "12.2": "Code is very friendly to caches. A loop body is fetched over and over, which is temporal locality. And the next instruction is usually at the next address, which is spatial locality, so one block brings in several instructions.", "12.3": "So where do the instructions go? The simplest design is one <strong>shared cache</strong> that holds both instructions and data. The fetch stage and the memory stage both go through it.", "12.4": "That runs into a problem we have already met. In a pipeline, IF and MEM happen in the same cycle, so both want the cache at once. It is the structural hazard from earlier in the lecture, now with a cache. And code and data can also evict each other's blocks.", "12.5": "The other design is a <strong>split cache</strong>: two caches. IF reads from an <strong>instruction cache</strong>.", "12.6": "And MEM reads and writes a <strong>data cache</strong>. The two stages never compete for the same cache, which is exactly the assumption we made when we said the E20 has no structural hazard in memory.", "12.7": "Real machines combine this with the hierarchy. L1 is split into an instruction cache and a data cache, and L2 and below are shared. A typical laptop has a 32 kilobyte L1 data cache and a 32 kilobyte L1 instruction cache.", "12.8": "Which design is better? The argument for separate caches is that IF and MEM rarely access the same address, so splitting avoids conflicts and needless evictions between code and data.", "12.9": "The argument for a shared cache is that it is easier to design and cheaper to manufacture, and the space goes to whichever of code or data needs it at the moment. That ends our tour of caches. Now for the two problems we promised to come back to.", "13.1": "Let us go back to what we pretended away. With caches, the processor sees something close to a fast memory most of the time. But we have quietly assumed two things: that memory is as big as the addresses, and that the program owns all of it. Neither is true.", "13.2": "Think about what that means. What if you want to run a program that needs more memory than you have? What if you want to run ten programs that together need more memory than you have? And what if two different programs want to store something at the same address?", "13.3": "Take that last question. Program A stores 7 at address 100.", "13.4": "Program B, written by someone else, stores 9 at address 100. Both programs are correct. But there is only one cell at address 100, and it can hold one value.", "13.5": "There are two more questions, about protection. How do we protect one program's data from being read or written by another program, on purpose or by accident? And how do we protect the operating system's data in the same way?", "13.6": "The answer is the same idea we used on blocks and rows, one level up: put a layer between the address a program uses and the cell it actually gets, and let that layer decide. Programs use <strong>virtual addresses</strong>. The hardware and the operating system map them to physical cells. To the program it looks like a large, private, continuous memory. This layer is called <strong>virtual memory</strong>.", "13.7": "That layer buys four things: protection and isolation between programs, efficient use of RAM, programs larger than RAM backed by disk, and simpler memory allocation for developers. The rest of the lecture is how it works.", "14.1": "Start with a definition. An <strong>address space</strong> is the set of addresses, and their cells, that are available to a program. On the E20 an address is 16 bits, so there are 2 to the 16 cells. On a 32-bit machine, 2 to the 32, which is 4 GiB. On a 64-bit machine, 2 to the 64.", "14.2": "Now two kinds of address. A <strong>virtual address</strong> is what the application sees, and what <code>lw</code> and <code>sw</code> use. A <strong>physical address</strong> is what the hardware and the operating system use to reach RAM. There can be more virtual addresses than there is RAM.", "14.3": "We do not map one address at a time, that would be far too much bookkeeping. We divide the address space, both virtual and physical, into <strong>pages</strong>. A typical size is 4 kilobytes, 4096 bytes. A physical page is also called a <strong>frame</strong>.", "14.4": "For the examples we use a toy system with 8-byte pages. There are eight virtual pages on the left, covering addresses 0 to 63, and four physical frames on the right, covering 0 to 31. So there is more virtual memory than RAM.", "14.5": "The operating system decides which frame holds which page. Right now pages 0, 1, 3 and 5 are in RAM, in frames 2, 0, 3 and 1.", "14.6": "Pages 2 and 6 are not in RAM right now: they sit on disk. Pages 4 and 7 do not exist at all. A page does not have to sit next to its neighbours, which is what makes this more flexible than a simple offset.", "14.7": "To translate an address, cut it in two. The top bits are the <strong>page number</strong>, and the low bits are the offset within the page. Translation replaces the page number with a frame number. The offset stays exactly the same.", "14.8": "These are formulas you already know from blocks. The page number is the address divided by the page size, and the offset is the address mod the page size.", "14.9": "With real numbers: with 4 kilobyte pages, a 32-bit virtual address has a 20-bit page number and a 12-bit offset. With a 20-bit physical address there is an 8-bit frame number. A table, the <strong>page table</strong>, maps one to the other. That table is next.", "15.1": "The page table has one entry for every virtual page. Each entry says whether the page is in RAM, whether it has been written to, and which frame holds it. For now watch two columns: the valid bit, V, and the frame.", "15.2": "So a page table is just an array, indexed by the virtual page number. The operating system creates and manages it. Not every virtual page has a frame, so each entry has a valid bit that is checked before every lookup.", "15.3": "Let us translate a virtual address: 13. First the page and the offset. Work them out before the next step.", "15.4": "13 divided by 8 is page 1, and 13 mod 8 is offset 5.", "15.5": "Now look up entry 1 in the page table. V is 1, so the page is in RAM, and the frame is 0.", "15.6": "The physical address is the frame number times the page size, plus the offset: 0 times 8 plus 5, which is 5.", "15.7": "Try another, 44. That is page 5, offset 4. Entry 5 is valid, and the frame is 1.", "15.8": "The physical address is 1 times 8 plus 4, which is 12.", "15.9": "And one that goes wrong: 18. Page 2, offset 2. Entry 2 has V equal to 0. The page is not in RAM.", "15.10": "That is a <strong>page fault</strong>. The hardware cannot finish the memory access, so it signals the operating system, which has to decide what to do. We come back to that in a moment.", "15.11": "One more case. 34 is page 4, and its entry is invalid too. But this page is not on disk either. It was never allocated to this program. That is not a fault to recover from, it is an error, and the program is stopped.", "15.12": "That is the whole translation, in four lines. The offset is the address mod the page size. The page number is the address divided by the page size. The frame comes from the page table, if the valid bit is set. And the physical address is the frame times the page size plus the offset.", "16.1": "Now what happens on a page fault? Remember that anything that does not fit in RAM is stored on disk. The <strong>swapping</strong> mechanism hopes to give us the size of the disk with the speed of memory. Disk is very slow, so the whole design is built around avoiding trips to it.", "16.2": "Here is the logic of every memory access, as a flow chart. It starts with the access itself.", "16.3": "The first question: is the page valid? That is the valid bit in the page table.", "16.4": "If it is valid, use the physical page and carry on. This is the normal case, and it is by far the most common.", "16.5": "If not, that is a page fault, and the operating system takes over. Its first question: is the page on disk?", "16.6": "If it is on disk, the OS loads the page into memory, updates the page table, and resumes the program. The program never knows it happened.", "16.7": "If it is not on disk either, there is nothing to load. The access was illegal: a <strong>segmentation fault</strong>.", "16.8": "Let us follow the case in the middle. Back to address 18, page 2, which is on disk. To load it we need a frame, and all four are in use. Something has to leave.", "16.9": "That choice should sound familiar. The OS chooses a seldom-used page to evict, the same idea as LRU in a cache. If the page has been modified, it has to be written to disk first.", "16.10": "Say the OS picks page 5, and page 5 was not modified. Its copy on disk is still good, so it is simply dropped. Page 2 loads into frame 1, and the table is updated: page 5 invalid, page 2 valid with frame 1.", "16.11": "The access is retried, and this time it works: frame 1 times 8 plus 2 is 10.", "16.12": "How did the OS know page 5 was safe to drop? That is what the dirty bit is for. Every page starts with D equal to 0. When the program writes to the page, the hardware sets D to 1. When the OS evicts a page, it writes it to disk only if D is 1.", "16.13": "A second example, this time with a dirty victim. Address 50 is page 6, offset 2, and page 6 is on disk. The OS picks page 3 as the victim, and page 3 has D equal to 1.", "16.14": "Page 3 is dirty, so it is written to disk first. Only then is its frame free.", "16.15": "Then page 6 is loaded into frame 3, the table is updated, and the access is retried. The physical address is 3 times 8 plus 2, which is 26.", "16.16": "By now this should sound familiar, and that is no accident. A block is a page. A miss is a page fault. Replacement is LRU-like.", "16.17": "A page may go in any frame, so placement is fully associative. Writes are write-back, tracked by a dirty bit. The only difference is what sits behind it: disk instead of RAM. Memory is a write-back cache of the disk.", "16.18": "One more bit protects the system. To stop an application from changing the operating system's data, pages can carry a <strong>protect bit</strong>. A page marked protected cannot be written. A store to it is refused by the hardware, which signals the operating system.", "16.19": "Now go back to the questions we started with. A program bigger than RAM works, because pages swap to disk. Two programs can use the same virtual address, because each has its own page table mapping it to different frames. And the valid and protect bits keep programs out of each other's memory and out of the operating system's. But this solution has costs of its own.", "17.1": "The first cost is size. Consider a system with 32-bit virtual addresses, 32-bit physical addresses and 4 kilobyte pages. How big is the page table, including the extra bits?", "17.2": "Pages of 4 kilobytes are 2 to the 12 bytes, so the offset is 12 bits. That leaves 20 bits of page number in both addresses.", "17.3": "There is one entry for every virtual page, and there are 2 to the 20 of them: over a million entries.", "17.4": "Each entry holds a 20-bit frame number, plus the dirty, protect and valid bits: 23 bits.", "17.5": "The total is 2 to the 20 times 23, which is about 24 million bits, or just over 3 megabytes. We do not store the page number itself, because it is the index.", "17.6": "And that is for one program. Each process has its own page table, so it adds up. Worse, most programs use only a small part of their address space, so most of that table is mostly empty.", "17.7": "The second cost is speed. To translate an address, the hardware has to read the page table, and the page table lives in RAM. That is one trip to memory.", "17.8": "Only then can it make the real access. Every memory access now takes two round trips to memory. We have just cut the speed of memory in half.", "17.9": "Both problems have answers we already know. Too big: swap parts of the table out, with a <strong>hierarchy of page tables</strong>, much as we had a hierarchy of caches. Too slow: cache the translations, in the <strong>translation lookaside buffer</strong>, or <strong>TLB</strong>.", "17.10": "Take the speed problem first. The TLB sits between the processor and the page table. On a hit, it already knows the frame, so the page table is skipped and only the real access goes to RAM.", "17.11": "On a miss, the hardware walks the page table, as before, and keeps the answer in the TLB for next time.", "17.12": "So the TLB is a cache of the page table. The tag is the virtual page, and the value stored is the physical page, plus the valid, dirty and protect bits. It is consulted before the page table, and it is usually fully associative, which is why we spent time on what that means.", "17.13": "Now the size problem. Cut the 20-bit page number in two. The first 10 bits index a top-level table, whose entries point to second-level tables. The second 10 bits index the second-level table, which gives the frame. This is a <strong>two-level page table</strong>.", "17.14": "Why does this save space? Most programs use a small part of their address space, so most second-level tables never need to exist. An unused region costs one entry in the top-level table. The price is more steps in a lookup, which is why the TLB matters even more.", "17.15": "Modern 64-bit Intel systems use the same idea with four or five levels. Each level has a 9-bit index. Four levels allow a 48-bit virtual address, an address space of 256 tebibytes. Five levels allow 57 bits, 128 pebibytes.", "17.16": "To sum up. Virtual memory maps virtual pages to frames with a page table, with valid, dirty and protect bits. A page fault sends the operating system to bring the page from disk. The TLB caches translations so that most accesses skip the table. And multi-level tables mean we only pay for the address space a program actually uses."};
  scenes.forEach((sc) => { const p = sc.num === "" ? "0" : sc.num; sc.steps.forEach((s, i) => { const o = NARR_OVR[p + "." + (i + 1)]; if (o) s.narrate = o; }); });
  const $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const foot = txt(svg, 575, 392, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

  scenes.forEach((sc) => {
    sc.g = E("g", {}, svg);
    sc.g.style.display = "none";
    sc.r = sc.build(sc.g) || {};
    foot.parentNode.appendChild(foot);
  });
  $("sec-total").textContent = scenes.length - scenes.filter((x) => x.front).length;

  // si: section, ti: step, ph: 0 = question showing (diagram as before), 1 = answered
  const off = scenes.filter((x) => x.front).length;   // title slides don't count as sections
  let si = 0, ti = 0, ph = 1, shownScene = -1;
  const asks = (i, k) => !!scenes[i].steps[k].q;
  const startPh = (i, k) => (asks(i, k) && k > 0 ? 0 : 1);

  function readHash() {
    const m = location.hash.match(/^#(\d+)\.(\d+)(q?)$/);
    if (!m) { ph = startPh(si, ti); return; }
    const a = Number(m[1]) - 1 + off, b = Number(m[2]) - 1;
    if (a >= 0 && a < scenes.length) { si = a; ti = Math.max(0, Math.min(scenes[a].steps.length - 1, b)); }
    ph = m[3] && asks(si, ti) && ti > 0 ? 0 : 1;
  }

  function buildChips(sc) {
    const box = $("chips");
    box.innerHTML = "";
    sc.chips.forEach((label) => {
      const d = document.createElement("div");
      d.className = "stp";
      d.textContent = label;
      box.appendChild(d);
    });
  }

  function render() {
    const sc = scenes[si], s = sc.steps[ti];
    if (shownScene !== si) {
      scenes.forEach((x, k) => { x.g.style.display = k === si ? "inline" : "none"; });
      $("num").textContent = sc.num;
      $("title").textContent = sc.title;
      $("subtitle").textContent = sc.subtitle;
      document.querySelector(".stage").style.visibility = sc.front ? "hidden" : "";
      $("subtitle").style.visibility = sc.front ? "hidden" : "";
      $("sec-wrap").style.display = sc.front ? "none" : "";
      $("foot-left").textContent = sc.title;
      buildChips(sc);
      shownScene = si;
    }
    const asking = ph === 0 && !!s.q && ti > 0;
    // while a question is showing, the diagram stays exactly as the previous step left it
    sc.render(asking ? sc.steps[ti - 1] : s, sc.r, ti);
    foot.textContent = asking ? "" : (s.foot || "");
    const qm = '<span class="qm">Q</span>';
    $("narration").innerHTML = asking ? '<div class="q big">' + qm + s.q + '</div>'
      : (s.q ? '<div class="q small">' + qm + s.q + '</div>' : "") + ((!fullText && s.cap) || s.narrate);
    $("sec-n").textContent = si - off + 1;
    $("step-n").textContent = ti + 1;
    $("step-total").textContent = sc.steps.length;
    document.querySelectorAll(".stp").forEach((chip, k) => {
      const n = k + 1;
      chip.classList.remove("active", "done");
      if (!s.chip) return;
      if (s.chip === n) chip.classList.add("active");
      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "n" || e.key === "N") { fullText = !fullText; render(); return; }
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  let fullText = false;
  window.DECK_STEPS = scenes.map(function (sc) { return { num: sc.num, title: sc.title, front: !!sc.front, steps: sc.steps.map(function (s) { return Object.assign({}, s); }) }; });
  if (location.search.indexOf('dump') >= 0) { var pre = document.createElement('pre'); pre.id = 'dump'; pre.textContent = JSON.stringify(window.DECK_STEPS); document.body.innerHTML = ''; document.body.appendChild(pre); return; }
  readHash();
  render();
})();
</script>
