<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | Direct-Mapped Caching | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* Caching half of lecture 10, on the 07 deck's step engine. Arrow keys step, shift + arrow
     jumps a section. Narrative form: each beat states the problem it has just run into, then the
     fix. Figure scenes show the lecture's SVGs (fig/); table scenes are drawn here. Open with #5.3. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 10px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 12px;
    font-size: 27px;
    line-height: 1.3;
    min-height: 44px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 23px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">7</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">
    <span class="num" id="num"></span>
    <h1 id="title">Direct-Mapped Caching</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="372"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">Direct-Mapped Caching</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenes.push(def); }

  // ================= 10 caching deck =================
  // ---------- helpers for this deck ----------
  const ASSET = "fig/";
  function figScene(cfg) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { imgs: {} };
        cfg.steps.forEach((s) => {
          if (!s.img || r.imgs[s.img]) return;
          const im = E("image", { x: 0, y: 0, width: 1150, height: 400, preserveAspectRatio: "xMidYMid meet" }, g);
          im.setAttributeNS("http://www.w3.org/1999/xlink", "href", ASSET + s.img);
          im.setAttribute("href", ASSET + s.img);
          im.style.opacity = 0;
          r.imgs[s.img] = im;
        });
        return r;
      },
      render(s, r) { for (const k in r.imgs) vis(r.imgs[k], k === s.img); },
    };
  }
  // table scene: cols = [{h, x, anchor, mono, w}], rows = arrays of strings; step: rows = how many rows are showing, hl = highlighted row indices
  function tableScene(cfg) {
    const RH = cfg.rh || 34, Y0 = cfg.y0 || 26, FS = cfg.fs || 15;
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { rows: [], bgs: [] };
        const W = cfg.cols[cfg.cols.length - 1].x + cfg.cols[cfg.cols.length - 1].w + 20 - cfg.cols[0].x;
        cfg.cols.forEach((c) => txt(g, c.x, Y0 - 8, c.h, { size: 12, weight: 700, fill: C.purple, ls: 1.5, anchor: c.anchor || "start" }));
        ln(g, cfg.cols[0].x - 10, Y0, cfg.cols[0].x - 10 + W, Y0, { stroke: C.purple, sw: 2 });
        cfg.rows.forEach((row, i) => {
          const gg = grp(g, 0); r.rows.push(gg);
          const y = Y0 + i * RH;
          r.bgs.push(rect(gg, cfg.cols[0].x - 10, y + 3, W, RH - 4, { rx: 6, fill: "none" }));
          row.forEach((cell, ci) => {
            const c = cfg.cols[ci];
            txt(gg, c.x, y + RH / 2 + 5, cell, { pre: true, size: c.size || FS, mono: !!c.mono, weight: c.bold ? 700 : 400, fill: c.bold ? C.purple : C.ink, anchor: c.anchor || "start" });
          });
        });
        return r;
      },
      render(s, r) {
        const n = s.rows === undefined ? cfg.rows.length : s.rows, hl = s.hl || [];
        r.rows.forEach((gg, i) => vis(gg, i < n));
        r.bgs.forEach((b, i) => b.setAttribute("fill", hl.indexOf(i) >= 0 ? C.t2 : "none"));
      },
    };
  }


  function mixScene(cfg, subs) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { subs: {}, gs: {} };
        for (const k in subs) { const gg = grp(g, 0); r.gs[k] = gg; r.subs[k] = subs[k].build(gg); }
        return r;
      },
      render(s, r) {
        for (const k in subs) { vis(r.gs[k], s.sub === k); if (s.sub === k) subs[k].render(s, r.subs[k]); }
      },
    };
  }
  const tb = (c) => tableScene(Object.assign({ steps: [{}] }, c));
  const fg = (imgs) => figScene({ steps: imgs.map((i) => ({ img: i })) });

  // ================= Title slide =================
  (function () {
    const ROUTE = ["The Memory Wall", "Where Does a Cell Go?", "Blocks: Locality Is a Bet", "Decoding an Address",
                   "Tracing a Cache", "Sizing a Cache", "What a Cache Is Worth"];
    scene({
      front: true, num: "", title: "Direct-Mapped Caching", subtitle: "", chips: [],
      steps: [
        { view: "title", foot: "",
          narrate: "A student writing a paper keeps the books they need on the desk, because the library across campus is a long walk. Every processor has the same problem: memory is a very long walk away. Today we build the <strong>desk</strong>: a small, fast cache between the CPU and RAM, and we work out exactly where each memory cell goes in it." },
        { view: "route", foot: "seven sections, one running example",
          narrate: "We build the cache the way an engineer would: make the dumbest thing that could work, watch it break, fix the break. Then we trace one by hand, because tracing is the skill that gets tested. Here is the route." },
      ],
      build(g) {
        const r = {};
        r.title = grp(g, 1);
        rect(r.title, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
        txt(r.title, 575, 104, "CS-UY 2214  |  WEEK IX", { size: 15, weight: 700, fill: C.red, anchor: "middle", ls: 2 });
        txt(r.title, 575, 184, "Direct-Mapped Caching", { size: 56, weight: 700, fill: "#171715", anchor: "middle" });
        rect(r.title, 505, 210, 140, 6, { rx: 3, fill: C.accent });
        txt(r.title, 575, 258, "A small, fast desk for a huge, slow library", { size: 22, italic: true, fill: C.grey, anchor: "middle" });
        txt(r.title, 575, 312, "Computer Architecture and Organization", { size: 14, fill: C.lgrey, anchor: "middle", ls: 1 });
        r.route = grp(g, 0);
        txt(r.route, 575, 40, "TODAY'S ROUTE", { size: 13, weight: 700, fill: C.purple, anchor: "middle", ls: 2 });
        ROUTE.forEach((name, i) => {
          const col = i < 4 ? 0 : 1, row = col === 0 ? i : i - 4;
          const x = 110 + col * 480, y = 80 + row * 62;
          rect(r.route, x, y, 450, 50, { rx: 12, fill: C.white, stroke: C.purple, sw: 4 });
          circ(r.route, x + 28, y + 25, 14, { fill: C.purple });
          txt(r.route, x + 28, y + 30, String(i + 1), { size: 14, weight: 700, fill: C.white, anchor: "middle" });
          txt(r.route, x + 54, y + 32, name, { size: 17, weight: 700, fill: C.ink });
        });
        txt(r.route, 575, 372, "1 to 3: why, and the design   |   4 to 5: decode and trace   |   6 to 7: size and worth", { size: 13, italic: true, fill: C.grey, anchor: "middle" });
        return r;
      },
      render(s, r) { vis(r.title, s.view === "title"); vis(r.route, s.view === "route"); },
    });
  })();

  // ================= 1 The Memory Wall =================
  const trn = (el, ms) => { el.style.transition = "opacity " + ms + "ms, fill " + ms + "ms, stroke " + ms + "ms"; return el; };
  const growX = (el, ms) => { el.style.transformBox = "fill-box"; el.style.transformOrigin = "0% 50%"; el.style.transform = "scaleX(0)"; el.style.transition = "transform " + ms + "ms ease, opacity 0.3s"; return el; };
  const PC5 = ["#e2cdf2", "#d9e8fb", "#fbe9ea", "#e4f3e1", "#fff1cf"];

  // 1: the memory hierarchy as bars on a log scale: every step is about ten times slower
  const HIER = [["SRAM (cache)", "~1 ns", "~$10,000 / GB", 1], ["DRAM (main memory)", "10 to 50 ns", "~$10 / GB", 30], ["SSD", "100,000 ns", "~$1 / GB", 1e5], ["HDD", "10,000,000 ns", "~$0.1 / GB", 1e7]];
  const hierSub = {
    build(g) {
      const r = { bars: [] };
      txt(g, 575, 32, "ACCESS TIME, ON A LOG SCALE: EACH TICK IS 10 TIMES SLOWER", { size: 13, weight: 700, fill: C.grey, ls: 2, anchor: "middle" });
      HIER.forEach(([nm, time, price, ns], i) => {
        const y = 66 + i * 78, w = 60 + 95 * Math.log10(ns);
        txt(g, 30, y + 36, nm, { size: 20, weight: 700, fill: C.purple });
        const b = growX(grp(g, 1), 700);
        rect(b, 270, y, w, 54, { rx: 10, fill: PC5[i], stroke: C.purple, sw: 3 });
        txt(b, 270 + w + 14, y + 25, time, { size: 20, weight: 700, mono: true, fill: C.ink });
        txt(b, 270 + w + 14, y + 47, price, { size: 15, fill: C.grey });
        r.bars.push(b);
      });
      txt(g, 575, 384, "the fast technology is small and expensive; the slow one is huge and cheap", { size: 15, italic: true, fill: C.grey, anchor: "middle" });
      return r;
    },
    render(s, r) { r.bars.forEach((b, i) => { b.style.transitionDelay = (s.on ? 0.25 * i : 0) + "s"; b.style.transform = s.on ? "scaleX(1)" : "scaleX(0)"; }); },
  };

  // 1.3: the first lw misses, goes to RAM and the cache keeps a copy; the second lw hits
  const hitSub = {
    build(g) { return { mg: grp(g, 1) }; },
    render(s, r) {
      while (r.mg.firstChild) r.mg.removeChild(r.mg.firstChild);
      const g = r.mg, st = s.hit || 0, GREEN = "#2e7d32";
      const CX = 40, CW = 170, KX = 470, KW = 200, RX = 900, RW = 210;
      const second = st >= 4;
      txt(g, 575, 40, second ? "the second lw $1, 5($0)" : "the first lw $1, 5($0)", { size: 22, weight: 700, italic: true, fill: C.grey, anchor: "middle" });
      rect(g, CX, 130, CW, 120, { rx: 14, fill: C.t1, stroke: C.purple, sw: 5 });
      txt(g, CX + CW / 2, 200, "CPU", { size: 28, weight: 700, fill: C.purple, anchor: "middle" });
      const hot = st === 4 || st === 5;
      rect(g, KX, 130, KW, 120, { rx: 14, fill: hot ? "#e4f3e1" : C.t2, stroke: hot ? GREEN : C.red, sw: 5 });
      txt(g, KX + KW / 2, 160, "cache", { size: 24, weight: 700, fill: hot ? GREEN : C.red, anchor: "middle" });
      const stored = st >= 3;
      rect(g, KX + 25, 180, KW - 50, 52, { rx: 8, fill: C.white, stroke: stored ? (hot ? GREEN : C.purple) : C.lgrey, sw: 3, dash: stored ? null : "6 4" });
      txt(g, KX + KW / 2, 214, stored ? "5 → 42" : "empty", { size: stored ? 24 : 18, weight: 700, mono: stored, fill: stored ? C.ink : C.grey, anchor: "middle" });
      rect(g, RX, 110, RW, 160, { rx: 14, fill: C.t1, stroke: C.purple, sw: 5 });
      txt(g, RX + RW / 2, 160, "RAM", { size: 28, weight: 700, fill: C.purple, anchor: "middle" });
      txt(g, RX + RW / 2, 200, "ram[5] = 42", { size: 22, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
      const line = (x1, x2, col, w) => { path(g, "M" + x1 + " 190 L" + x2 + " 190", { stroke: col, sw: w }); arrowhead(g, x2, 190, "r", col); };
      line(CX + CW + 6, KX - 6, C.ink, 4); line(KX + KW + 6, RX - 6, C.ink, 4);
      txt(g, (CX + CW + KX) / 2, 176, "about 1 ns", { size: 18, weight: 700, fill: C.ink, anchor: "middle" });
      txt(g, (KX + KW + RX) / 2, 176, "about 100 ns", { size: 18, weight: 700, fill: C.red, anchor: "middle" });
      // the request token
      const pos = { 0: CX + CW / 2, 1: KX + KW / 2, 2: RX + RW / 2, 3: CX + CW / 2, 4: KX + KW / 2, 5: KX + KW / 2 }[st];
      const tok = (x, y, label, col) => { rect(g, x - 52, y - 20, 104, 40, { rx: 20, fill: col, stroke: C.white, sw: 3 }); txt(g, x, y + 7, label, { size: 19, weight: 700, mono: true, fill: C.white, anchor: "middle" }); };
      const label = { 0: "lw 5", 1: "lw 5", 2: "lw 5", 3: "42", 4: "lw 5", 5: "42" }[st];
      tok(pos, 294, label, st === 3 || st === 5 ? GREEN : C.red);
      const note = { 0: "the CPU asks the cache first", 1: "empty: a miss", 2: "the long trip: RAM answers 42", 3: "the CPU gets 42, and the cache keeps a copy", 4: "found it: a hit, and RAM never hears about it", 5: "found it: a hit, and RAM never hears about it" }[st];
      txt(g, 575, 338, note, { size: 22, weight: 700, fill: st >= 4 || st === 3 ? GREEN : C.red, anchor: "middle" });
      if (st === 5) {
        for (let i = 0; i < 10; i++) {
          rect(g, 335 + i * 48, 352, 42, 20, { rx: 6, fill: i === 6 ? C.t2 : "#e4f3e1", stroke: i === 6 ? C.red : GREEN, sw: 2 });
        }
        txt(g, 575, 394, "9 hits out of 10 accesses: hit ratio 90%", { size: 20, weight: 700, fill: C.ink, anchor: "middle" });
      }
    },
  };
  // 1.4: a cache as big as RAM would just be RAM; a real one holds a sliver; three questions follow
  const sliverSub = {
    build(g) { return { mg: grp(g, 1) }; },
    render(s, r) {
      while (r.mg.firstChild) r.mg.removeChild(r.mg.firstChild);
      const g = r.mg, st = s.sl || 0;
      const grid = (x, y, w, h, nx, ny, fill, stroke) => {
        rect(g, x, y, w, h, { rx: 12, fill: fill, stroke: stroke, sw: 5 });
        for (let i = 1; i < nx; i++) ln(g, x + i * w / nx, y + 6, x + i * w / nx, y + h - 6, { stroke: stroke, sw: 1 });
        for (let j = 1; j < ny; j++) ln(g, x + 6, y + j * h / ny, x + w - 6, y + j * h / ny, { stroke: stroke, sw: 1 });
      };
      if (st === 0) {
        txt(g, 575, 40, "what if the cache could hold everything?", { size: 22, weight: 700, italic: true, fill: C.grey, anchor: "middle" });
        grid(60, 70, 460, 200, 12, 5, C.t2, C.red);
        txt(g, 290, 302, "a cache as big as RAM", { size: 22, weight: 700, fill: C.red, anchor: "middle" });
        grid(630, 70, 460, 200, 12, 5, C.t1, C.purple);
        txt(g, 860, 302, "RAM", { size: 22, weight: 700, fill: C.purple, anchor: "middle" });
        txt(g, 575, 180, "=", { size: 70, weight: 700, fill: C.ink, anchor: "middle" });

  scene(mixScene({

      { sub: "cac", mode: 3, rows: [["0", "0"], ["0", "0"], ["0", "0"], ["0", "0"]], say: "power-on: what does row 1 hold? Wires are never empty", chip: 4, foot: "attempt four: the valid bit", narrate: "<strong>Attempt four: the power-on problem.</strong> What is in row 1 the instant you press the power button? In hardware empty does not exist: a wire always holds some voltage. Say the cache powers up full of zeros, tags included." },

  const TRACE = {"acc": [[52, 6, 2, 1, "MISS"], [53, 6, 2, 1, "HIT"], [92, 11, 3, 2, "MISS"], [55, 6, 2, 1, "HIT"], [20, 2, 2, 0, "MISS"], [54, 6, 2, 1, "MISS"], [60, 7, 3, 1, "MISS"], [53, 6, 2, 1, "HIT"], [29, 3, 3, 0, "MISS"], [28, 3, 3, 0, "HIT"]], "states": [[null, null, [1, 6], null], [null, null, [1, 6], null], [null, null, [1, 6], [2, 11]], [null, null, [1, 6], [2, 11]], [null, null, [0, 2], [2, 11]], [null, null, [1, 6], [2, 11]], [null, null, [1, 6], [1, 7]], [null, null, [1, 6], [1, 7]], [null, null, [1, 6], [0, 3]], [null, null, [1, 6], [0, 3]]]};

          [60, 60, 80, 200, 150].forEach((w, ci) => {
            const b = rect(g, xx, y, w, 56, { fill: C.white, stroke: C.accent, sw: 2 });
            const t = txt(g, xx + w / 2, y + 35, ci === 0 ? String(i) : "", { size: 15, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
            cells.push({ b, t });
            xx += w;
          });
          r.cache.push(cells);
        }
        r.note = txt(g, CX + 275, Y0 + 4 * 62 + 24, "", { size: 14, weight: 700, mono: true, fill: C.red, anchor: "middle" });
        return r;
      },
      render(s, r) {
        const k = s.k || 0;
        r.rows.forEach((rg, i) => vis(rg, i < k));
        r.bgs.forEach((cells, i) => cells.forEach((b) => b.setAttribute("fill", i === k - 1 && !s.sum ? C.t2 : (s.sum && TRACE.acc[i][4] === "HIT" ? C.t2 : C.white))));
        const st = k > 0 ? TRACE.states[k - 1] : [null, null, null, null];
        const cur = k > 0 ? TRACE.acc[k - 1] : null;
        for (let i = 0; i < 4; i++) {
          const e = st[i], c = r.cache[i];
          c[1].t.textContent = e ? "1" : "0";
          c[2].t.textContent = e ? String(e[0]) : "";
          c[3].t.textContent = e ? "block " + e[1] : "(empty)";
          c[4].t.textContent = e ? (e[1] * 8) + " to " + (e[1] * 8 + 7) : "";
          const hot = cur && cur[2] === i && !s.sum;
          c.forEach((cell, ci) => {
            cell.b.setAttribute("fill", hot ? C.t2 : C.white);
            cell.b.setAttribute("stroke", hot ? C.red : C.accent);
            cell.b.setAttribute("stroke-width", hot ? 4 : 2);
          });
        }
        r.note.textContent = cur && !s.sum ? "address " + cur[0] + " -> row " + cur[2] + ": " + cur[4] : (s.sum ? "4 hits in 10 accesses" : "");
      },
    };
  })();
  const SEQ = { cols: [{ h: "ADDRESSES", x: 80, w: 260, mono: true, bold: true, size: 20 }, { h: "BLOCK", x: 380, w: 200, mono: true, size: 20 }, { h: "RESULT", x: 620, w: 400, size: 20 }],
    rows: [["50 to 55", "block 6", "1 miss, then 5 hits"], ["56 to 63", "block 7", "1 miss, then 7 hits"], ["64 to 69", "block 8", "1 miss, then 5 hits"], ["total", "20 accesses", "17 hits: hit ratio 17/20"]], rh: 70, y0: 60, fs: 20 };
  const WORST = { cols: [{ h: "ADDRESS", x: 80, w: 200, mono: true, bold: true, size: 20 }, { h: "BLOCK", x: 320, w: 200, mono: true, size: 20 }, { h: "ROW", x: 560, w: 160, mono: true, size: 20 }, { h: "RESULT", x: 760, w: 300, mono: true, size: 20 }],
    rows: [["16", "2", "2", "MISS"], ["80", "10", "2", "MISS"], ["17", "2", "2", "MISS"], ["81", "10", "2", "MISS"], ["18", "2", "2", "MISS"], ["82", "10", "2", "MISS: 0 hits in 6"]], rh: 50, y0: 56, fs: 20 };
  const traceSteps = [{ sub: "trace", k: 0, chip: 1, foot: "4 rows, block size 8, starting empty", narrate: "Time to run one. The cache has <strong>four rows and a block size of 8</strong> and starts completely empty. The program makes ten <code>lw</code> accesses, in this order: <code>52, 53, 92, 55, 20, 54, 60, 53, 29, 28</code>. For each address we compute <code>block = address // 8</code>, <code>row = block % 4</code>, <code>tag = block // 4</code>, then look at the row." }];
  TRACE.acc.forEach((a, i) => traceSteps.push({ sub: "trace", k: i + 1, chip: 2, foot: "", narrate: TRACE_NARR[i] }));
  traceSteps.push({ sub: "trace", k: 10, sum: true, chip: 3, foot: "rows 0 and 1 were never used", narrate: "Four hits in ten accesses: a hit ratio of <strong>4/10</strong>. Rows 0 and 1 were never touched, while blocks 6 and 2, and blocks 11, 7 and 3, kept evicting each other. A direct-mapped cache has no way around that: each block may live in exactly <em>one</em> row, however empty the rest of the cache is." });
  traceSteps.push({ sub: "seq", rows: 4, hl: [3], chip: 4, foot: "same cache, different access pattern", narrate: "The same cache on a program that walks memory in order: <code>50, 51, 52, ..., 69</code>, twenty accesses. Only the first access to each new block misses: 50, 56 and 64. Three misses and seventeen hits, a hit ratio of <strong>17/20</strong>. Same cache, a wildly better result, because the access pattern matches the bet the cache made." });
  traceSteps.push({ sub: "worst", rows: 6, hl: [], chip: 5, foot: "rows 0, 1 and 3 sit idle", narrate: "And the worst case: <code>16, 80, 17, 81, 18, 82</code>. Cells 16 to 18 are block 2, cells 80 to 82 are block 10, and both map to row 2 (<code>2 % 4 = 10 % 4 = 2</code>). Every access evicts the other: six misses, a hit ratio of <strong>0</strong>, with three rows idle. It failed not because the cache was small but because of <em>where</em> the blocks landed. That is what next lecture's associative caches relax." });
  scene(mixScene({
    num: "5", title: "Tracing a Cache: A Worked Example", subtitle: "Four rows, block size 8. Tracing by hand is the skill that gets tested.",
    chips: ["The setup", "Ten accesses", "The result", "In order", "Worst case"],
    steps: traceSteps,
  }, { trace: traceSub, seq: tb(SEQ), worst: tb(WORST) }));

  // ================= 6 Sizing a Cache =================
  const SIZEF = { cols: [{ h: "WHAT", x: 60, w: 260, bold: true, size: 20 }, { h: "FORMULA", x: 360, w: 700, mono: true, size: 20 }],
    rows: [["total size, in bits", "numberOfRows x (1 + tagBits + blockBits)"], ["1", "the valid bit"], ["tagBits", "address bits - index bits - offset bits"], ["blockBits", "blockSize x 8, for byte-sized cells"]], rh: 70, y0: 60, fs: 20 };
  const SIZEX = { cols: [{ h: "STEP", x: 60, w: 260, bold: true, size: 19 }, { h: "12-BIT ADDRESSES, 8 ROWS, 16-BYTE BLOCKS", x: 360, w: 700, mono: true, size: 19 }],
    rows: [["offset bits", "log2(16) = 4"], ["index bits", "log2(8) = 3"], ["tag bits", "12 - 4 - 3 = 5"], ["data per row", "16 x 8 = 128 bits"], ["bits per row", "1 + 5 + 128 = 134"], ["total", "8 x 134 = 1072 bits = 134 bytes"]], rh: 54, y0: 56, fs: 19 };
  scene(mixScene({
    num: "6", title: "Sizing a Cache", subtitle: "The valid bit and the tag are real storage too.",
    chips: ["The formula", "Bit widths", "The total", "The overhead"],
    steps: [
      { sub: "sz", view: 1, chip: 1, foot: "", narrate: "The size of a cache is a slippery word. The data is <code>rows &times; blockSize</code>, but the hardware also stores a <strong>valid bit and a tag in every row</strong>, and those take real transistors too. So: <code>total bits = numberOfRows &times; (1 + tagBits + blockBits)</code>." },
      { sub: "sz", view: 2, chip: 2, foot: "", narrate: "Worked example: 12-bit addresses, 8 rows, 16-byte blocks. Sixteen bytes needs <code>log2(16) = 4</code> offset bits, 8 rows needs <code>log2(8) = 3</code> index bits, and the tag gets the rest: <code>12 - 4 - 3 = 5</code> bits." },
      { sub: "sz", view: 3, chip: 3, foot: "", narrate: "Each block holds <code>16 &times; 8 = 128</code> bits of data, so each row costs <code>1 + 5 + 128 = 134</code> bits, and the whole cache is <code>8 &times; 134 = 1072</code> bits, or <strong>134 bytes</strong>." },
      { sub: "sz", view: 4, chip: 4, foot: "6 bytes of overhead on 128 bytes of data", narrate: "It stores only <code>8 &times; 16 = 128</code> bytes of actual data, so the metadata is 6 bytes: about 5 percent. That overhead shrinks as blocks grow (more data shares the same tag and valid bit), which is one reason designers don't shrink blocks toward zero." },
    ],
  }, { f: tb(SIZEF), x: tb(SIZEX), sz: szSub }));

  // ================= 7 What a Cache Is Worth =================
  const AVGF = { cols: [{ h: "THE CONVENTION", x: 60, w: 360, bold: true, size: 19 }, { h: "", x: 460, w: 640, mono: true, size: 19 }],
    rows: [["every access checks the cache first", "hit or miss, it pays the cache time (2 ns)"], ["a miss also pays for memory", "on top of that, memory time (60 ns)"], ["average time", "cache time + (1 - hit ratio) x memory time"]], rh: 80, y0: 60, fs: 19 };
  const AVGT = { cols: [{ h: "HIT RATIO", x: 70, w: 220, bold: true, mono: true, size: 20 }, { h: "AVERAGE TIME", x: 330, w: 460, mono: true, size: 19 }, { h: "VS NO CACHE (60 ns)", x: 830, w: 300, size: 19 }],
    rows: [["no cache", "60 ns", "1 times"], ["80%", "2 + 0.2 x 60 = 14 ns", "4.3 times faster"], ["90%", "2 + 0.1 x 60 = 8 ns", "7.5 times faster"], ["99%", "2 + 0.01 x 60 = 2.6 ns", "23 times faster"]], rh: 70, y0: 60, fs: 19 };
  scene(mixScene({
    num: "7", title: "What a Cache Is Worth: Hit Ratio and Average Time", subtitle: "Cache 2 ns, memory 60 ns (invented, right shape).",
    chips: ["The formula", "90 percent", "Why it matters", "Looking ahead"],
    steps: [
      { sub: "avg", show: [0], note: "every access pays the full 60 ns", chip: 1, foot: "", narrate: "One more number, and it explains why anyone bothers. A cache access takes 2 ns and a trip to memory takes 60 ns (invented, with the right shape). The usual convention: <strong>every access checks the cache first</strong>, hit or miss, so every access pays 2 ns, and a miss pays the memory trip on top. <code>average time = cache time + (1 - hit ratio) &times; memory time</code>." },
      { sub: "avg", show: [0, 2], chip: 2, foot: "", narrate: "At a 90 percent hit ratio: <code>2 + 0.1 &times; 60 = 8 ns</code>. With no cache every access would cost 60 ns, so the cache made the average access <strong>7.5 times faster</strong>." },
      { sub: "avg", show: [0, 1, 2, 3], note: "a few points of hit ratio change the average a lot", chip: 3, foot: "the few misses dominate the average", narrate: "Now watch a few points of hit ratio. At 99 percent it is 2.6 ns, three times faster again than 90. At 80 percent it is 14 ns, nearly twice as slow as 90. The memory trip is so expensive that the handful of misses dominates the average. That is why designers obsess over hit ratio, and why blocks and walking memory in order matter so much." },
      { sub: "avg", show: [0, 1, 2, 3], note: "a miss stalls MEM: this number feeds straight into CPI", chip: 4, foot: "next lecture: writes, then associative caches", narrate: "It connects back to the pipeline: a miss stalls the <code>MEM</code> stage, so average memory time feeds straight into CPI. And everything today was about <em>reading</em>. We haven't said what happens on a <code>sw</code>, and a direct-mapped cache lets each block live in only one row. Next lecture relaxes that rule with <strong>associative caches</strong>, then moves on to virtual memory, where the same tag, index and offset vocabulary returns at a much larger scale." },
    ],
  }, { f: tb(AVGF), t: tb(AVGT), avg: avgSub }));


  // ---------------- engine ----------------
  const $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const foot = txt(svg, 575, 392, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

  scenes.forEach((sc) => {
    sc.g = E("g", {}, svg);
    sc.g.style.display = "none";
    sc.r = sc.build(sc.g) || {};
    foot.parentNode.appendChild(foot);
  });
  $("sec-total").textContent = scenes.length - scenes.filter((x) => x.front).length;

  // si: section, ti: step, ph: 0 = question showing (diagram as before), 1 = answered
  const off = scenes.filter((x) => x.front).length;   // title slides don't count as sections
  let si = 0, ti = 0, ph = 1, shownScene = -1;
  const asks = (i, k) => !!scenes[i].steps[k].q;
  const startPh = (i, k) => (asks(i, k) && k > 0 ? 0 : 1);

  function readHash() {
    const m = location.hash.match(/^#(\d+)\.(\d+)(q?)$/);
    if (!m) { ph = startPh(si, ti); return; }
    const a = Number(m[1]) - 1 + off, b = Number(m[2]) - 1;
    if (a >= 0 && a < scenes.length) { si = a; ti = Math.max(0, Math.min(scenes[a].steps.length - 1, b)); }
    ph = m[3] && asks(si, ti) && ti > 0 ? 0 : 1;
  }

  function buildChips(sc) {
    const box = $("chips");
    box.innerHTML = "";
    sc.chips.forEach((label) => {
      const d = document.createElement("div");
      d.className = "stp";
      d.textContent = label;
      box.appendChild(d);
    });
  }

  function render() {
    const sc = scenes[si], s = sc.steps[ti];
    if (shownScene !== si) {
      scenes.forEach((x, k) => { x.g.style.display = k === si ? "inline" : "none"; });
      $("num").textContent = sc.num;
      $("title").textContent = sc.title;
      $("subtitle").textContent = sc.subtitle;
      document.querySelector(".stage").style.visibility = sc.front ? "hidden" : "";
      $("subtitle").style.visibility = sc.front ? "hidden" : "";
      $("sec-wrap").style.display = sc.front ? "none" : "";
      $("foot-left").textContent = sc.title;
      buildChips(sc);
      shownScene = si;
    }
    const asking = ph === 0 && !!s.q && ti > 0;
    // while a question is showing, the diagram stays exactly as the previous step left it
    sc.render(asking ? sc.steps[ti - 1] : s, sc.r, ti);
    foot.textContent = asking ? "" : (s.foot || "");
    const qm = '<span class="qm">Q</span>';
    $("narration").innerHTML = asking ? '<div class="q big">' + qm + s.q + '</div>'
      : (s.q ? '<div class="q small">' + qm + s.q + '</div>' : "") + ((!fullText && CAPTIONS[(sc.num === "" ? "T" : sc.num) + "." + (ti + 1)]) || s.narrate);
    $("sec-n").textContent = si - off + 1;
    $("step-n").textContent = ti + 1;
    $("step-total").textContent = sc.steps.length;
    document.querySelectorAll(".stp").forEach((chip, k) => {
      const n = k + 1;
      chip.classList.remove("active", "done");
      if (!s.chip) return;
      if (s.chip === n) chip.classList.add("active");
      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "n" || e.key === "N") { fullText = !fullText; render(); return; }
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  // on-slide captions: short text under the picture. The full narration stays in the speaker script; press n to show it on screen.
  const CAPTIONS = {
"T.1": "A student keeps books on the desk, not at the library.",
"T.2": "Build the cache: break it, fix it, then trace it.",
"1.1": "<code>lw</code> isn't one polite stage. Memory is far away.",
"1.2": "Fast is small and expensive; slow is huge and cheap.",
"1.3": "The CPU asks the cache first.",
"1.4": "Nothing there yet: a <strong>miss</strong>.",
"1.5": "On to RAM: the long trip.",
"1.6": "The cache keeps a copy.",
"1.7": "Asked again: a <strong>hit</strong>, in about 1 ns.",
"1.8": "Nine hits in ten: a hit ratio of 90 percent.",
"1.9": "A cache as big as RAM is just another RAM.",
"1.10": "A real cache holds only a <strong>sliver</strong>.",
"1.11": "The sliver forces three questions.",
"1.12": "The simplest answer: the <strong>direct-mapped cache</strong>.",
"2.1": "Attempt one: four rows, one value each.",
"2.2": "The CPU asks for address 42.",
"2.3": "<code>row = address % 4</code>: <code>42 % 4 = 2</code>.",
"2.4": "Row 2 is empty, so ask RAM.",
"2.5": "RAM says 17: it is copied into row 2.",
"2.6": "Later, the CPU asks for address 10.",
"2.7": "<code>10 % 4 = 2</code> as well: the same row.",
"2.8": "The cache returns 17. <strong>Wrong:</strong> ram[10] = 33.",
"2.9": "Attempt two: store the <strong>address</strong> too.",
"2.10": "Row 2 holds the pair (42, 17).",
"2.11": "<code>lw 10</code> compares addresses: stored 42, asked 10.",
"2.12": "42 is not 10: a <strong>miss</strong>.",
"2.13": "RAM says 33: it overwrites row 2. The old entry is <strong>evicted</strong>.",
"2.14": "Correct now, but a whole address per row is wasteful.",
"2.15": "Attempt three: <code>42 = 4 x 10 + 2</code>. The row already tells us the 2.",
"2.16": "Store only the <strong>tag</strong>: 10.",
"2.17": "<code>10 = 4 x 2 + 2</code>: row 2, tag 2.",
"2.18": "Stored tag 10 is not tag 2: a miss.",
"2.19": "Row 2 is overwritten. Index is where, tag is who.",
"2.20": "Attempt four: power-on. Wires are never empty.",
"2.21": "<code>lw 1</code>: row 1, tag 0.",
"2.22": "The tags match on static: a <strong>false hit</strong>.",
"2.23": "Add a <strong>valid bit</strong>. Every row starts at 0.",
"2.24": "V = 0: a miss, without looking at the tag.",
"2.25": "The lookup: row 2 has <code>V = 1</code>, tag 10.",
"2.26": "Both match: a hit.",
"2.27": "A tag mismatch: one kind of miss.",
"2.28": "Not valid: another kind of miss.",
"3.1": "Two localities: next address (spatial), same address (temporal).",
"3.2": "Carry back the whole shelf: memory in <strong>blocks</strong>.",
"3.3": "<code>lw 53</code> loads all of block 6 into row 2.",
"3.4": "54 and 55 are hits: the bet paid off.",
"4.1": "Block = <code>address // size</code>. Row = <code>block % rows</code>.",
"4.2": "Address 181 in binary: tag | index | offset.",
"4.3": "Three more examples, on the cache we trace next.",
"5.1": "Four rows, block size 8, starting empty. Ten accesses.",
"5.2": "52: <strong>miss</strong>. Load block 6 into row 2.",
"5.3": "53: <strong>hit</strong>. It rode in with 52.",
"5.4": "92: <strong>miss</strong>. Load block 11 into row 3.",
"5.5": "55: <strong>hit</strong>.",
"5.6": "20: <strong>miss</strong>, and block 6 is evicted.",
"5.7": "54: a <strong>conflict</strong>: blocks 2 and 6 share row 2.",
"5.8": "60: <strong>miss</strong>, evict.",
"5.9": "53: <strong>hit</strong>.",
"5.10": "29: <strong>miss</strong>, evict.",
"5.11": "28: <strong>hit</strong>.",
"5.12": "4 hits in 10. Rows 0 and 1 were never used.",
"5.13": "Sequential walk: <strong>17 hits</strong> in 20.",
"5.14": "Worst case: <strong>0 hits</strong>, three rows idle.",
"6.1": "Size = rows &times; (1 + tag bits + block bits).",
"6.2": "12-bit address, 8 rows, 16-byte blocks: 5 + 3 + 4 bits.",
"6.3": "8 rows &times; 134 bits = <strong>1072</strong> bits.",
"6.4": "6 bytes of overhead on 128 bytes of data.",
"7.1": "Average time = cache time + miss rate &times; memory time.",
"7.2": "90% hits: 2 + 0.1 &times; 60 = <strong>8 ns</strong>.",
"7.3": "A few points of hit ratio matter a lot.",
"7.4": "A miss stalls <code>MEM</code>: it feeds into CPI."
};
  let fullText = false;
  window.DECK_STEPS = scenes.map(function (sc) { return { num: sc.num, title: sc.title, front: !!sc.front, steps: sc.steps.map(function (s) { return { narrate: s.narrate, sub: s.sub, img: s.img, card: s.card, rows: s.rows, hl: s.hl, chip: s.chip, k: s.k }; }) }; });
  if (location.search.indexOf('dump') >= 0) { var pre = document.createElement('pre'); pre.id = 'dump'; pre.textContent = JSON.stringify(window.DECK_STEPS); document.body.innerHTML = ''; document.body.appendChild(pre); return; }
  readHash();
  render();
})();
</script>
