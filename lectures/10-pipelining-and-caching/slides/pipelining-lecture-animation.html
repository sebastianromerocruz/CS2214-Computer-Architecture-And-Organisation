<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | Pipelining, Concluded | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* One deck for the pipelining half of the Week IX lecture (hazards), on the same step engine as the lecture 09 deck.
     Arrow keys step, shift + arrow jumps a section. Open with #4.3. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 10px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 12px;
    font-size: 27px;
    line-height: 1.3;
    min-height: 44px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 23px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">10</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">
    <span class="num" id="num"></span>
    <h1 id="title">Pipelining, Concluded</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="372"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">Pipelining, Concluded</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenePost(def); scenes.push(def); }


  // ---- split any narration that is too long for one slide into several consecutive steps (same visual, next chunk of text)
  const MAX_WORDS = 50;
  function plainWords(h) { return h.replace(/<[^>]*>/g, " ").replace(/&[a-z#0-9]+;/gi, "x").split(/\s+/).filter(Boolean).length; }
  function balanced(h) {
    return ["strong", "em", "code"].every((t) => (h.match(new RegExp("<" + t + ">", "g")) || []).length === (h.match(new RegExp("</" + t + ">", "g")) || []).length);
  }
  function splitNarr(h) {
    if (plainWords(h) <= MAX_WORDS) return [h];
    const sents = [];
    const re = /([.?!])((?:<\/[a-z]+>)*)(\s+)/g;
    let last = 0, m;
    while ((m = re.exec(h))) {
      if (/e\.g\.|i\.e\./.test(h.slice(Math.max(0, m.index - 3), m.index + 2))) continue;
      const end = m.index + m[1].length + m[2].length;
      sents.push(h.slice(last, end));
      last = m.index + m[0].length;
    }
    sents.push(h.slice(last));
    const total = plainWords(h), k = Math.ceil(total / MAX_WORDS), target = total / k;
    const out = [];
    let cur = "";
    sents.filter((x) => x.trim()).forEach((x) => {
      if (cur && balanced(cur) && plainWords(cur) >= target * 0.85) { out.push(cur); cur = x; }
      else cur = cur ? cur + " " + x : x;
    });
    if (cur) out.push(cur);
    if (out.length > 1 && plainWords(out[out.length - 1]) < 14) { const lastc = out.pop(); out[out.length - 1] += " " + lastc; }
    for (let i = 0; i < out.length - 1; i++) if (!balanced(out[i])) { out[i + 1] = out[i] + " " + out[i + 1]; out.splice(i, 1); i--; }
    return out;
  }
  function expandSteps(steps) {
    const res = [];
    steps.forEach((st) => {
      if (!st.narrate) { res.push(st); return; }
      splitNarr(st.narrate).forEach((chunk) => res.push(Object.assign({}, st, { narrate: chunk })));
    });
    return res;
  }
  // every section 1 to 9 gets a closing card with what the student should be able to do, then long narrations are split
  function scenePost(def) {
    const k = SKILLS[def.num];
    if (k) def.steps = def.steps.concat([{ sub: "card", card: cd("What you should be able to do", k.lines), chip: (def.chips || []).length, foot: "", narrate: "<strong>What you should be able to do after this section:</strong> " + k.text }]);
    def.steps = expandSteps(def.steps);
  }
  // ---------- helpers for this deck ----------
  const ASSET = "fig/";
  function figScene(cfg) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { imgs: {} };
        cfg.steps.forEach((s) => {
          if (!s.img || r.imgs[s.img]) return;
          const im = E("image", { x: 0, y: 0, width: 1150, height: 400, preserveAspectRatio: "xMidYMid meet" }, g);
          im.setAttributeNS("http://www.w3.org/1999/xlink", "href", ASSET + s.img);
          im.setAttribute("href", ASSET + s.img);
          im.style.opacity = 0;
          r.imgs[s.img] = im;
        });
        return r;
      },
      render(s, r) { for (const k in r.imgs) vis(r.imgs[k], k === s.img); },
    };
  }
  // table scene: cols = [{h, x, anchor, mono, w}], rows = arrays of strings; step: rows = how many rows are showing, hl = highlighted row indices
  function tableScene(cfg) {
    const RH = cfg.rh || 34, Y0 = cfg.y0 || 26, FS = cfg.fs || 15;
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { rows: [], bgs: [] };
        const W = cfg.cols[cfg.cols.length - 1].x + cfg.cols[cfg.cols.length - 1].w + 20 - cfg.cols[0].x;
        cfg.cols.forEach((c) => txt(g, c.x, Y0 - 8, c.h, { size: 12, weight: 700, fill: C.purple, ls: 1.5, anchor: c.anchor || "start" }));
        ln(g, cfg.cols[0].x - 10, Y0, cfg.cols[0].x - 10 + W, Y0, { stroke: C.purple, sw: 2 });
        cfg.rows.forEach((row, i) => {
          const gg = grp(g, 0); r.rows.push(gg);
          const y = Y0 + i * RH;
          r.bgs.push(rect(gg, cfg.cols[0].x - 10, y + 3, W, RH - 4, { rx: 6, fill: "none" }));
          row.forEach((cell, ci) => {
            const c = cfg.cols[ci];
            txt(gg, c.x, y + RH / 2 + 5, cell, { pre: true, size: c.size || FS, mono: !!c.mono, weight: c.bold ? 700 : 400, fill: c.bold ? C.purple : C.ink, anchor: c.anchor || "start" });
          });
        });
        return r;
      },
      render(s, r) {
        const n = s.rows === undefined ? cfg.rows.length : s.rows, hl = s.hl || [];
        r.rows.forEach((gg, i) => vis(gg, i < n));
        r.bgs.forEach((b, i) => b.setAttribute("fill", hl.indexOf(i) >= 0 ? C.t2 : "none"));
      },
    };
  }


  function mixScene(cfg, subs) {
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [], steps: cfg.steps,
      build(g) {
        const r = { subs: {}, gs: {} };
        for (const k in subs) { const gg = grp(g, 0); r.gs[k] = gg; r.subs[k] = subs[k].build(gg); }
        return r;
      },
      render(s, r) {
        for (const k in subs) { vis(r.gs[k], s.sub === k); if (s.sub === k) subs[k].render(s, r.subs[k]); }
      },
    };
  }
  const tb = (c) => tableScene(Object.assign({ steps: [{}] }, c));
  const fg = (imgs) => figScene({ steps: imgs.map((i) => ({ img: i })) });
  // a "card": a big statement for beats of the lecture that have no diagram of their own
  const cardSub = {
    build(g) {
      const r = {};
      rect(g, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
      r.head = txt(g, 575, 135, "", { size: 42, weight: 700, fill: "#171715", anchor: "middle" });
      rect(g, 505, 160, 140, 6, { rx: 3, fill: C.accent });
      r.lines = [0, 1, 2, 3].map((i) => txt(g, 575, 218 + i * 34, "", { size: 21, fill: C.grey, anchor: "middle", pre: true }));
      return r;
    },
    render(s, r) {
      const c = s.card || {};
      r.head.textContent = c.head || "";
      r.head.setAttribute("font-size", c.mono ? 40 : ((c.head || "").length > 30 ? 30 : 40));
      r.head.style.fontFamily = c.mono ? MONO : "";
      r.lines.forEach((t, i) => { t.textContent = (c.lines || [])[i] || ""; });
    },
  };
  const cd = (head, lines, mono) => ({ head, lines: lines || [], mono: !!mono });

  const SKILLS = {};

  // ================= Title slide =================
  (function () {
    const ROUTE = ["Recap: One Hazard Down", "Who Can Interfere?", "Reordering", "Control Hazards", "Branch Prediction", "Structural Hazards", "Inside the Pipeline", "E15 and Dependency Graphs"];
    scene({
      front: true, num: "", title: "Pipelining, Concluded", subtitle: "", chips: [],
      steps: [
        { view: "title", foot: "",
          narrate: "Last week we built a pipeline, and it worked: once it filled up, an instruction finished every single clock cycle. Then we found out that overlapping instructions can step on each other's toes. Today we finish that story." },
        { view: "route", foot: "caching has its own deck",
          narrate: "We start with the hazard we already know, RAW, and ask which of its siblings are real. Then we ask a stranger question: what if the register being fought over is the <code>pc</code> itself? And last, a hazard that is not about data at all: two instructions wanting the same wire in the same cycle." },
      ],
      build(g) {
        const r = {};
        r.title = grp(g, 1);
        rect(r.title, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
        txt(r.title, 575, 104, "CS-UY 2214  |  WEEK IX", { size: 15, weight: 700, fill: C.red, anchor: "middle", ls: 2 });
        txt(r.title, 575, 184, "Pipelining, Concluded", { size: 50, weight: 700, fill: "#171715", anchor: "middle" });
        rect(r.title, 505, 210, 140, 6, { rx: 3, fill: C.accent });
        txt(r.title, 575, 258, "Every way an overlapped instruction can go wrong", { size: 22, italic: true, fill: C.grey, anchor: "middle" });
        txt(r.title, 575, 312, "Computer Architecture and Organization", { size: 14, fill: C.lgrey, anchor: "middle", ls: 1 });
        r.route = grp(g, 0);
        txt(r.route, 575, 40, "TODAY'S ROUTE", { size: 13, weight: 700, fill: C.purple, anchor: "middle", ls: 2 });
        ROUTE.forEach((name, i) => {
          const col = i < 4 ? 0 : 1, row = col === 0 ? i : i - 4;
          const x = 110 + col * 480, y = 76 + row * 66;
          rect(r.route, x, y, 450, 58, { rx: 12, fill: C.white, stroke: C.purple, sw: 4 });
          circ(r.route, x + 32, y + 29, 15, { fill: C.purple });
          txt(r.route, x + 32, y + 35, String(i + 1), { size: 15, weight: 700, fill: C.white, anchor: "middle" });
          txt(r.route, x + 62, y + 36, name, { size: 19, weight: 700, fill: C.ink });
        });
        return r;
      },
      render(s, r) { vis(r.title, s.view === "title"); vis(r.route, s.view === "route"); },
    });
  })();

  const PSTAGES = ["IF", "ID", "EX", "MEM", "WB"], PUNITS = ["Memory", "Register file", "ALU", "Memory", "Register file"];
  const PBX = 230, PBW = 130, PGAP = 30, PBY = 150, PBH = 90;
  const PCOL = ["#e2cdf2", "#d9e8fb", "#fbe9ea", "#e4f3e1", "#fff1cf"];
  const pcx = (i) => PBX + i * (PBW + PGAP) + PBW / 2;
  const pth = (str) => { const o = {}; str.split(",").forEach((q) => { const [c, st] = q.split(":"); o[Number(c)] = Number(st); }); return o; };
  const run5 = (from) => pth([0, 1, 2, 3, 4].map((k) => (from + k) + ":" + k).join(","));
  const PIPES = {
    fill: { N: 9, tokens: [0, 1, 2, 3, 4].map((i) => ({ id: "i" + i, label: "addi $" + (i + 1), ci: i, path: run5(i + 1) })) },
    raw: { N: 6, tokens: [{ id: "a", label: "addi $1,$0,1", ci: 0, path: run5(1) }, { id: "b", label: "addi $1,$1,1", ci: 1, path: run5(2) }] },
    stall: { N: 9, tokens: [{ id: "a", label: "addi $1,$0,1", ci: 0, path: run5(1) }, { id: "b", label: "addi $1,$1,1", ci: 1, path: pth("2:0,3:0,4:0,5:0,6:1,7:2,8:3,9:4") },
      { id: "n1", label: "nop", bubble: true, path: pth("3:1,4:2,5:3,6:4") }, { id: "n2", label: "nop", bubble: true, path: pth("4:1,5:2,6:3,7:4") }, { id: "n3", label: "nop", bubble: true, path: pth("5:1,6:2,7:3,8:4") }] },
    fwdex: { N: 6, tokens: [{ id: "a", label: "addi $1,$0,1", ci: 0, path: run5(1) }, { id: "b", label: "addi $1,$1,1", ci: 1, path: run5(2) }] },
    fwdid: { N: 7, tokens: [{ id: "a", label: "addi $1,$0,1", ci: 0, path: run5(1) }, { id: "b", label: "movi $2,1", ci: 1, path: run5(2) }, { id: "c", label: "addi $1,$1,1", ci: 2, path: run5(3) }] },
    lwu: { N: 7, tokens: [{ id: "a", label: "lw $1,1($0)", ci: 0, path: run5(1) }, { id: "b", label: "addi $1,$1,1", ci: 1, path: pth("2:0,3:1,4:1,5:2,6:3,7:4") },
      { id: "n1", label: "nop", bubble: true, path: pth("4:2,5:3,6:4") }] },
  };
  function pipeSub(cfg) {
    const toks = cfg.tokens.map((t) => {
      const cyc = Object.keys(t.path).map(Number);
      return Object.assign({ start: Math.min.apply(null, cyc), end: Math.max.apply(null, cyc) }, t);
    });
    const real = toks.filter((t) => !t.bubble);
    const issueOrder = real.slice().sort((a, b) => a.start - b.start);
    const retireOrder = real.slice().sort((a, b) => a.end - b.end);
    return {
      build(g) {
        const r = { boxes: [], toks: {} };
        txt(g, 40, 62, "CLOCK CYCLE", { size: 14, weight: 700, fill: C.grey, ls: 2 });
        r.cyc = txt(g, 40, 112, "", { size: 52, weight: 700, fill: C.red });
        PSTAGES.forEach((nm, i) => {
          const x = PBX + i * (PBW + PGAP);
          r.boxes.push(rect(g, x, PBY, PBW, PBH, { rx: 14, fill: C.white, stroke: C.purple, sw: 3 }));
          txt(g, pcx(i), PBY - 30, nm, { size: 22, weight: 700, fill: C.purple, anchor: "middle" });
          txt(g, pcx(i), PBY - 10, PUNITS[i], { size: 12, italic: true, fill: C.grey, anchor: "middle" });
        });
        txt(g, 1072, 82, "RETIRED", { size: 13, weight: 700, fill: C.grey, anchor: "middle", ls: 2 });
        r.ret = txt(g, 1072, 292, "", { size: 14, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
        r.qlab = txt(g, 105, 148, "WAITING", { size: 13, weight: 700, fill: C.grey, anchor: "middle", ls: 2 });
        r.tl = [];

      { sub: "pred", p: "pat", n: 3, chip: 4, foot: "", narrate: "The first three outcomes: taken, taken, not taken. \"Not taken\" guesses wrong at every taken. \"Same as last time\" is wrong on the first one, right on the second, and wrong again at the exit." },

      { sub: "hist", h: 0, chip: 4, foot: "", narrate: "A better idea: remember the <em>last two outcomes</em>, not just the last one. They go in a small shift register, the <strong>history register</strong>. Next to it, a <strong>pattern table</strong> will remember what came next after each history. Both start empty." },
      { sub: "hist", h: 1, chip: 4, foot: "", narrate: "The first outcome is taken. The history was 00 and the table had never seen it, so the guess was not taken: wrong. Now the table writes down that after 00 came taken, and the history shifts." },

      { sub: "st", cycle: 5, marks: [[1, "reads the registers"], [4, "writes a register"]], chip: 1, foot: "", narrate: "Take the register file. An instruction in <code>ID</code> reads it, an instruction in <code>WB</code> writes it, and in a full pipeline both happen in every single cycle." },
      { sub: "door", door: { mode: "real" }, chip: 2, foot: "", narrate: "The real E20 register file has three doors: two for reading, because an instruction reads two registers at once, and one for writing. Think of each door as a wire into the register file that only one instruction can use per cycle." },
      { sub: "door", door: { mode: "real", rd: "add $4,$4,$4", wr: "add $1,$1,$1" }, chip: 2, foot: "", narrate: "In cycle 5 the fourth <code>add</code> reads through the read doors, and the first <code>add</code> writes through the write door. Different doors, so both get through in the same cycle." },
      { sub: "door", door: { mode: "cheap" }, chip: 2, foot: "", narrate: "Now imagine a cheaper register file, with a single door that reads and writes have to share. Fewer wires, smaller chip, and one rule: one instruction at a time." },
      { sub: "door", door: { mode: "cheap", rd: "add $4,$4,$4" }, chip: 3, foot: "", narrate: "A read on its own is fine. The fourth <code>add</code> arrives in <code>ID</code> and uses the door to read its registers." },

      { sub: "st", cycle: 5, marks: [[1, "needs the door"], [4, "needs the door"]], chip: 3, foot: "", narrate: "In the pipeline it looks like this: the fourth <code>add</code> in <code>ID</code>, the first in <code>WB</code>, both in cycle 5. No register is shared between them. It is not a data hazard at all." },
      { sub: "tst", rows: 5, cur: 5, hlcells: [[5, 1], [5, 4]], chip: 3, foot: "", narrate: "In the table it is one row with two cells fighting over the one door. One of them has to wait." },
      { sub: "card", card: cd("Someone has to wait", ["the write finishes an instruction", "so the write goes first", "the read waits in IF"]), chip: 3, foot: "", narrate: "The sensible rule: the write goes first, because it finishes an instruction. The fourth <code>add</code> has to wait before it can read. As before, it waits in <code>IF</code> while bubbles flow behind." },
      { sub: "shared", cycle: 5, marks: [[4, "add 1 writes: door busy"], [1, "add 4 must wait"]], chip: 4, foot: "", narrate: "Cycle 5: the first <code>add</code> uses the door to write. The fourth <code>add</code> is held back, and a bubble enters <code>ID</code>." },
      { sub: "shared", cycle: 6, marks: [[4, "add 2 writes: door busy"], [1, "add 4 still waits"]], chip: 4, foot: "", narrate: "Cycle 6: now the second <code>add</code> is in <code>WB</code> and has the door. The fourth <code>add</code> waits again." },

      { sub: "shared", cycle: 8, marks: [[1, "the door is free: add 4 reads"]], chip: 4, foot: "", narrate: "Only in cycle 8 is the door free, and the fourth <code>add</code> finally reads its registers." },
      { sub: "tshared", rows: 11, cur: 0, hl: "bubbles", chip: 4, foot: "", narrate: "As a table: the fourth <code>add</code> finishes in cycle 11, not cycle 8. Three cycles lost, on four instructions that had nothing to do with each other." },
      { sub: "card", card: cd("The cost of one door", ["every instruction needs the door twice", "once to read, once to write", "one door: one instruction every two cycles"]), chip: 4, foot: "", narrate: "It gets worse with a longer program. Every instruction needs the door twice, once to read and once to write, so a single door can serve only one instruction every two cycles. The pipeline we built to finish one per cycle would run at half speed." },
      { sub: "card", card: cd("The fix", ["build more doors, as the real E20 does", "or stall one of them, as we just did", "hardware cost against cycles lost"]), chip: 4, foot: "", narrate: "So the real E20 pays for three doors and has no structural hazards at all. A cheaper design could save the wires and pay in stalls instead. A structural hazard is a hardware budget decision, not a mistake in the program." },
      { sub: "lwc", cycle: 4, marks: [[0, "IF: fetch reads memory"], [3, "lw MEM: data reads memory"]], chip: 5, foot: "", narrate: "The register file is not the only shared hardware. Memory holds both the instructions and the data. In cycle 4 the fourth instruction is in <code>IF</code>, which reads an instruction from memory, while the <code>lw</code> is in <code>MEM</code>, which reads data from memory. One memory, two accesses, one cycle." },
