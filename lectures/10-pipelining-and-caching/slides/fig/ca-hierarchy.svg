<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#404040"/></marker>
  <marker id="r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c8202f"/></marker></defs>
  <text x="450" y="40" fill="#6d6d6d" font-size="15" font-weight="400" text-anchor="middle" font-style="italic">lw $1, 5($0): where does the value come from?</text>
  <rect x="60" y="110" width="150" height="90" rx="14" fill="#e2cdf2" stroke="#57068c" stroke-width="4"/>
  <text x="135" y="152" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">CPU</text>
  <text x="135" y="180" fill="#6d6d6d" font-size="13" font-weight="400" text-anchor="middle">registers, ALU</text>
  <rect x="360" y="125" width="120" height="60" rx="12" fill="#fbe9ea" stroke="#c8202f" stroke-width="4"/>
  <text x="420" y="160" fill="#c8202f" font-size="20" font-weight="700" text-anchor="middle">cache</text>
  <text x="420" y="205" fill="#6d6d6d" font-size="13" font-weight="400" text-anchor="middle" font-style="italic">small and fast</text>
  <rect x="660" y="90" width="190" height="130" rx="14" fill="#e2cdf2" stroke="#57068c" stroke-width="4"/>
  <text x="755" y="150" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">RAM</text>
  <text x="755" y="178" fill="#6d6d6d" font-size="13" font-weight="400" text-anchor="middle">big and slow</text>
  <polyline points="210,155 358,155" fill="none" stroke="#404040" stroke-width="4" marker-end="url(#a)" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="284" y="140" fill="#404040" font-size="14" font-weight="700" text-anchor="middle">~1 ns</text>
  <polyline points="480,155 658,155" fill="none" stroke="#404040" stroke-width="4" marker-end="url(#a)" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="569" y="140" fill="#404040" font-size="14" font-weight="700" text-anchor="middle">~50 ns</text>
  <text x="450" y="262" fill="#6d6d6d" font-size="13" font-weight="400" text-anchor="middle" font-style="italic">the CPU always asks the cache first; only a miss makes the long trip to RAM</text>
</svg>