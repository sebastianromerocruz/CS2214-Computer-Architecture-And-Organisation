<text x="528" y="150" fill="#c1272d" font-size="14" font-weight="700">jeq resolves in EX (cycle 3):</text>
<text x="528" y="170" fill="#c1272d" font-size="14" font-weight="700">branch taken, so flush the two fetches</text>
<text x="528" y="298" fill="#2e7d32" font-size="14" font-weight="700">the real target enters IF in cycle 4, not cycle 2: 2 cycles lost</text>
<text x="480" y="324" fill="#404040" font-size="13" text-anchor="middle">cycles thrown away, not just re-fetched: that is the real cost of a control hazard</text>
