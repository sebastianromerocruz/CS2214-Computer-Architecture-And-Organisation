<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" font-family="Helvetica, Arial, sans-serif">
<rect width="1150" height="400" rx="24" fill="#eee6f3"/>
<text x="575.0" y="30" fill="#6d6d6d" font-size="17" text-anchor="middle">ten E15 instructions as a dependency graph: an arrow means this pair must keep its order</text>
<text x="40" y="66" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">1</text>
<text x="52" y="66" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">movi Rg0 ← 5</text>
<text x="40" y="98" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">2</text>
<text x="52" y="98" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">lw Rg1 ← mem[Rg0]</text>
<text x="40" y="130" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">3</text>
<text x="52" y="130" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">add Rg1 ← Rg0 + Rg1</text>
<text x="40" y="162" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">4</text>
<text x="52" y="162" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">movi Rg2 ← 0</text>
<text x="40" y="194" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">5</text>
<text x="52" y="194" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">lw Rg3 ← mem[Rg2]</text>
<text x="40" y="226" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">6</text>
<text x="52" y="226" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">add Rg1 ← Rg3 + Rg1</text>
<text x="40" y="258" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">7</text>
<text x="52" y="258" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">addi Rg1 ← Rg1 + 0</text>
<text x="40" y="290" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">8</text>
<text x="52" y="290" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">movi Rg3 ← 8</text>
<text x="40" y="322" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">9</text>
<text x="52" y="322" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">sw mem[Rg3] ← Rg1</text>
<text x="40" y="354" fill="#6d6d6d" font-size="16" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">10</text>
<text x="52" y="354" fill="#1a1a1a" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">sub Rg1 ← Rg1 - Rg0</text>
