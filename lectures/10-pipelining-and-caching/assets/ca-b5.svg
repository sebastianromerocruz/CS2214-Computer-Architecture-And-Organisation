<text x="940" y="176" fill="#6d6d6d" font-size="16" font-weight="600" text-anchor="middle">1 cell used, 7 hauled for nothing</text>
<text x="575" y="240" fill="#c1272d" font-size="19" font-weight="700" text-anchor="middle">bandwidth and energy spent carrying cells nobody asks for, each block evicted before its neighbours are touched</text>
<text x="575" y="280" fill="#6d6d6d" font-size="18" font-weight="600" text-anchor="middle">with no spatial locality, big blocks do worse than no blocks at all</text>
<text x="575" y="320" fill="#2e7d32" font-size="19" font-weight="700" text-anchor="middle">so structure your data to win the bet: arrays and linear loops, not linked lists</text>
