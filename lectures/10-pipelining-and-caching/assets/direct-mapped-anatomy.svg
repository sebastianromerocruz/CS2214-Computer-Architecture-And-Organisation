<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="876" cy="456" r="7" fill="#7b5aa6"/>

  <text x="450" y="40" fill="#57068c" font-size="18" font-weight="700" text-anchor="middle">one address, three jobs: tag, index, offset</text>

  <!-- address bit field -->
  <rect x="150" y="65" width="240" height="42" fill="#ffffff" stroke="#57068c" stroke-width="4"/>
  <text x="270" y="91" fill="#57068c" font-size="14" font-weight="700" text-anchor="middle">tag</text>
  <rect x="390" y="65" width="150" height="42" fill="#ffffff" stroke="#7b5aa6" stroke-width="4"/>
  <text x="465" y="91" fill="#7b5aa6" font-size="14" font-weight="700" text-anchor="middle">index (row)</text>
  <rect x="540" y="65" width="130" height="42" fill="#ffffff" stroke="#a98fc9" stroke-width="4"/>
  <text x="605" y="91" fill="#a98fc9" font-size="14" font-weight="700" text-anchor="middle">offset</text>
  <text x="150" y="122" fill="#6d6d6d" font-size="11">MSB</text>
  <text x="655" y="122" fill="#6d6d6d" font-size="11" text-anchor="end">LSB</text>

  <!-- arrows down to cache table -->
  <line x1="465" y1="107" x2="465" y2="170" stroke="#7b5aa6" stroke-width="4" marker-end="url(#a2)"/>
  <text x="472" y="150" fill="#7b5aa6" font-size="11">selects the row</text>

  <line x1="270" y1="107" x2="270" y2="140" stroke="#57068c" stroke-width="4"/>
  <line x1="270" y1="140" x2="620" y2="140" stroke="#57068c" stroke-width="4"/>
  <line x1="620" y1="140" x2="620" y2="170" stroke="#57068c" stroke-width="4" marker-end="url(#a1)"/>
  <text x="440" y="132" fill="#57068c" font-size="11" text-anchor="middle">compared against the stored tag at that row</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#57068c"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b5aa6"/></marker>
  </defs>

  <!-- cache table -->
  <g font-size="12" font-weight="700" fill="#57068c">
    <text x="230" y="192" text-anchor="middle">Row</text>
    <text x="290" y="192" text-anchor="middle">V</text>
    <text x="360" y="192" text-anchor="middle">Tag</text>
    <text x="620" y="192" text-anchor="middle">Value (block)</text>
  </g>
  <line x1="180" y1="200" x2="700" y2="200" stroke="#57068c" stroke-width="2"/>

  <g font-size="12" fill="#404040" text-anchor="middle">
    <text x="230" y="222">0</text><text x="290" y="222">1</text><text x="360" y="222">24</text><text x="620" y="222">[0,42,3,55,9,12,0,9]</text>
    <text x="230" y="248">1</text><text x="290" y="248">0</text><text x="360" y="248">—</text><text x="620" y="248">—</text>
    <text x="230" y="274">2</text><text x="290" y="274">1</text><text x="360" y="274">7</text><text x="620" y="274">[81,4,2,0,6,1,9,3]</text>
    <text x="230" y="300">3</text><text x="290" y="300">0</text><text x="360" y="300">—</text><text x="620" y="300">—</text>
  </g>
  <rect x="180" y="205" width="520" height="105" fill="none" stroke="#57068c" stroke-width="2"/>
  <rect x="180" y="257" width="520" height="26" fill="#ffe08a" opacity="0.5"/>

  <!-- decision -->
  <polygon points="465,340 545,375 465,410 385,375" fill="#ffffff" stroke="#8900e1" stroke-width="4"/>
  <text x="465" y="371" fill="#57068c" font-size="12" font-weight="700" text-anchor="middle">valid &amp;</text>
  <text x="465" y="385" fill="#57068c" font-size="12" font-weight="700" text-anchor="middle">tag match?</text>
  <line x1="465" y1="310" x2="465" y2="340" stroke="#8900e1" stroke-width="4" marker-end="url(#a2)"/>

  <text x="580" y="372" fill="#57068c" font-size="13" font-weight="700">YES → HIT: return the value</text>
  <text x="580" y="392" fill="#7b5aa6" font-size="13" font-weight="700">NO → MISS: fetch block from RAM, evict, retry</text>

  <text x="450" y="450" fill="#6d6d6d" font-size="12" text-anchor="middle" font-style="italic">row 2 highlighted: valid=1, tag=7 stored — only a request whose tag also equals 7 is a hit here</text>
</svg>
