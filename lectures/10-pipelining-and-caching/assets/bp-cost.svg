<text x="220" y="98" fill="#57068c" font-size="28" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">200</text>
<text x="220" y="346" fill="#1a1a1a" font-size="16" font-weight="700" text-anchor="middle">always stall</text>
<rect x="325" y="131" width="110" height="189" rx="6" fill="#fbe9ea" stroke="#c1272d" stroke-width="4"/>
<text x="380" y="119" fill="#c1272d" font-size="28" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">180</text>
<text x="380" y="346" fill="#1a1a1a" font-size="16" font-weight="700" text-anchor="middle">guess not taken</text>
<text x="300" y="372" fill="#6d6d6d" font-size="18" font-weight="700" text-anchor="middle">taken 90 times out of 100</text>
<rect x="715" y="110" width="110" height="210" rx="6" fill="#57068c" stroke="#57068c" stroke-width="4"/>
<text x="770" y="98" fill="#57068c" font-size="28" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">200</text>
<text x="770" y="346" fill="#1a1a1a" font-size="16" font-weight="700" text-anchor="middle">always stall</text>
<rect x="875" y="299" width="110" height="21" rx="6" fill="#fbe9ea" stroke="#c1272d" stroke-width="4"/>
<text x="930" y="287" fill="#c1272d" font-size="28" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">20</text>
<text x="930" y="346" fill="#1a1a1a" font-size="16" font-weight="700" text-anchor="middle">guess not taken</text>
<text x="850" y="372" fill="#6d6d6d" font-size="18" font-weight="700" text-anchor="middle">taken 10 times out of 100</text>
<text x="300" y="62" fill="#c1272d" font-size="19" font-weight="700" text-anchor="middle">only a 10% win: barely worth it</text>
