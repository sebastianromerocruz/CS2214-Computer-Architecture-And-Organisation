<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#57068c"/></marker></defs>
<rect width="1150" height="400" rx="24" fill="#eee6f3"/>
<text x="575.0" y="32" fill="#6d6d6d" font-size="17" text-anchor="middle">attempt one: row = address % 4. A quarter of all addresses are routed to each row, and the row cannot tell them apart.</text>
