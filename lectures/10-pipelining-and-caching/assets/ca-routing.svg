<text x="167" y="96" fill="#57068c" font-size="24" font-weight="700" text-anchor="middle">row 0</text>
<text x="167" y="140" fill="#1a1a1a" font-size="20" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">address 0</text>
<text x="167" y="174" fill="#1a1a1a" font-size="20" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">address 4</text>
<text x="167" y="208" fill="#1a1a1a" font-size="20" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">address 8</text>
<text x="167" y="242" fill="#1a1a1a" font-size="20" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">address 12</text>
<text x="167" y="282" fill="#6d6d6d" font-size="16" font-weight="600" text-anchor="middle">…and so on</text>
