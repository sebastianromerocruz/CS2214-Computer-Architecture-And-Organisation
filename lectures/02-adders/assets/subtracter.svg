<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="796" cy="356" r="7" fill="#7b5aa6"/>

  <!-- A: straight into the adder's top input -->
  <line x1="30" y1="130" x2="400" y2="130" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="30" cy="130" r="6" fill="#57068c"/>
  <text x="14" y="114" fill="#404040" font-size="24" font-weight="600">A</text>

  <!-- B: through a small inverter, then into the adder's middle input -->
  <line x1="30" y1="180" x2="150" y2="180" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="30" cy="180" r="6" fill="#57068c"/>
  <text x="14" y="164" fill="#404040" font-size="24" font-weight="600">B</text>

  <!-- mini NOT gate: triangle + inversion bubble -->
  <path d="M150,160 L150,200 L195,180 Z" fill="#ffffff" stroke="#57068c" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="203" cy="180" r="7" fill="#ffffff" stroke="#8900e1" stroke-width="4"/>

  <line x1="210" y1="180" x2="400" y2="180" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <text x="230" y="170" fill="#6d6d6d" font-size="14" font-style="italic">~B</text>

  <!-- Cin tied to the constant 1 -->
  <rect x="150" y="215" width="44" height="34" rx="6" fill="#171715" stroke="#57068c" stroke-width="3"/>
  <text x="172" y="238" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">1</text>
  <line x1="194" y1="232" x2="400" y2="232" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <text x="230" y="222" fill="#6d6d6d" font-size="14" font-style="italic">Cin = 1</text>

  <!-- the adder itself, reused as-is -->
  <rect x="400" y="100" width="160" height="160" rx="18" fill="#ffffff" stroke="#57068c" stroke-width="6"/>
  <text x="480" y="188" fill="#57068c" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">ADDER</text>
  <text x="480" y="140" fill="#6d6d6d" font-size="13" text-anchor="middle" font-style="italic">(same circuit as Fig. IV)</text>

  <!-- Diff output -->
  <line x1="560" y1="150" x2="700" y2="150" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="700" cy="150" r="6" fill="#8900e1"/>
  <text x="714" y="158" fill="#8900e1" font-size="24" font-weight="700">A &#8722; B</text>

  <!-- Bout output -->
  <line x1="560" y1="220" x2="700" y2="220" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="700" cy="220" r="6" fill="#8900e1"/>
  <text x="714" y="228" fill="#8900e1" font-size="22" font-weight="700">Bout</text>

  <text x="410" y="330" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">A &#8722; B  =  A + (~B) + 1</text>
  <text x="410" y="352" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">invert B, then let Cin=1 supply the "add one" step for free</text>
</svg>
