<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="676" cy="396" r="7" fill="#7b5aa6"/>

  <!-- D0 input (top) -->
  <line x1="60" y1="90" x2="220" y2="90" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="60" cy="90" r="6" fill="#57068c"/>
  <text x="42" y="74" fill="#404040" font-size="22" font-weight="600">D0</text>
  <text x="234" y="96" fill="#8900e1" font-size="15" font-weight="700">0</text>

  <!-- D1 input (bottom) -->
  <line x1="60" y1="190" x2="220" y2="190" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="60" cy="190" r="6" fill="#57068c"/>
  <text x="42" y="212" fill="#404040" font-size="22" font-weight="600">D1</text>
  <text x="234" y="204" fill="#8900e1" font-size="15" font-weight="700">1</text>

  <!-- trapezoid mux body: wide on the input side, narrow on the output side -->
  <path d="M220,60 L380,120 L380,160 L220,220 Z" fill="#ffffff" stroke="#57068c" stroke-width="7" stroke-linejoin="round"/>

  <!-- output Q -->
  <line x1="380" y1="140" x2="500" y2="140" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="500" cy="140" r="6" fill="#8900e1"/>
  <text x="514" y="148" fill="#8900e1" font-size="26" font-weight="700">Q</text>

  <!-- selector S, entering from below -->
  <line x1="300" y1="330" x2="300" y2="150" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="330" r="6" fill="#57068c"/>
  <text x="314" y="350" fill="#404040" font-size="22" font-weight="600">S</text>

  <text x="300" y="150" fill="#57068c" font-size="15" text-anchor="middle">&#9660;</text>

  <text x="350" y="380" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">Q = (D0 &amp; ~S) | (D1 &amp; S)</text>
  <text x="350" y="20" fill="#6d6d6d" font-size="14" font-style="italic" text-anchor="middle" transform="translate(0,20)"></text>
</svg>
