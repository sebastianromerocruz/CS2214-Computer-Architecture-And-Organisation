  <text x="280" y="443" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">1010 &amp; 0110 = 0010  &#8594;  10 &amp; 6 = 2</text>
  <text x="280" y="463" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">one AND gate per bit position, no carry between columns</text>
