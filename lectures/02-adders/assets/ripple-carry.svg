<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="776" cy="396" r="7" fill="#7b5aa6"/>

  <!-- Cin=0 constant feeding bit 0 -->
  <rect x="40" y="165" width="44" height="34" rx="6" fill="#171715" stroke="#57068c" stroke-width="3"/>
  <text x="62" y="188" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">0</text>
  <line x1="84" y1="182" x2="120" y2="182" stroke="#404040" stroke-width="5" stroke-linecap="round"/>

  <!-- three full-adder boxes -->
  <!-- box 0 -->
  <rect x="120" y="140" width="140" height="100" rx="14" fill="#ffffff" stroke="#57068c" stroke-width="6"/>
  <text x="190" y="197" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">FA</text>
  <text x="190" y="127" fill="#6d6d6d" font-size="13" text-anchor="middle">bit 0</text>

  <!-- box 1 -->
  <rect x="320" y="140" width="140" height="100" rx="14" fill="#ffffff" stroke="#57068c" stroke-width="6"/>
  <text x="390" y="197" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">FA</text>
  <text x="390" y="127" fill="#6d6d6d" font-size="13" text-anchor="middle">bit 1</text>

  <!-- box 2 -->
  <rect x="520" y="140" width="140" height="100" rx="14" fill="#ffffff" stroke="#57068c" stroke-width="6"/>
  <text x="590" y="197" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">FA</text>
  <text x="590" y="127" fill="#6d6d6d" font-size="13" text-anchor="middle">bit 2</text>

  <!-- carry chain: box0 -> box1 -> box2 -->
  <line x1="260" y1="182" x2="320" y2="182" stroke="#8900e1" stroke-width="5" stroke-linecap="round"/>
  <text x="290" y="172" fill="#8900e1" font-size="13" text-anchor="middle">c1</text>

  <line x1="460" y1="182" x2="520" y2="182" stroke="#8900e1" stroke-width="5" stroke-linecap="round"/>
  <text x="490" y="172" fill="#8900e1" font-size="13" text-anchor="middle">c2</text>

  <!-- final carry out -->
  <line x1="660" y1="182" x2="730" y2="182" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="730" cy="182" r="6" fill="#8900e1"/>
  <text x="666" y="215" fill="#8900e1" font-size="15" font-weight="700">Cout</text>
  <text x="666" y="232" fill="#6d6d6d" font-size="12" font-style="italic">(overflow)</text>

  <!-- A/B input pairs into each box -->
  <!-- box 0 -->
  <line x1="155" y1="95" x2="155" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="155" cy="95" r="5" fill="#57068c"/>
  <text x="155" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">A[0]</text>
  <line x1="225" y1="95" x2="225" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="225" cy="95" r="5" fill="#57068c"/>
  <text x="225" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">B[0]</text>

  <!-- box 1 -->
  <line x1="355" y1="95" x2="355" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="355" cy="95" r="5" fill="#57068c"/>
  <text x="355" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">A[1]</text>
  <line x1="425" y1="95" x2="425" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="425" cy="95" r="5" fill="#57068c"/>
  <text x="425" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">B[1]</text>

  <!-- box 2 -->
  <line x1="555" y1="95" x2="555" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="555" cy="95" r="5" fill="#57068c"/>
  <text x="555" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">A[2]</text>
  <line x1="625" y1="95" x2="625" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="625" cy="95" r="5" fill="#57068c"/>
  <text x="625" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">B[2]</text>

  <!-- Sum outputs, straight down from each box -->
  <line x1="190" y1="240" x2="190" y2="300" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="190" cy="300" r="6" fill="#8900e1"/>
  <text x="190" y="325" fill="#8900e1" font-size="18" font-weight="700" text-anchor="middle">S[0]</text>

  <line x1="390" y1="240" x2="390" y2="300" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="390" cy="300" r="6" fill="#8900e1"/>
  <text x="390" y="325" fill="#8900e1" font-size="18" font-weight="700" text-anchor="middle">S[1]</text>

  <line x1="590" y1="240" x2="590" y2="300" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="590" cy="300" r="6" fill="#8900e1"/>
  <text x="590" y="325" fill="#8900e1" font-size="18" font-weight="700" text-anchor="middle">S[2]</text>

  <text x="400" y="380" fill="#57068c" font-size="15" font-style="italic" font-weight="600" text-anchor="middle">each full adder's carry-out feeds the next one's carry-in: that chain is the "ripple"</text>
</svg>
