<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="676" cy="396" r="7" fill="#7b5aa6"/>

  <!-- inputs -->
  <line x1="40" y1="90" x2="230" y2="90" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="90" r="6" fill="#57068c"/>
  <text x="24" y="73" fill="#404040" font-size="22" font-weight="600">A</text>

  <line x1="40" y1="150" x2="230" y2="150" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="150" r="6" fill="#57068c"/>
  <text x="24" y="133" fill="#404040" font-size="22" font-weight="600">B</text>

  <line x1="40" y1="230" x2="230" y2="230" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="230" r="6" fill="#57068c"/>
  <text x="24" y="252" fill="#404040" font-size="22" font-weight="600">Op</text>

  <!-- outputs -->
  <line x1="470" y1="150" x2="600" y2="150" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="600" cy="150" r="6" fill="#8900e1"/>
  <text x="614" y="158" fill="#8900e1" font-size="26" font-weight="700">Y</text>

  <line x1="470" y1="250" x2="600" y2="250" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="600" cy="250" r="6" fill="#8900e1"/>
  <text x="614" y="258" fill="#8900e1" font-size="20" font-weight="700">Zero</text>

  <!-- opaque module boundary, same dashed convention as the Verilog module figure -->
  <rect x="230" y="60" width="240" height="240" rx="18" fill="#ffffff" stroke="#57068c" stroke-width="7" stroke-dasharray="16 10"/>

  <circle cx="310" cy="260" r="4" fill="#c9b3e0"/>
  <circle cx="345" cy="260" r="4" fill="#c9b3e0"/>
  <circle cx="380" cy="260" r="4" fill="#c9b3e0"/>

  <text x="350" y="140" fill="#57068c" font-size="26" font-weight="700" text-anchor="middle">ALU</text>
  <text x="350" y="165" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">one Op input selects the operation</text>

  <line x1="255" y1="180" x2="445" y2="180" stroke="#d8c7ea" stroke-width="2"/>
  <text x="350" y="200" fill="#404040" font-size="13" text-anchor="middle" font-family="monospace">AND &#183; OR &#183; ADD</text>
  <text x="350" y="220" fill="#404040" font-size="13" text-anchor="middle" font-family="monospace">SUB &#183; SLT &#183; ...</text>

  <text x="350" y="340" fill="#57068c" font-size="15" font-style="italic" font-weight="600" text-anchor="middle">every building block from this lecture, behind one selector</text>
</svg>
