<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="480" rx="28" fill="#eee6f3"/>
  <rect x="24" y="24" width="14" height="14" fill="#8900e1"/>
  <circle cx="536" cy="456" r="7" fill="#7b5aa6"/>

  <!-- legend, row 1 only -->
  <text x="130" y="87" fill="#404040" font-size="14" font-weight="700" text-anchor="middle">A</text>
  <text x="480" y="87" fill="#404040" font-size="14" font-weight="700" text-anchor="middle">Y</text>

  <!-- row: weight 8, A=0 -> Y=1 -->
  <text x="40" y="116" fill="#6d6d6d" font-size="16" font-weight="600">8s</text>
  <line x1="143" y1="110" x2="280" y2="110" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="117" y="97" width="26" height="26" rx="6" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
  <text x="130" y="115" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">0</text>
  <path d="M280,90 L280,130 L315,110 Z" fill="#ffffff" stroke="#57068c" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="322" cy="110" r="7" fill="#ffffff" stroke="#8900e1" stroke-width="4"/>
  <line x1="329" y1="110" x2="467" y2="110" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="467" y="97" width="26" height="26" rx="6" fill="#f3e9ff" stroke="#8900e1" stroke-width="3"/>
  <text x="480" y="115" fill="#8900e1" font-size="16" font-weight="700" text-anchor="middle">1</text>

  <!-- row: weight 4, A=1 -> Y=0 -->
  <text x="40" y="206" fill="#6d6d6d" font-size="16" font-weight="600">4s</text>
  <line x1="143" y1="200" x2="280" y2="200" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="117" y="187" width="26" height="26" rx="6" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
  <text x="130" y="205" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">1</text>
  <path d="M280,180 L280,220 L315,200 Z" fill="#ffffff" stroke="#57068c" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="322" cy="200" r="7" fill="#ffffff" stroke="#8900e1" stroke-width="4"/>
  <line x1="329" y1="200" x2="467" y2="200" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="467" y="187" width="26" height="26" rx="6" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
  <text x="480" y="205" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">0</text>

  <!-- row: weight 2, A=1 -> Y=0 -->
  <text x="40" y="296" fill="#6d6d6d" font-size="16" font-weight="600">2s</text>
  <line x1="143" y1="290" x2="280" y2="290" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="117" y="277" width="26" height="26" rx="6" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
  <text x="130" y="295" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">1</text>
  <path d="M280,270 L280,310 L315,290 Z" fill="#ffffff" stroke="#57068c" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="322" cy="290" r="7" fill="#ffffff" stroke="#8900e1" stroke-width="4"/>
  <line x1="329" y1="290" x2="467" y2="290" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="467" y="277" width="26" height="26" rx="6" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
  <text x="480" y="295" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">0</text>

  <!-- row: weight 1, A=0 -> Y=1 -->
  <text x="40" y="386" fill="#6d6d6d" font-size="16" font-weight="600">1s</text>
  <line x1="143" y1="380" x2="280" y2="380" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="117" y="367" width="26" height="26" rx="6" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
  <text x="130" y="385" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">0</text>
  <path d="M280,360 L280,400 L315,380 Z" fill="#ffffff" stroke="#57068c" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="322" cy="380" r="7" fill="#ffffff" stroke="#8900e1" stroke-width="4"/>
  <line x1="329" y1="380" x2="467" y2="380" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <rect x="467" y="367" width="26" height="26" rx="6" fill="#f3e9ff" stroke="#8900e1" stroke-width="3"/>
  <text x="480" y="385" fill="#8900e1" font-size="16" font-weight="700" text-anchor="middle">1</text>

  <text x="280" y="443" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">~0110 = 1001  &#8594;  ~6 = 9  (4-bit)</text>
  <text x="280" y="463" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">one inverter per bit, the result depends entirely on bit-width</text>
</svg>
