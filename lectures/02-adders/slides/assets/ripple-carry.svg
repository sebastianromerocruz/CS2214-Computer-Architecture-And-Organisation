<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="420" rx="28" fill="#f2f2ef"/>
  <rect x="20" y="20" width="14" height="14" fill="#c1272d"/>
  <circle cx="976" cy="396" r="7" fill="#8a1f24"/>

  <!-- Cin=0 constant feeding bit 0 -->
  <rect x="40" y="165" width="44" height="34" rx="6" fill="#171715" stroke="#171715" stroke-width="3"/>
  <text x="62" y="188" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">0</text>
  <line x1="84" y1="182" x2="120" y2="182" stroke="#404040" stroke-width="5" stroke-linecap="round"/>

  <!-- four full-adder boxes -->
  <!-- box 0 -->
  <rect x="120" y="140" width="140" height="100" rx="14" fill="#ffffff" stroke="#171715" stroke-width="6"/>
  <text x="190" y="197" fill="#171715" font-size="20" font-weight="700" text-anchor="middle">FA</text>
  <text x="190" y="127" fill="#6d6d6d" font-size="13" text-anchor="middle">bit 0</text>

  <!-- box 1 -->
  <rect x="320" y="140" width="140" height="100" rx="14" fill="#ffffff" stroke="#171715" stroke-width="6"/>
  <text x="390" y="197" fill="#171715" font-size="20" font-weight="700" text-anchor="middle">FA</text>
  <text x="390" y="127" fill="#6d6d6d" font-size="13" text-anchor="middle">bit 1</text>

  <!-- box 2 -->
  <rect x="520" y="140" width="140" height="100" rx="14" fill="#ffffff" stroke="#171715" stroke-width="6"/>
  <text x="590" y="197" fill="#171715" font-size="20" font-weight="700" text-anchor="middle">FA</text>
  <text x="590" y="127" fill="#6d6d6d" font-size="13" text-anchor="middle">bit 2</text>

  <!-- box 3 -->
  <rect x="720" y="140" width="140" height="100" rx="14" fill="#ffffff" stroke="#171715" stroke-width="6"/>
  <text x="790" y="197" fill="#171715" font-size="20" font-weight="700" text-anchor="middle">FA</text>
  <text x="790" y="127" fill="#6d6d6d" font-size="13" text-anchor="middle">bit 3</text>

  <!-- carry chain: box0 -> box1 -> box2 -> box3 -->
  <line x1="260" y1="182" x2="320" y2="182" stroke="#c1272d" stroke-width="5" stroke-linecap="round"/>
  <text x="290" y="172" fill="#c1272d" font-size="13" text-anchor="middle">C1</text>

  <line x1="460" y1="182" x2="520" y2="182" stroke="#c1272d" stroke-width="5" stroke-linecap="round"/>
  <text x="490" y="172" fill="#c1272d" font-size="13" text-anchor="middle">C2</text>

  <line x1="660" y1="182" x2="720" y2="182" stroke="#c1272d" stroke-width="5" stroke-linecap="round"/>
  <text x="690" y="172" fill="#c1272d" font-size="13" text-anchor="middle">C3</text>

  <!-- final carry out -->
  <line x1="860" y1="182" x2="930" y2="182" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="930" cy="182" r="6" fill="#c1272d"/>
  <text x="866" y="215" fill="#c1272d" font-size="15" font-weight="700">Cout</text>
  <text x="866" y="232" fill="#6d6d6d" font-size="12" font-style="italic">(overflow)</text>

  <!-- A/B input pairs into each box -->
  <!-- box 0 -->
  <line x1="155" y1="95" x2="155" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="155" cy="95" r="5" fill="#171715"/>
  <text x="155" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">A0</text>
  <line x1="225" y1="95" x2="225" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="225" cy="95" r="5" fill="#171715"/>
  <text x="225" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">B0</text>

  <!-- box 1 -->
  <line x1="355" y1="95" x2="355" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="355" cy="95" r="5" fill="#171715"/>
  <text x="355" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">A1</text>
  <line x1="425" y1="95" x2="425" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="425" cy="95" r="5" fill="#171715"/>
  <text x="425" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">B1</text>

  <!-- box 2 -->
  <line x1="555" y1="95" x2="555" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="555" cy="95" r="5" fill="#171715"/>
  <text x="555" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">A2</text>
  <line x1="625" y1="95" x2="625" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="625" cy="95" r="5" fill="#171715"/>
  <text x="625" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">B2</text>

  <!-- box 3 -->
  <line x1="755" y1="95" x2="755" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="755" cy="95" r="5" fill="#171715"/>
  <text x="755" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">A3</text>
  <line x1="825" y1="95" x2="825" y2="140" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="825" cy="95" r="5" fill="#171715"/>
  <text x="825" y="80" fill="#404040" font-size="15" font-weight="600" text-anchor="middle">B3</text>

  <!-- Sum outputs, straight down from each box -->
  <line x1="190" y1="240" x2="190" y2="300" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="190" cy="300" r="6" fill="#c1272d"/>
  <text x="190" y="325" fill="#c1272d" font-size="18" font-weight="700" text-anchor="middle">S0</text>

  <line x1="390" y1="240" x2="390" y2="300" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="390" cy="300" r="6" fill="#c1272d"/>
  <text x="390" y="325" fill="#c1272d" font-size="18" font-weight="700" text-anchor="middle">S1</text>

  <line x1="590" y1="240" x2="590" y2="300" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="590" cy="300" r="6" fill="#c1272d"/>
  <text x="590" y="325" fill="#c1272d" font-size="18" font-weight="700" text-anchor="middle">S2</text>

  <line x1="790" y1="240" x2="790" y2="300" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="790" cy="300" r="6" fill="#c1272d"/>
  <text x="790" y="325" fill="#c1272d" font-size="18" font-weight="700" text-anchor="middle">S3</text>

  <text x="500" y="380" fill="#171715" font-size="15" font-style="italic" font-weight="600" text-anchor="middle">each full adder's carry-out feeds the next one's carry-in: that chain is the "ripple"</text>
</svg>
