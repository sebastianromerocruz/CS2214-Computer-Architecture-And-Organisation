<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="260" rx="24" fill="#f2f2ef"/>
  <rect x="20" y="20" width="12" height="12" fill="#c1272d"/>
  <circle cx="382" cy="240" r="6" fill="#8a1f24"/>

  <!-- input wire -->
  <line x1="40" y1="120" x2="130" y2="120" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="120" r="6" fill="#171715"/>
  <text x="26" y="98" fill="#404040" font-size="22" font-weight="600">A</text>

  <!-- output wire -->
  <line x1="223" y1="120" x2="340" y2="120" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="340" cy="120" r="6" fill="#171715"/>
  <text x="350" y="128" fill="#404040" font-size="22" font-weight="600">Y</text>

  <!-- triangle body -->
  <path d="M120,70 L120,170 L195,120 Z" fill="#ffffff" stroke="#171715" stroke-width="7" stroke-linejoin="round"/>

  <!-- inversion bubble -->
  <circle cx="209" cy="120" r="14" fill="#ffffff" stroke="#c1272d" stroke-width="6"/>

  <!-- labels -->
  <text x="200" y="222" fill="#171715" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="3">NOT</text>
  <text x="200" y="245" fill="#6d6d6d" font-size="15" text-anchor="middle" letter-spacing="0.5">Y = &#172;A</text>
</svg>
