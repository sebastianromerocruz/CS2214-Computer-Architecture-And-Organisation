<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="430" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="656" cy="406" r="7" fill="#7b5aa6"/>

  <!-- register body -->
  <rect x="260" y="80" width="200" height="200" rx="18" fill="#ffffff" stroke="#57068c" stroke-width="7"/>
  <text x="360" y="150" fill="#57068c" font-size="24" font-weight="700" text-anchor="middle">REGISTER</text>
  <text x="360" y="172" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">4 &#215; D flip-flops, one shared clock</text>

  <!-- left inputs D3..D0 -->
  <g>
    <line x1="100" y1="115" x2="260" y2="115" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="115" r="6" fill="#57068c"/>
    <text x="80" y="121" fill="#404040" font-size="16" font-weight="600" text-anchor="end">D3</text>

    <line x1="100" y1="158" x2="260" y2="158" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="158" r="6" fill="#57068c"/>
    <text x="80" y="164" fill="#404040" font-size="16" font-weight="600" text-anchor="end">D2</text>

    <line x1="100" y1="201" x2="260" y2="201" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="201" r="6" fill="#57068c"/>
    <text x="80" y="207" fill="#404040" font-size="16" font-weight="600" text-anchor="end">D1</text>

    <line x1="100" y1="244" x2="260" y2="244" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="244" r="6" fill="#57068c"/>
    <text x="80" y="250" fill="#404040" font-size="16" font-weight="600" text-anchor="end">D0</text>
  </g>

  <!-- right outputs Q3..Q0 -->
  <g>
    <line x1="460" y1="115" x2="620" y2="115" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="620" cy="115" r="6" fill="#57068c"/>
    <text x="632" y="121" fill="#404040" font-size="16" font-weight="600">Q3</text>

    <line x1="460" y1="158" x2="620" y2="158" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="620" cy="158" r="6" fill="#57068c"/>
    <text x="632" y="164" fill="#404040" font-size="16" font-weight="600">Q2</text>

    <line x1="460" y1="201" x2="620" y2="201" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="620" cy="201" r="6" fill="#57068c"/>
    <text x="632" y="207" fill="#404040" font-size="16" font-weight="600">Q1</text>

    <line x1="460" y1="244" x2="620" y2="244" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
    <circle cx="620" cy="244" r="6" fill="#57068c"/>
    <text x="632" y="250" fill="#404040" font-size="16" font-weight="600">Q0</text>
  </g>

  <!-- clock input, triangle edge-trigger marker -->
  <polygon points="345,280 375,280 360,262" fill="#eee6f3" stroke="#57068c" stroke-width="4" stroke-linejoin="round"/>
  <line x1="360" y1="280" x2="360" y2="320" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="360" cy="320" r="6" fill="#57068c"/>
  <text x="360" y="340" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">CLK</text>

  <text x="340" y="380" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">sample on the edge, hold otherwise</text>
  <text x="340" y="400" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">D&#8323;&#8211;D&#8320; capture together; Q&#8323;&#8211;Q&#8320; update together, once per clock</text>
</svg>
