<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="736" cy="376" r="7" fill="#7b5aa6"/>

  <g transform="translate(60,0)">
    <!-- lane labels -->
    <text x="50" y="84" fill="#57068c" font-size="15" font-weight="700" text-anchor="end">clk</text>
    <text x="50" y="154" fill="#404040" font-size="14" font-weight="600" text-anchor="end">addr</text>
    <text x="50" y="219" fill="#404040" font-size="14" font-weight="600" text-anchor="end">addr_reg</text>
    <text x="50" y="284" fill="#404040" font-size="14" font-weight="600" text-anchor="end">q</text>

    <!-- clk waveform -->
    <path d="M60,90 L150,90 L150,60 L240,60 L240,90 L330,90 L330,60 L420,60 L420,90 L470,90"
          fill="none" stroke="#404040" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- posedge markers -->
    <line x1="150" y1="60" x2="150" y2="330" stroke="#8900e1" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="150" cy="60" r="5" fill="#57068c"/>
    <line x1="330" y1="60" x2="330" y2="330" stroke="#8900e1" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="330" cy="60" r="5" fill="#57068c"/>

    <!-- addr lane: constant, known value -->
    <rect x="60" y="132" width="410" height="36" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
    <text x="265" y="155" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle">addr = 5</text>

    <!-- addr_reg lane: unknown until posedge 1, then 5 -->
    <rect x="60" y="197" width="90" height="36" fill="#eee6f3" stroke="#8900e1" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="105" y="220" fill="#8900e1" font-size="15" font-weight="700" text-anchor="middle">?</text>
    <rect x="150" y="197" width="320" height="36" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
    <text x="310" y="220" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle">5</text>

    <!-- q lane: unknown until posedge 1, then ram[5] -->
    <rect x="60" y="262" width="90" height="36" fill="#eee6f3" stroke="#8900e1" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="105" y="285" fill="#8900e1" font-size="15" font-weight="700" text-anchor="middle">?</text>
    <rect x="150" y="262" width="320" height="36" fill="#ffffff" stroke="#57068c" stroke-width="3"/>
    <text x="310" y="285" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle">ram[5]</text>

    <!-- cycle labels -->
    <text x="105" y="316" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">cycle 1</text>
    <text x="310" y="316" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">cycle 2</text>

    <!-- time arrow -->
    <line x1="470" y1="150" x2="510" y2="150" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
    <path d="M510,150 L500,145 L500,155 Z" fill="#404040"/>
    <text x="517" y="155" fill="#6d6d6d" font-size="13" font-style="italic">t</text>

    <text x="320" y="352" fill="#57068c" font-size="16" font-weight="700" text-anchor="middle">addr_reg &#8212; and q right behind it &#8212; only update AT the clock edge</text>
    <text x="320" y="371" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">ask for ram[5] during cycle 1; the answer isn't ready until cycle 2</text>
  </g>
</svg>
