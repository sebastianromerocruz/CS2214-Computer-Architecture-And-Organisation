<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="300" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="656" cy="276" r="7" fill="#7b5aa6"/>

  <text x="48" y="55" fill="#57068c" font-size="18" font-weight="700">clk</text>
  <text x="44" y="118" fill="#404040" font-size="14" font-weight="600" text-anchor="end">1</text>
  <text x="44" y="188" fill="#404040" font-size="14" font-weight="600" text-anchor="end">0</text>

  <!-- square wave -->
  <path d="M60,180 L110,180 L110,110 L230,110 L230,180 L280,180 L280,110 L400,110 L400,180 L460,180"
        fill="none" stroke="#404040" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- time arrow -->
  <line x1="460" y1="180" x2="505" y2="180" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
  <path d="M505,180 L495,175 L495,185 Z" fill="#404040"/>
  <text x="512" y="185" fill="#6d6d6d" font-size="13" font-style="italic">t</text>

  <!-- rising edge markers -->
  <line x1="110" y1="110" x2="110" y2="68" stroke="#8900e1" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="110" cy="110" r="5" fill="#57068c"/>
  <text x="110" y="60" fill="#57068c" font-size="12" font-weight="700" text-anchor="middle">posedge</text>

  <line x1="280" y1="110" x2="280" y2="68" stroke="#8900e1" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="280" cy="110" r="5" fill="#57068c"/>
  <text x="280" y="60" fill="#57068c" font-size="12" font-weight="700" text-anchor="middle">posedge</text>

  <!-- period bracket -->
  <line x1="110" y1="225" x2="280" y2="225" stroke="#57068c" stroke-width="3"/>
  <line x1="110" y1="218" x2="110" y2="232" stroke="#57068c" stroke-width="3"/>
  <line x1="280" y1="218" x2="280" y2="232" stroke="#57068c" stroke-width="3"/>
  <text x="195" y="246" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">clock period</text>

  <text x="340" y="272" fill="#57068c" font-size="20" font-weight="700" text-anchor="middle">rising edges are the only moments that matter</text>
  <text x="340" y="290" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">between two posedges, a clocked circuit is frozen no matter how its inputs wiggle</text>
</svg>
