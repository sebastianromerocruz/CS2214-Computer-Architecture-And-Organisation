<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="340" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="496" cy="316" r="7" fill="#7b5aa6"/>

  <!-- flip-flop body -->
  <rect x="200" y="90" width="180" height="130" rx="14" fill="#ffffff" stroke="#57068c" stroke-width="6"/>
  <text x="230" y="135" fill="#404040" font-size="22" font-weight="700">D</text>
  <text x="345" y="135" fill="#404040" font-size="22" font-weight="700">Q</text>

  <!-- D input -->
  <line x1="110" y1="130" x2="200" y2="130" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="130" r="6" fill="#57068c"/>
  <text x="95" y="125" fill="#404040" font-size="18" font-weight="600" text-anchor="end">D</text>

  <!-- Q output -->
  <line x1="380" y1="130" x2="470" y2="130" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="470" cy="130" r="6" fill="#57068c"/>
  <text x="485" y="136" fill="#404040" font-size="18" font-weight="700">Q</text>

  <!-- clock input, edge-trigger marker -->
  <polygon points="210,220 240,220 225,202" fill="#eee6f3" stroke="#57068c" stroke-width="4" stroke-linejoin="round"/>
  <line x1="225" y1="220" x2="225" y2="260" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="225" cy="260" r="6" fill="#57068c"/>
  <text x="225" y="280" fill="#404040" font-size="16" font-weight="600" text-anchor="middle">CLK</text>

  <text x="260" y="308" fill="#57068c" font-size="19" font-weight="700" text-anchor="middle">sample on the edge, hold otherwise</text>
  <text x="260" y="326" fill="#6d6d6d" font-size="12" font-style="italic" text-anchor="middle">one bit in, one bit out—stack n of these, sharing CLK, for an n-bit register</text>
</svg>
