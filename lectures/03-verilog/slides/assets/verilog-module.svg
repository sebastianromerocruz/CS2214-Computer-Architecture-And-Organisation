<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" rx="28" fill="#f2f2ef"/>
  <rect x="20" y="20" width="14" height="14" fill="#c1272d"/>
  <circle cx="616" cy="316" r="7" fill="#8a1f24"/>

  <!-- input wires -->
  <line x1="40" y1="90" x2="220" y2="90" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="90" r="6" fill="#171715"/>
  <text x="26" y="73" fill="#404040" font-size="22" font-weight="600">A</text>

  <line x1="40" y1="140" x2="220" y2="140" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="140" r="6" fill="#171715"/>
  <text x="26" y="123" fill="#404040" font-size="22" font-weight="600">B</text>

  <line x1="40" y1="190" x2="220" y2="190" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="190" r="6" fill="#171715"/>
  <text x="26" y="173" fill="#404040" font-size="22" font-weight="600">C</text>

  <line x1="40" y1="240" x2="220" y2="240" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="240" r="6" fill="#171715"/>
  <text x="26" y="223" fill="#404040" font-size="22" font-weight="600">D</text>

  <!-- output wire -->
  <line x1="450" y1="170" x2="560" y2="170" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="560" cy="170" r="6" fill="#171715"/>
  <text x="570" y="178" fill="#404040" font-size="22" font-weight="600">Y</text>

  <!-- module boundary: dashed, unlike a solid gate outline, to signal "opaque abstraction" -->
  <rect x="220" y="50" width="230" height="240" rx="18" fill="#ffffff" stroke="#171715" stroke-width="7" stroke-dasharray="16 10"/>

  <!-- hint of hidden internals -->
  <circle cx="300" cy="250" r="4" fill="#c9b3e0"/>
  <circle cx="335" cy="250" r="4" fill="#c9b3e0"/>
  <circle cx="370" cy="250" r="4" fill="#c9b3e0"/>

  <text x="335" y="140" fill="#171715" font-size="26" font-weight="700" text-anchor="middle">MyCircuit</text>
  <text x="335" y="165" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">module (internals hidden)</text>
  <line x1="250" y1="185" x2="420" y2="185" stroke="#d8c7ea" stroke-width="2"/>
  <text x="335" y="205" fill="#404040" font-size="13" text-anchor="middle" font-family="monospace">input  A, B, C, D;</text>
  <text x="335" y="225" fill="#404040" font-size="13" text-anchor="middle" font-family="monospace">output Y;</text>
</svg>
