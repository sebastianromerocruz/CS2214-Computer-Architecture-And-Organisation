<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="380" rx="28" fill="#f2f2ef"/>
  <rect x="24" y="24" width="14" height="14" fill="#c1272d"/>
  <circle cx="676" cy="356" r="7" fill="#8a1f24"/>

  <!-- ===== Input pins ===== -->
  <circle cx="40" cy="50" r="7" fill="#171715"/>
  <text x="26" y="33" fill="#404040" font-size="22" font-weight="600">A</text>
  <line x1="40" y1="50" x2="150" y2="50" stroke="#404040" stroke-width="5" stroke-linecap="round"/>

  <circle cx="40" cy="130" r="7" fill="#171715"/>
  <text x="26" y="113" fill="#404040" font-size="22" font-weight="600">B</text>
  <line x1="40" y1="130" x2="150" y2="130" stroke="#404040" stroke-width="5" stroke-linecap="round"/>

  <circle cx="40" cy="210" r="7" fill="#171715"/>
  <text x="26" y="193" fill="#404040" font-size="22" font-weight="600">C</text>
  <line x1="40" y1="210" x2="350" y2="210" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <line x1="350" y1="210" x2="350" y2="170" stroke="#404040" stroke-width="5" stroke-linecap="round"/>

  <circle cx="40" cy="290" r="7" fill="#171715"/>
  <text x="26" y="273" fill="#404040" font-size="22" font-weight="600">D</text>
  <line x1="40" y1="290" x2="430" y2="290" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <line x1="430" y1="290" x2="430" y2="245" stroke="#404040" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== NOT A (NA) ===== -->
  <path d="M150,25 L150,75 L210,50 Z" fill="#ffffff" stroke="#171715" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="217" cy="50" r="6" fill="#ffffff" stroke="#171715" stroke-width="4"/>
  <text x="157" y="20" fill="#6d6d6d" font-size="13" font-style="italic">NA</text>
  <line x1="223" y1="50" x2="270" y2="50" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="50" x2="270" y2="70" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <text x="226" y="44" fill="#171715" font-size="13" font-weight="700">nA</text>

  <!-- ===== NOT B (NB) ===== -->
  <path d="M150,105 L150,155 L210,130 Z" fill="#ffffff" stroke="#171715" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="217" cy="130" r="6" fill="#ffffff" stroke="#171715" stroke-width="4"/>
  <text x="157" y="172" fill="#6d6d6d" font-size="13" font-style="italic">NB</text>
  <line x1="223" y1="130" x2="270" y2="130" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="130" x2="270" y2="110" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <text x="226" y="124" fill="#171715" font-size="13" font-weight="700">nB</text>

  <!-- ===== AND1 (A1): nA &amp; nB -> W1 ===== -->
  <path d="M270,70 L286,70 A20,20 0 0 1 286,110 L270,110 Z" fill="#ffffff" stroke="#171715" stroke-width="5" stroke-linejoin="round"/>
  <text x="270" y="60" fill="#6d6d6d" font-size="13" font-style="italic">A1</text>
  <line x1="306" y1="90" x2="350" y2="90" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <line x1="350" y1="90" x2="350" y2="130" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <text x="309" y="84" fill="#171715" font-size="13" font-weight="700">W1</text>

  <!-- ===== AND2 (A2): W1 &amp; C -> W2 ===== -->
  <path d="M350,130 L366,130 A20,20 0 0 1 366,170 L350,170 Z" fill="#ffffff" stroke="#171715" stroke-width="5" stroke-linejoin="round"/>
  <text x="350" y="120" fill="#6d6d6d" font-size="13" font-style="italic">A2</text>
  <line x1="386" y1="150" x2="430" y2="150" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <line x1="430" y1="150" x2="430" y2="195" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <text x="389" y="144" fill="#171715" font-size="13" font-weight="700">W2</text>

  <!-- ===== NOR1 (O1): ~(W2 + D) -> Y ===== -->
  <path d="M430,195 C445,195 457,206 472,220 C457,234 445,245 430,245 C441,230 441,210 430,195 Z" fill="#ffffff" stroke="#171715" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="479" cy="220" r="6" fill="#ffffff" stroke="#171715" stroke-width="4"/>
  <text x="428" y="185" fill="#6d6d6d" font-size="13" font-style="italic">O1</text>

  <!-- ===== Output ===== -->
  <line x1="485" y1="220" x2="560" y2="220" stroke="#404040" stroke-width="5" stroke-linecap="round"/>
  <circle cx="560" cy="220" r="7" fill="#171715"/>
  <text x="575" y="228" fill="#404040" font-size="22" font-weight="600">Y</text>

  <!-- ===== Caption ===== -->
  <text x="350" y="355" fill="#171715" font-size="20" font-weight="700" text-anchor="middle">Y = ~((~A &amp; ~B &amp; C) + D)</text>
  <text x="350" y="373" fill="#6d6d6d" font-size="13" font-style="italic" text-anchor="middle">structural Verilog: one gate instance per operator, all wired simultaneously</text>
</svg>
