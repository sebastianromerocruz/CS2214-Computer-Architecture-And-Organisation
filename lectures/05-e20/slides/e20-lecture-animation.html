<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS-UY 2214 | The E20 Processor | Animated</title>
<link rel="stylesheet" href="../../_shared/theme/house.css">
<style>
  /* One deck for the whole E20 lecture, built on the E15 deck (same step engine).
     Same principle as the 03-verilog animations: a hand-rolled step machine
     driven by the arrow keys, one small change per step, plain language
     before jargon. Each section is a "scene" with its own diagram; the arrow
     keys run straight through all of them. Shift + arrow jumps a section.
     Question-and-answer form: at key beats the slide first asks a question
     (the diagram stays as the previous step left it) and the next key press
     reveals the diagram and the answer. Open with #3.5 to start at section 3,
     step 5 (answered), or #3.5q for the same step with the question showing. */

  html, body {
    margin: 0;
    height: 100%;
    background: var(--cream);
    overflow: hidden;
  }

  .slide {
    position: relative;
    width: 1333px;
    height: 750px;
    margin: 0 auto;
    padding: 40px 64px 76px;
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    position: relative;
    margin-top: 18px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .stage .num { color: var(--red); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .stage h1 { margin: 0; font-size: 30px; font-weight: 700; }

  .subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    font-style: italic;
    color: var(--mute);
  }

  .diagram-wrap {
    margin-top: 16px;
    background: #eee6f3;
    border-radius: 24px;
    padding: 10px 20px;
    position: relative;
  }

  .diagram-wrap .mark { position: absolute; top: 20px; left: 20px; width: 14px; height: 14px; background: #8900e1; }

  svg text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  svg * { transition: opacity 0.35s ease, fill 0.3s ease, stroke 0.3s ease; }

  svg .mv { transition: transform 0.6s ease; }

  .stps {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 14px;
    min-height: 38px;
  }

  .stp {
    min-width: 120px;
    text-align: center;
    padding: 6px 14px;
    border: 2px solid #d9d9d3;
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .stp.active { border-color: var(--red); color: var(--ink); background: #fbeceb; }
  .stp.done { border-color: var(--ink); color: var(--ink); }

  .narration {
    margin-top: 14px;
    font-size: 19px;
    line-height: 1.35;
    min-height: 52px;
  }

  .narration strong { color: var(--red); }
  .narration code {
    background: #171715;
    color: #f7f7f4;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .q { font-weight: 700; color: var(--ink); }
  .q .qm {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    margin-right: 12px;
    vertical-align: middle;
  }
  .q.big { font-size: 26px; line-height: 1.3; }
  .q.small { font-size: 15px; color: var(--mute); margin-bottom: 8px; font-weight: 600; }
  .q.small .qm { font-size: 11px; padding: 1px 7px; margin-right: 9px; }
  .q code { font-size: 0.85em; }
  .q.small code { background: #e2ded0; color: var(--ink); }

  .slide-footer {
    position: absolute;
    bottom: 24px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    border-top: 1px solid var(--rule);
    padding-top: 10px;
  }

  .step-indicator {
    position: absolute;
    top: 20px;
    right: 64px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .step-indicator .n { color: var(--red); font-weight: 700; }

  .hint {
    position: absolute;
    top: 20px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }

  .hint::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--red);
  }
</style>
</head>
<body>

<div class="slide">
  <div class="hint">&larr; / &rarr; step &nbsp;&middot;&nbsp; shift + &larr; / &rarr; section</div>
  <div class="step-indicator"><span id="sec-wrap">SECTION <span class="n" id="sec-n">1</span> / <span id="sec-total">9</span> &nbsp;&middot;&nbsp; </span>STEP <span class="n" id="step-n">1</span> / <span id="step-total">2</span></div>

  <div class="stage">
    <span class="num" id="num"></span>
    <h1 id="title">The E20 Processor</h1>
  </div>
  <p class="subtitle" id="subtitle"></p>

  <div class="diagram-wrap">
    <div class="mark"></div>
    <svg id="stage" viewBox="0 0 1150 400" width="100%" height="340"></svg>
  </div>

  <div class="stps" id="chips"></div>

  <div class="narration" id="narration"></div>

  <div class="slide-footer"><span id="foot-left">The E20 Processor</span><span>NYU Tandon | Fall 2026</span></div>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MONO = "'SF Mono', Menlo, Consolas, monospace";
  const C = {
    purple: "#57068c", accent: "#8900e1", dot: "#7b5aa6", ink: "#404040", grey: "#6d6d6d",
    lgrey: "#9f9f97", red: "#c1272d", bg: "#eee6f3", white: "#ffffff",
    t1: "#e9d9f5", t2: "#fbeceb", t3: "#e4e3db", t4: "#f3e9ff", t5: "#e2cdf2", t6: "#f7f0ff", t7: "#efe9dc",
  };

  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function grp(p, op) { const g = E("g", {}, p); g.style.opacity = op === undefined ? 1 : op; return g; }
  function rect(p, x, y, w, h, o) {
    o = o || {};
    const e = E("rect", { x, y, width: w, height: h, rx: o.rx || 0, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function txt(p, x, y, s, o) {
    o = o || {};
    const t = E("text", { x, y, fill: o.fill || C.ink, "font-size": o.size || 16, "font-weight": o.weight || 400, "text-anchor": o.anchor || "start" }, p, s);
    if (o.mono) t.style.fontFamily = MONO;
    if (o.italic) t.setAttribute("font-style", "italic");
    if (o.ls) t.setAttribute("letter-spacing", o.ls);
    if (o.pre) t.style.whiteSpace = "pre";
    return t;
  }
  function ln(p, x1, y1, x2, y2, o) {
    o = o || {};
    const e = E("line", { x1, y1, x2, y2, stroke: o.stroke || C.ink, "stroke-width": o.sw || 4, "stroke-linecap": "round" }, p);
    if (o.dash) e.setAttribute("stroke-dasharray", o.dash);
    return e;
  }
  function path(p, d, o) {
    o = o || {};
    return E("path", { d, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
  }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    return E("circle", { cx, cy, r, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0 }, p);
  }
  function poly(p, pts, o) {
    o = o || {};
    return E("polygon", { points: pts, fill: o.fill || "none", stroke: o.stroke || "none", "stroke-width": o.sw || 0, "stroke-linejoin": "round" }, p);
  }
  function vis(el, on) { el.style.opacity = on ? 1 : 0; }
  function arrowhead(p, x, y, dir, fill) {
    // dir: "r","l","d","u"
    const pts = { r: [x, y, x - 12, y - 7, x - 12, y + 7], l: [x, y, x + 12, y - 7, x + 12, y + 7],
                  d: [x, y, x - 7, y - 12, x + 7, y - 12], u: [x, y, x - 7, y + 12, x + 7, y + 12] }[dir];
    return poly(p, pts.join(","), { fill: fill || C.ink });
  }

  const scenes = [];
  function scene(def) { scenes.push(def); }
  // ---------- shared helpers for the E20 scenes ----------
  function codeRows(g, x, y0, dy, w, lines, o) {
    o = o || {};
    const rows = [], texts = [], addrs = [];
    lines.forEach((ln, i) => {
      const y = y0 + i * dy;
      rows.push(rect(g, x, y - dy + 8, w, dy - 2, { rx: 6 }));
      addrs.push(txt(g, x + 26, y, ln.a === undefined ? "" : String(ln.a), { size: 15, mono: true, fill: C.lgrey, anchor: "middle" }));
      texts.push(txt(g, x + 56, y, ln.t, { size: o.size || 17, weight: 600, mono: true, pre: true, fill: ln.dim ? C.lgrey : C.ink }));
    });
    return { rows, texts, addrs };
  }
  function regBoxes(g, x0, y0, w, h, dx, dy, vals) {
    const boxes = [], vs = [];
    for (let i = 0; i < 8; i++) {
      const x = x0 + (i % 4) * dx, y = y0 + Math.floor(i / 4) * dy;
      boxes.push(rect(g, x, y, w, h, { rx: 10, fill: i === 0 ? "#dcd2e6" : C.white, stroke: C.purple, sw: 4 }));
      txt(g, x + 10, y + 20, "$" + i, { size: 14, weight: 700, mono: true, fill: C.purple });
      vs.push(txt(g, x + w / 2, y + h - 14, String(vals[i]), { size: 24, weight: 700, mono: true, anchor: "middle", fill: i === 0 ? C.grey : C.ink }));
    }
    return { boxes, vs };
  }

  // ---------- generic trace scene: code on the left, registers (and memory) on the right ----------
  function traceScene(cfg) {
    const rowH = cfg.rowH || 32, Y0 = 92;
    return {
      num: cfg.num, title: cfg.title, subtitle: cfg.subtitle, chips: cfg.chips || [],
      steps: cfg.steps,
      build(g) {
        const r = {};
        rect(g, 30, 52, 560, 320, { rx: 16, fill: C.white, stroke: C.purple, sw: 5 });
        txt(g, 58, 80, "ADDR", { size: 11, weight: 700, fill: C.grey, ls: 1 });
        txt(g, 100, 80, "E20 ASSEMBLY", { size: 13, weight: 700, fill: C.purple, ls: 1 });
        r.code = codeRows(g, 44, Y0 + 12, rowH, 536, cfg.lines, { size: cfg.size });
        r.chev = txt(g, 20, 0, "▶", { size: 15, fill: C.red });
        r.tags = [];
        (cfg.labels || []).forEach(([li, name]) => {
          const t = txt(g, 570, Y0 + 12 + li * rowH, name, { size: 13, weight: 700, mono: true, fill: C.accent, anchor: "end" });
          t.style.opacity = 0; r.tags.push(t);
        });
        r.reg = regBoxes(g, 620, 60, 118, 66, 128, 82, [0, 0, 0, 0, 0, 0, 0, 0]);
        txt(g, 620, 236, "PC", { size: 12, weight: 700, fill: C.grey, ls: 1 });
        rect(g, 620, 244, 130, 52, { rx: 10, fill: C.white, stroke: C.purple, sw: 4 });
        r.pc = txt(g, 685, 279, "0", { size: 24, weight: 700, mono: true, anchor: "middle", fill: C.purple });
        r.mem = [];
        if (cfg.mem) {
          txt(g, 790, 236, "MEMORY", { size: 12, weight: 700, fill: C.grey, ls: 1 });
          cfg.mem.forEach((a, i) => {
            const x = 790 + i * 92;
            const b = rect(g, x, 244, 84, 52, { rx: 10, fill: C.white, stroke: C.purple, sw: 4 });
            txt(g, x + 8, 262, "[" + a + "]", { size: 12, weight: 700, mono: true, fill: C.lgrey });
            const v = txt(g, x + 42, 288, "", { size: 20, weight: 700, mono: true, anchor: "middle" });
            r.mem.push({ a, b, v });
          });
        }
        r.note = txt(g, 620, 340, "", { size: 15, italic: true, fill: C.grey });
        return r;
      },
      render(s, r) {
        r.code.rows.forEach((el) => { el.setAttribute("fill", "none"); el.setAttribute("stroke", "none"); });
        if (s.ex !== null && s.ex !== undefined) { r.code.rows[s.ex].setAttribute("fill", C.t2); r.code.rows[s.ex].setAttribute("stroke", C.red); r.code.rows[s.ex].setAttribute("stroke-width", 3); }
        r.chev.setAttribute("y", Y0 + 12 + s.pc * rowH);
        r.pc.textContent = s.pcv !== undefined ? s.pcv : s.pc;
        r.reg.vs.forEach((v, i) => { v.textContent = s.regs[i]; });
        r.reg.boxes.forEach((b, i) => {
          const ch = s.changed === "r" + i;
          b.setAttribute("fill", ch ? C.t2 : (i === 0 ? "#dcd2e6" : C.white));
          b.setAttribute("stroke", ch ? C.red : C.purple);
        });
        r.mem.forEach((m) => {
          const v = s.mem ? s.mem[m.a] : undefined;
          m.v.textContent = v === undefined ? "0" : v;
          const ch = s.changed === "m" + m.a, rd = s.read === "m" + m.a;
          m.b.setAttribute("fill", ch ? C.t2 : (rd ? C.t4 : C.white));
          m.b.setAttribute("stroke", ch ? C.red : (rd ? C.accent : C.purple));
        });
        r.tags.forEach((t) => vis(t, !!s.labels));
        r.note.textContent = s.note || "";
      },
    };
  }

  // ================= Title slide =================
  (function () {
    const ROUTE = ["Why E15 Isn't Enough", "What's Inside the E20", "The Instruction Set", "Pseudo-Instructions", "Labels",
                   "Reading Programs", "Memory: lw and sw", "Wraparound", "Machine Code"];
    scene({
      front: true,
      num: "", title: "The E20 Processor", subtitle: "",
      chips: [],
      steps: [
        { view: "title", foot: "",
          narrate: "Today: the <strong>E20</strong>. Same fetch-execute skeleton as the E15, with enough room to write a program you'd actually call a program." },
        { view: "route", foot: "nine sections, one bigger processor",
          narrate: "Almost every feature of the E20 exists because of one specific problem. Each section starts with the problem, then shows the E20's answer." },
      ],
      build(g) {
        const r = {};
        r.title = grp(g, 1);
        rect(r.title, 130, 40, 890, 300, { rx: 24, fill: C.white, stroke: C.purple, sw: 7 });
        txt(r.title, 575, 104, "CS-UY 2214  |  WEEK V", { size: 15, weight: 700, fill: C.red, anchor: "middle", ls: 2 });
        txt(r.title, 575, 190, "The E20 Processor", { size: 66, weight: 700, fill: "#171715", anchor: "middle" });
        rect(r.title, 535, 214, 80, 6, { rx: 3, fill: C.accent });
        txt(r.title, 575, 258, "Assembly language and machine code", { size: 24, italic: true, fill: C.grey, anchor: "middle" });
        txt(r.title, 575, 312, "Computer Architecture and Organization", { size: 14, fill: C.lgrey, anchor: "middle", ls: 1 });

        r.route = grp(g, 0);
        txt(r.route, 575, 46, "TODAY'S ROUTE", { size: 13, weight: 700, fill: C.purple, anchor: "middle", ls: 2 });
        ROUTE.forEach((name, i) => {
          const col = i < 5 ? 0 : 1, row = col === 0 ? i : i - 5;
          const x = 150 + col * 460, y = 70 + row * 58;
          rect(r.route, x, y, 420, 48, { rx: 12, fill: C.white, stroke: C.purple, sw: 4 });
          circ(r.route, x + 30, y + 24, 15, { fill: C.purple });
          txt(r.route, x + 30, y + 30, String(i + 1), { size: 16, weight: 700, fill: C.white, anchor: "middle" });
          txt(r.route, x + 60, y + 31, name, { size: 19, weight: 700, fill: C.ink });
        });
        txt(r.route, 575, 372, "1 to 2: the machine   |   3 to 5: the vocabulary   |   6 to 8: running programs   |   9: the bits", { size: 13, italic: true, fill: C.grey, anchor: "middle" });
        return r;
      },
      render(s, r) { vis(r.title, s.view === "title"); vis(r.route, s.view === "route"); },
    });
  })();

  // ================= 1 Why E15 isn't enough =================
  (function () {
    const bad = [["4 registers", "constant shuffling: nowhere to park values"], ["16 words of ROM", "a loop and its surroundings barely fit"], ["no data memory", "no variables, arrays, or results"]];
    const good = [["8 registers, 16 bits each", "and $0 is hardwired to zero"], ["8192 cells, one memory", "code and data live together"], ["three instruction layouts", "spend the 16 bits where each needs them"]];
    scene({
      num: "1", title: "Why E15 Isn't Enough", subtitle: "Three things make the E15 a toy.",
      chips: ["Problems", "Answers", "Constraints"],
      steps: [
        { n: 0, chip: 1, foot: "the E15, one more time", narrate: "The E15 was deliberately tiny, so we could see the whole fetch-execute loop at once. But a toy that small can't do much." },
        { n: 1, chip: 1, foot: "problem 1", narrate: "Four registers means you're constantly shuffling values in and out of the only storage you have." },
        { n: 2, chip: 1, foot: "problem 2", narrate: "Sixteen words of ROM means a loop and the code around it barely fit together." },
        { n: 3, chip: 1, foot: "problem 3", narrate: "And there's <strong>nowhere to put data</strong>. The ROM holds instructions and can never be written." },
        { n: 4, chip: 2, foot: "fix 1", q: "If you could redesign it: what would you change first?",
          narrate: "More registers, and wider ones: <strong>eight 16-bit registers</strong>. One of them is special, and we'll see why in a minute." },
        { n: 5, chip: 2, foot: "fix 2", narrate: "One shared memory of <strong>8192 cells</strong> that both the program and its data live in." },
        { n: 6, chip: 2, foot: "fix 3", narrate: "And instead of one rigid instruction layout, <strong>three</strong>, each spending its bits differently." },
        { n: 7, chip: 3, foot: "the constraints behind everything today",
          narrate: "Here's how to read the rest of the lecture. Almost every feature exists because of a constraint: <strong>16 bits per instruction</strong>, only <strong>8 opcodes</strong>, <strong>no flags</strong>, and no way to name a place in memory. If a design looks odd, look for the bit budget." },
      ],
      build(g) {
        const r = { bad: [], good: [], arr: [] };
        txt(g, 270, 46, "E15", { size: 16, weight: 700, fill: C.red, anchor: "middle", ls: 2 });
        txt(g, 880, 46, "E20", { size: 16, weight: 700, fill: C.accent, anchor: "middle", ls: 2 });
        bad.forEach(([a, b], i) => {
          const y = 66 + i * 86, e = grp(g, 0);
          rect(e, 40, y, 460, 72, { rx: 14, fill: C.t2, stroke: C.red, sw: 4 });
          txt(e, 64, y + 32, a, { size: 22, weight: 700 });
          txt(e, 64, y + 56, b, { size: 15, italic: true, fill: C.grey });
          r.bad.push(e);
          const ar = grp(g, 0);
          ln(ar, 520, y + 36, 640, y + 36, { stroke: C.accent, sw: 4 }); arrowhead(ar, 650, y + 36, "r", C.accent);
          r.arr.push(ar);
          const f = grp(g, 0);
          rect(f, 660, y, 460, 72, { rx: 14, fill: C.t1, stroke: C.purple, sw: 4 });
          txt(f, 684, y + 32, good[i][0], { size: 22, weight: 700, fill: C.purple });
          txt(f, 684, y + 56, good[i][1], { size: 15, italic: true, fill: C.grey });
          r.good.push(f);
        });
        r.ban = grp(g, 0);
        rect(r.ban, 40, 328, 1080, 52, { rx: 14, fill: C.white, stroke: C.purple, sw: 5 });
        txt(r.ban, 580, 361, "16 bits per instruction   |   8 opcodes   |   no flags   |   no way to name a place", { size: 21, weight: 700, mono: true, fill: C.purple, anchor: "middle" });
        return r;
      },
      render(s, r) {
        r.bad.forEach((e, i) => vis(e, s.n > i));
        r.good.forEach((e, i) => vis(e, s.n > 3 + i));
        r.arr.forEach((e, i) => vis(e, s.n > 3 + i));
        vis(r.ban, s.n >= 7);
      },
    });
  })();

  // ================= 2 What's inside the E20 =================
  (function () {
    const B = (n) => n.split("").map((c) => c);
    scene({
      num: "2", title: "What's Inside the E20", subtitle: "Registers, a program counter, and one memory.",
      chips: ["Registers", "Program counter", "Memory"],
      steps: [
        { n: 0, view: "main", chip: 1, foot: "an empty E20", narrate: "Same idea as the E15's box: everything the machine remembers, and nothing else." },
        { n: 1, view: "main", chip: 1, foot: "eight registers, 16 bits each", narrate: "Eight <strong>16-bit registers</strong>, <code>$0</code> through <code>$7</code>." },
        { n: 2, view: "main", chip: 1, foot: "$0 is hardwired to zero", q: "One of these can only ever be zero. Why would you build that?",
          narrate: "Because a permanent zero replaces instructions we can't afford: load a constant (<code>$0 + 34</code>), copy a register (<code>$2 + $0</code>), test for zero. Writes to <code>$0</code> are quietly thrown away." },
        { n: 3, view: "main", chip: 2, foot: "the program counter", narrate: "A 16-bit <strong>program counter</strong>, exactly like E15's: no instruction can name it, and it only moves by incrementing or being overwritten by a jump." },
        { n: 4, view: "main", chip: 3, foot: "8192 cells, 16 bits each", narrate: "One memory of <strong>8192 cells</strong>, each 16 bits wide. That's 2<sup>13</sup>, so an address needs exactly 13 bits." },
        { n: 5, view: "main", chip: 3, foot: "the program is loaded at address 0", narrate: "The program itself is loaded into that memory, starting at address 0. Code and data share one array: a cell is an instruction only because the <code>pc</code> fetches it." },
        { n: 6, view: "trunc", chip: 3, foot: "registers are wider than addresses", q: "A register holds 16 bits, but an address needs 13. What happens to the extra 3?",
          narrate: "They're <strong>ignored</strong>. 43222 and 2262 differ only in their top three bits, so they are the same cell. It's the cheapest possible fix for the mismatch." },
      ],
      build(g) {
        const r = {};
        r.main = grp(g, 1);
        rect(r.main, 40, 34, 1070, 330, { rx: 20, fill: C.white, stroke: C.purple, sw: 7 });

    ];
    const ops = [["000", "three-register family"], ["001", "addi"], ["010", "j"], ["011", "jal"], ["100", "lw"], ["101", "sw"], ["110", "jeq"], ["111", "slti"]];
    const subs = [["0000", "add"], ["0001", "sub"], ["0010", "or"], ["0011", "and"], ["0100", "slt"], ["1000", "jr"]];
    scene({
      num: "9.1", title: "Machine Code: The Three Formats", subtitle: "Every instruction must fit in 16 bits, but they need very different things.",
      chips: ["The problem", "Three layouts", "Opcodes", "j vs. jal"],
      steps: [
        { view: "need", n: 0, chip: 1, foot: "one layout can't do it", narrate: "<code>add</code> needs three registers (9 bits). <code>addi</code> needs two registers and a constant. <code>j</code> needs one huge address (13 bits). One layout with room for all of that would need more than 22 bits, and we have 16. Shrink it and you cripple either <code>j</code> or <code>addi</code>." },
        { view: "fmt", n: 1, chip: 2, foot: "three registers", narrate: "So don't use one layout: <strong>use three, and let the opcode say which</strong>. Three-register instructions: three 3-bit register fields, plus 4 bits left over." },
        { view: "fmt", n: 2, chip: 2, foot: "two registers", narrate: "Two registers: the two fields leave <strong>7 bits</strong> for a signed immediate (-64 to 63)." },
        { view: "fmt", n: 3, chip: 2, foot: "no registers", narrate: "No registers: all 13 leftover bits go to the target, enough to reach every cell of memory. The fewer registers you name, the more bits the immediate gets." },
        { view: "ops", n: 4, chip: 3, foot: "eight opcodes", q: "The opcode is 3 bits: only 8 values. But there are 13 instructions. How do they fit?",
          narrate: "The six three-register instructions all share <strong>opcode 000</strong>, and the spare 4 bits, the <strong>sub-opcode</strong>, say which one. The other seven opcodes go to one instruction each." },
        { view: "ops", n: 5, chip: 4, foot: "j and jal share a layout, not an opcode", q: "<code>j</code> and <code>jal</code> use the exact same no-register layout. So how does the processor tell them apart?",
          narrate: "By the opcode, same as always: <code>j</code> is <strong>010</strong>, <code>jal</code> is <strong>011</strong>. Sharing a <em>layout</em> just means both spend their 16 bits the same way (3-bit opcode, 13-bit target); it doesn't mean they share an opcode value. Only the three-register family actually shares one opcode, which is exactly why <em>it</em> needs the extra sub-opcode field and these two don't." },
      ],
      build(g) {
        const r = {};
        r.need = grp(g, 1);
        [["add", "9 bits of registers"], ["addi", "6 bits + a constant"], ["j", "13 bits of address"]].forEach(([a, b], i) => {
          const x = 60 + i * 350;
          rect(r.need, x, 90, 320, 130, { rx: 16, fill: [C.t1, C.t4, C.t5][i], stroke: C.purple, sw: 5 });
          txt(r.need, x + 160, 144, a, { size: 40, weight: 700, mono: true, fill: C.purple, anchor: "middle" });
          txt(r.need, x + 160, 190, b, { size: 18, italic: true, anchor: "middle" });
        });
        txt(r.need, 575, 290, "one layout for all three: 22+ bits", { size: 26, weight: 700, mono: true, fill: C.red, anchor: "middle" });
        txt(r.need, 575, 330, "available: 16", { size: 22, weight: 700, mono: true, fill: C.purple, anchor: "middle" });
        r.fmt = grp(g, 0);
        for (let i = 0; i < 16; i++) txt(r.fmt, X0 + i * BW + BW / 2, 44, String(15 - i), { size: 11, fill: C.lgrey, anchor: "middle" });
        r.rows = fmts.map((F, k) => {
          const e = grp(r.fmt, 0), y = 84 + k * 96;
          txt(e, X0, y - 8, F.name, { size: 15, weight: 700, fill: C.ink });
          let pos = 0;
          F.f.forEach(([nm, w], j) => {
            rect(e, X0 + pos * BW, y, w * BW, 42, { rx: 0, fill: [C.t1, C.t4, C.t5, C.t6, C.t7][j % 5], stroke: C.purple, sw: 4 });
            txt(e, X0 + (pos + w / 2) * BW, y + 27, nm, { size: 13, weight: 700, fill: C.purple, anchor: "middle" });
            txt(e, X0 + (pos + w / 2) * BW, y + 62, w + " bits", { size: 11, italic: true, fill: C.grey, anchor: "middle" });
            pos += w;
          });
          return e;
        });
        r.ops = grp(g, 0);
        ops.forEach(([b, n], i) => {
          const y = 40 + i * 42;
          rect(r.ops, 60, y, 480, 36, { rx: 8, fill: i === 0 ? C.t5 : C.t1, stroke: C.purple, sw: 3 });
          txt(r.ops, 84, y + 25, b, { size: 20, weight: 700, mono: true, fill: C.purple });
          txt(r.ops, 170, y + 25, n, { size: 18, weight: 600, mono: true });
        });
        txt(r.ops, 660, 60, "SUB-OPCODE (last 4 bits, when opcode = 000)", { size: 12, weight: 700, fill: C.grey, ls: 1 });
        subs.forEach(([b, n], i) => {
          const y = 76 + i * 42;
          rect(r.ops, 660, y, 400, 36, { rx: 8, fill: C.t4, stroke: C.purple, sw: 3 });
          txt(r.ops, 684, y + 25, b, { size: 20, weight: 700, mono: true, fill: C.purple });
          txt(r.ops, 790, y + 25, n, { size: 18, weight: 600, mono: true });
        });
        return r;
      },
      render(s, r) {
        vis(r.need, s.view === "need"); vis(r.fmt, s.view === "fmt"); vis(r.ops, s.view === "ops");
        r.rows.forEach((e, i) => vis(e, s.n >= 1 + i));
      },
    });
  })();

  // ================= 9.2 Translating =================
  (function () {
    const BW = 62, X0 = (1150 - 16 * BW) / 2 + 0;
    // encode addi $1,$1,-1 -> 001 001 001 1111111 ; decode 101 001 011 0000010
    const enc = [["001", 3, "addi"], ["001", 3, "$1 (src)"], ["001", 3, "$1 (dst)"], ["1111111", 7, "-1"]];
    const dec = [["101", 3, "sw"], ["001", 3, "$1 (address)"], ["011", 3, "$3 (stored)"], ["0000010", 7, "2"]];
    const cols = [C.t1, C.t4, C.t5, C.t6];
    scene({
      num: "9.2", title: "Translating, Step by Step", subtitle: "A lookup-and-fill-in-the-boxes procedure.",
      chips: ["Assembly to bits", "Bits to assembly"],
      steps: [
        { mode: "enc", k: 0, chip: 1, foot: "1. find the format", narrate: "To translate <code>addi $1, $1, -1</code>: <strong>count the registers</strong> (two), which tells you the layout: 3 + 3 + 3 + 7." },
        { mode: "enc", k: 1, chip: 1, foot: "2. look up the opcode", narrate: "Look up the opcode in the table: <code>addi</code> is <code>001</code>." },
        { mode: "enc", k: 2, chip: 1, foot: "3. registers, 3 bits each", narrate: "Registers are 3 bits each. Field order in the <em>bits</em> puts the source first: <code>$1</code> is <code>001</code>." },
        { mode: "enc", k: 3, chip: 1, foot: "the destination is $1 too", narrate: "The destination, also <code>$1</code>: <code>001</code>." },
        { mode: "enc", k: 4, chip: 1, foot: "4. the immediate, in two's complement", q: "What is <code>-1</code> in 7-bit two's complement?",
          narrate: "Write 1 as <code>0000001</code>, flip the bits (<code>1111110</code>), add 1: <strong><code>1111111</code></strong>." },
        { mode: "enc", k: 5, chip: 1, foot: "5. concatenate: exactly 16 bits", narrate: "Concatenate, and check you have exactly 16 bits: <code>0010010011111111</code>, which is <strong>9471</strong> in decimal." },
        { mode: "dec", k: 0, chip: 2, foot: "the other direction", q: "Decode <code>1010010110000010</code>. Where do you start?",
          narrate: "Start with the top three bits: <code>101</code>. The <strong>opcode alone tells you the whole layout</strong>: <code>101</code> is <code>sw</code>, so two registers and a 7-bit immediate." },
        { mode: "dec", k: 1, chip: 2, foot: "slice: 3 / 3 / 3 / 7", narrate: "Slice it 3 / 3 / 3 / 7. The first register field, <code>001</code>, is the address register: <code>$1</code>." },
        { mode: "dec", k: 2, chip: 2, foot: "the second is the stored register", narrate: "The second, <code>011</code>, is the register being stored: <code>$3</code>." },
        { mode: "dec", k: 3, chip: 2, foot: "sw $3, 2($1)", narrate: "The immediate <code>0000010</code> is 2. So: <code>sw $3, 2($1)</code>, store <code>$3</code> into the cell at <code>$1 + 2</code>." },
      ],
      build(g) {
        const r = {};
        r.title = txt(g, 575, 64, "", { size: 34, weight: 700, mono: true, fill: C.accent, anchor: "middle" });
        r.f = [];
        for (let i = 0; i < 4; i++) {
          const e = grp(g, 0);
          r.f.push(e);
        }
        r.data = { enc: enc, dec: dec };
        r.fx = []; r.fb = []; r.fl = [];
        // 4 fields at fixed slots
        const widths = [3, 3, 3, 7];
        let pos = 0;
        widths.forEach((w, i) => {
          const x = X0 + pos * BW;
          rect(r.f[i], x, 130, w * BW, 74, { rx: 0, fill: cols[i], stroke: C.purple, sw: 5 });
          r.fb.push(txt(r.f[i], x + (w * BW) / 2, 180, "", { size: 34, weight: 700, mono: true, fill: C.purple, anchor: "middle" }));
          r.fl.push(txt(r.f[i], x + (w * BW) / 2, 236, "", { size: 17, weight: 700, anchor: "middle" }));
          pos += w;
        });
        for (let i = 0; i < 16; i++) txt(g, X0 + i * BW + BW / 2, 118, String(15 - i), { size: 11, fill: C.lgrey, anchor: "middle" });
        r.dec = txt(g, 575, 300, "", { size: 26, weight: 700, mono: true, fill: C.ink, anchor: "middle" });
        r.sub = txt(g, 575, 340, "", { size: 18, italic: true, fill: C.grey, anchor: "middle" });
        return r;
      },
      render(s, r) {
        const D = s.mode === "enc" ? enc : dec;
        r.title.textContent = s.mode === "enc" ? "addi $1, $1, -1" : "1010010110000010";
        r.f.forEach((e, i) => {
          vis(e, s.mode === "enc" ? i < Math.min(s.k, 4) : i <= s.k);
          r.fb[i].textContent = D[i][0];
          r.fl[i].textContent = D[i][2];
        });
        if (s.mode === "enc") r.dec.textContent = s.k >= 5 ? "0010010011111111  =  9471" : (s.k === 0 ? "3 + 3 + 3 + 7 bits" : "");
        else r.dec.textContent = s.k >= 3 ? "sw $3, 2($1)" : "";
        r.sub.textContent = s.mode === "enc" && s.k >= 3 ? "(in the bits, the source register comes before the destination: the reverse of how you write it)" : "";
      },
    });
  })();

  // ================= 9.3 jeq is the odd one out =================
  (function () {
    const lines = [
      { a: 0, t: "movi $1, 10" }, { a: 1, t: "jeq  $1, $0, done   (beginning)" }, { a: 2, t: "addi $1, $1, -1" },
      { a: 3, t: "j    beginning" }, { a: 4, t: "halt   (done)" },
    ];
    scene({
      num: "9.3", title: "jeq Is the Odd One Out", subtitle: "Its immediate is not the target: it's an offset from where you are.",
      chips: ["Problem", "Offset", "Encode", "Backward"],
      steps: [
        { n: 0, chip: 1, foot: "the bits don't fit", narrate: "Every other instruction encodes its immediate as written. <code>jeq</code> can't: it names two registers, leaving 7 bits, but an address takes 13. A 7-bit <em>absolute</em> address could only reach the first 128 cells." },
        { n: 1, chip: 1, foot: "branches go short distances", narrate: "The rescue: conditional jumps almost always go a <strong>short distance</strong>. An <code>if</code> skips a few instructions; a loop goes back a few. So encode <em>how far to go from here</em>, and a small signed number is plenty." },
        { n: 2, chip: 2, foot: "counted from the NEXT instruction", narrate: "By the time <code>jeq</code> executes, the <code>pc</code> has already planned to move on, so the offset is counted from the <strong>next</strong> instruction: <code>pc &larr; pc + 1 + rel_imm</code>." },
        { n: 3, chip: 2, foot: "how far is done?", q: "The <code>jeq</code> is at address 1 and <code>done</code> is address 4. What offset should it hold?",
          narrate: "From the next instruction (2), the target (4) is <strong>two</strong> instructions away. So <code>rel_imm = 2</code>." },
        { n: 4, chip: 3, foot: "the formula", narrate: "That's the general rule: <code>rel_imm = target &minus; pc &minus; 1</code>, where <code>pc</code> is the address of the <code>jeq</code> itself. Here: 4 &minus; 1 &minus; 1 = 2." },
        { n: 5, chip: 3, foot: "110 001 000 0000010", narrate: "Encode it: opcode <code>110</code>, <code>$1</code> is <code>001</code>, <code>$0</code> is <code>000</code>, <code>rel_imm</code> 2 is <code>0000010</code>. Together: <code>1100010000000010</code>, which is <strong>50178</strong>." },
        { n: 6, chip: 4, foot: "a negative offset goes backward", narrate: "Backward jumps are just negative offsets. Suppose the loop ended with <code>jeq $0, $0, beginning</code> at address 3: <code>rel_imm = 1 &minus; 3 &minus; 1 = &minus;3</code>, or <code>1111101</code>. Check by running it forwards: <code>3 + 1 &minus; 3 = 1</code>. It lands on <code>beginning</code>." },
      ],
      build(g) {
        const r = {};
        rect(g, 30, 52, 520, 320, { rx: 16, fill: C.white, stroke: C.purple, sw: 5 });
        txt(g, 58, 82, "ADDR", { size: 11, weight: 700, fill: C.grey, ls: 1 });
        txt(g, 100, 82, "E20 ASSEMBLY", { size: 13, weight: 700, fill: C.purple, ls: 1 });
        r.hlJ = rect(g, 44, 128 + 44 - 28, 496, 38, { rx: 6, fill: C.t2, stroke: C.red, sw: 3 });
        r.hlJ.style.opacity = 0;
        r.hlT = rect(g, 44, 128 + 4 * 44 - 28, 496, 38, { rx: 6, fill: C.t4, stroke: C.accent, sw: 3 });
        r.hlT.style.opacity = 0;
        r.code = codeRows(g, 44, 128, 44, 496, lines, { size: 18 });
        r.next = txt(g, 20, 128 + 2 * 44, "▶", { size: 15, fill: C.red });
        r.next.style.opacity = 0;
        r.arc = path(g, "M 560 128 C 600 130 600 230 560 306", { stroke: C.red, sw: 4 });
        r.arcHead = poly(g, "552,306 566,296 566,314", { fill: C.red });
        r.arc.style.opacity = 0; r.arcHead.style.opacity = 0;
        r.p = grp(g, 0);
        rect(r.p, 640, 52, 480, 320, { rx: 16, fill: C.white, stroke: C.purple, sw: 5 });
        r.pt = txt(r.p, 664, 92, "", { size: 15, weight: 700, fill: C.purple, ls: 1 });
        r.l1 = txt(r.p, 664, 150, "", { size: 22, weight: 700, mono: true, pre: true });
        r.l2 = txt(r.p, 664, 200, "", { size: 22, weight: 700, mono: true, pre: true, fill: C.red });
        r.l3 = txt(r.p, 664, 250, "", { size: 22, weight: 700, mono: true, pre: true, fill: C.purple });
        r.l4 = txt(r.p, 664, 300, "", { size: 22, weight: 700, mono: true, pre: true, fill: C.accent });
        r.l5 = txt(r.p, 664, 346, "", { size: 15, italic: true, fill: C.grey });
        return r;
      },
      render(s, r) {
        vis(r.p, s.n >= 0);
        const n = s.n;
        vis(r.hlJ, n >= 2); vis(r.hlT, n >= 3 && n <= 5); vis(r.next, n >= 2 && n <= 4);
        vis(r.arc, n >= 3 && n <= 5); vis(r.arcHead, n >= 3 && n <= 5);
        const set = (a, b, c, d, e, f) => { r.pt.textContent = a; r.l1.textContent = b; r.l2.textContent = c; r.l3.textContent = d; r.l4.textContent = e; r.l5.textContent = f; };
        if (n === 0) set("THE BIT BUDGET", "3 opcode + 3 regA + 3 regB", "= 9 bits", "7 bits left for the target", "an address needs 13 bits", "7 bits absolute: only cells 0 to 127");
        else if (n === 1) set("THE OBSERVATION", "if:   skip a few", "loop: back a few", "", "", "so encode the distance, not the address");
        else if (n === 2) set("AT RUNTIME", "pc = 1  (the jeq)", "pc + 1 = 2  (next)", "pc = pc + 1 + rel_imm", "", "the offset is counted from pc + 1");
        else if (n === 3) set("HOW FAR?", "next = 2", "target = 4", "4 - 2 = 2 instructions", "", "so rel_imm = 2");
        else if (n === 4) set("THE FORMULA", "rel_imm = target - pc - 1", "         = 4 - 1 - 1", "         = 2", "", "");
        else if (n === 5) set("ENCODING", "110  001  000  0000010", "jeq  $1   $0   rel_imm=2", "= 1100010000000010", "= 50178", "");
        else set("BACKWARD", "jeq $0, $0, beginning   (at 3)", "rel_imm = 1 - 3 - 1 = -3", "-3 = 1111101", "3 + 1 + (-3) = 1", "it lands on beginning");
        r.l1.style.fontSize = n === 4 || n === 5 || n === 6 ? "20px" : "22px";
      },
    });
  })();

  // ---------------- engine ----------------
  const $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const foot = txt(svg, 575, 392, "", { size: 13, italic: true, fill: C.grey, anchor: "middle" });

  scenes.forEach((sc) => {
    sc.g = E("g", {}, svg);
    sc.g.style.display = "none";
    sc.r = sc.build(sc.g) || {};
    foot.parentNode.appendChild(foot);
  });
  $("sec-total").textContent = scenes.length - scenes.filter((x) => x.front).length;

  // si: section, ti: step, ph: 0 = question showing (diagram as before), 1 = answered
  const off = scenes.filter((x) => x.front).length;   // title slides don't count as sections
  let si = 0, ti = 0, ph = 1, shownScene = -1;
  const asks = (i, k) => !!scenes[i].steps[k].q;
  const startPh = (i, k) => (asks(i, k) && k > 0 ? 0 : 1);

  function readHash() {
    const m = location.hash.match(/^#(\d+)\.(\d+)(q?)$/);
    if (!m) { ph = startPh(si, ti); return; }
    const a = Number(m[1]) - 1 + off, b = Number(m[2]) - 1;
    if (a >= 0 && a < scenes.length) { si = a; ti = Math.max(0, Math.min(scenes[a].steps.length - 1, b)); }
    ph = m[3] && asks(si, ti) && ti > 0 ? 0 : 1;
  }

  function buildChips(sc) {
    const box = $("chips");
    box.innerHTML = "";
    sc.chips.forEach((label) => {
      const d = document.createElement("div");
      d.className = "stp";
      d.textContent = label;
      box.appendChild(d);
    });
  }

  function render() {
    const sc = scenes[si], s = sc.steps[ti];
    if (shownScene !== si) {
      scenes.forEach((x, k) => { x.g.style.display = k === si ? "inline" : "none"; });
      $("num").textContent = sc.num;
      $("title").textContent = sc.title;
      $("subtitle").textContent = sc.subtitle;
      document.querySelector(".stage").style.visibility = sc.front ? "hidden" : "";
      $("subtitle").style.visibility = sc.front ? "hidden" : "";
      $("sec-wrap").style.display = sc.front ? "none" : "";
      $("foot-left").textContent = sc.title;
      buildChips(sc);
      shownScene = si;
    }
    const asking = ph === 0 && !!s.q && ti > 0;
    // while a question is showing, the diagram stays exactly as the previous step left it
    sc.render(asking ? sc.steps[ti - 1] : s, sc.r, ti);
    foot.textContent = asking ? "" : (s.foot || "");
    const qm = '<span class="qm">Q</span>';
    $("narration").innerHTML = asking ? '<div class="q big">' + qm + s.q + '</div>'
      : (s.q ? '<div class="q small">' + qm + s.q + '</div>' : "") + s.narrate;
    $("sec-n").textContent = si - off + 1;
    $("step-n").textContent = ti + 1;
    $("step-total").textContent = sc.steps.length;
    document.querySelectorAll(".stp").forEach((chip, k) => {
      const n = k + 1;
      chip.classList.remove("active", "done");
      if (!s.chip) return;
      if (s.chip === n) chip.classList.add("active");
      else if (n < s.chip) chip.classList.add("done");
    });
    history.replaceState(null, "", "#" + (si - off + 1) + "." + (ti + 1) + (asking ? "q" : ""));
  }

  function go(d) {
    const sc = scenes[si];
    if (d > 0) {
      if (ph === 0) ph = 1;
      else if (ti < sc.steps.length - 1) { ti++; ph = startPh(si, ti); }
      else if (si < scenes.length - 1) { si++; ti = 0; ph = startPh(si, 0); }
    } else {
      if (ph === 1 && asks(si, ti) && ti > 0) ph = 0;
      else if (ti > 0) { ti--; ph = 1; }
      else if (si > 0) { si--; ti = scenes[si].steps.length - 1; ph = 1; }
    }
    render();
  }

  function jumpScene(d) {
    if (d < 0 && ti > 0) ti = 0;
    else si = Math.max(0, Math.min(scenes.length - 1, si + d)), ti = 0;
    ph = startPh(si, 0);
    render();
  }

  window.addEventListener("keydown", (e) => {
    const fwd = ["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key);
    const back = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!fwd && !back) return;
    e.preventDefault();
    if (e.shiftKey) jumpScene(fwd ? 1 : -1);
    else go(fwd ? 1 : -1);
  });

  window.addEventListener("hashchange", () => { readHash(); render(); });

  readHash();
  render();
})();
</script>

</body>
</html>
