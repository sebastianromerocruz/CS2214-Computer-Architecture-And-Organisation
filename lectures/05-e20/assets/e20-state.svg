<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" rx="28" fill="#eee6f3"/>
  <rect x="20" y="20" width="14" height="14" fill="#8900e1"/>
  <circle cx="736" cy="396" r="7" fill="#7b5aa6"/>
  <rect x="50" y="56" width="660" height="316" rx="18" fill="#ffffff" stroke="#57068c" stroke-width="7"/>
  <text x="380" y="92" fill="#57068c" font-size="22" font-weight="700" text-anchor="middle">E20</text>
  <text x="80" y="124" fill="#404040" font-size="14" font-weight="700">8 registers, 16 bits each</text>
  <text x="80" y="141" fill="#6d6d6d" font-size="11" font-style="italic">$0 is hardwired to zero</text>
  <rect x="80" y="152" width="36" height="38" rx="6" fill="#57068c" stroke="#57068c" stroke-width="3"/>
  <text x="98" y="176" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$0</text>
  <rect x="120" y="152" width="36" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="138" y="176" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$1</text>
  <rect x="160" y="152" width="36" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="178" y="176" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$2</text>
  <rect x="200" y="152" width="36" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="218" y="176" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$3</text>
  <rect x="240" y="152" width="36" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="258" y="176" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$4</text>
  <rect x="280" y="152" width="36" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="298" y="176" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$5</text>
  <rect x="320" y="152" width="36" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="338" y="176" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$6</text>
  <rect x="360" y="152" width="36" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="378" y="176" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$7</text>
  <text x="80" y="232" fill="#404040" font-size="14" font-weight="700">program counter</text>
  <text x="80" y="249" fill="#6d6d6d" font-size="11" font-style="italic">16 bits, only the low 13 count</text>
  <rect x="80" y="262" width="120" height="38" rx="6" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="140" y="287" fill="#57068c" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">pc</text>
  <text x="80" y="340" fill="#6d6d6d" font-size="12" font-style="italic">no zero flag, no separate ROM</text>
  <text x="440" y="124" fill="#404040" font-size="14" font-weight="700">one memory: 8192 cells, 16 bits each</text>
  <text x="440" y="141" fill="#6d6d6d" font-size="11" font-style="italic">code and data share it, program loaded at 0</text>
  <rect x="440" y="152" width="200" height="26" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="540" y="170" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ram[0]</text>
  <rect x="440" y="182" width="200" height="26" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="540" y="200" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ram[1]</text>
  <rect x="440" y="212" width="200" height="26" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="540" y="230" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ram[2]</text>
  <rect x="440" y="242" width="200" height="26" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="540" y="260" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ram[3]</text>
  <rect x="440" y="272" width="200" height="26" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="540" y="290" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">...</text>
  <rect x="440" y="302" width="200" height="26" fill="#eee6f3" stroke="#57068c" stroke-width="3"/>
  <text x="540" y="320" fill="#57068c" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ram[8191]</text>
